template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: JobParam
    type: STRING
    default: test-value
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'MERGE:JobParam={{Param.JobParam}},EnvParam={{Param.EnvParam}}')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: EnvParam
    type: STRING
    default: test-value
  environment:
    name: TestEnv
    variables:
      ENV_VAR: '{{Param.EnvParam}}'
expected:
  output:
  - MERGE:JobParam=test-value,EnvParam=test-value
  forbidden:
  - '{{Param.'
