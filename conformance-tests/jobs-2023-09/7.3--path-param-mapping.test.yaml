template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:{{Param.InputPath}}')
  parameterDefinitions:
  - name: InputPath
    type: PATH
    default: /original/path
expected:
  output:
  - RESULT:/original/path
