template:
  specificationVersion: jobtemplate-2023-09
  name: EnvStdoutSetVar
  jobEnvironments:
  - name: SetVarEnv
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - 'print(''openjd_env: MY_VAR=myvalue'')'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - import os; print('MY_VAR_IS:' + os.environ.get('MY_VAR', ''))
expected:
  output:
  - MY_VAR_IS:myvalue
