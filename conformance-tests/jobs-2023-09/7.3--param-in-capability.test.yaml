template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:{{Param.Quality}}')
  parameterDefinitions:
  - name: Quality
    type: STRING
    default: high
expected:
  output:
  - RESULT:high
  forbidden:
  - '{{Param.'
  - '{{Task.'
