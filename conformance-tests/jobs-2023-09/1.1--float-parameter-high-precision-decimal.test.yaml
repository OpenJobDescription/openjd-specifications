template:
  specificationVersion: jobtemplate-2023-09
  name: Job-{{Param.Scale}}
  parameterDefinitions:
  - name: Scale
    type: FLOAT
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:{{Param.Scale}}')
parameters:
  Scale: '3.141592653589793'
expected:
  output:
  - OUTPUT:3.141592653589793
