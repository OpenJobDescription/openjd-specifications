template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Foo
    type: INT
    minValue: 5
    maxValue: 10
    default: 8
  - name: Bar
    type: STRING
    minLength: 20
    maxLength: 30
    default: bbbbbbbbbbbbbbbbbbbbbbbbb
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'MERGE:Foo={{Param.Foo}},Bar={{Param.Bar}}')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Foo
    type: INT
    minValue: 1
    default: 8
  - name: Bar
    type: STRING
    minLength: 5
  environment:
    name: Env1
    variables:
      FOO: '{{Param.Foo}}'
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Foo
    type: INT
    maxValue: 20
  - name: Bar
    type: STRING
    maxLength: 50
    default: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  environment:
    name: Env2
    variables:
      BAR: '{{Param.Bar}}'
expected:
  output:
  - MERGE:Foo=8,Bar=bbbbbbbbbbbbbbbbbbbbbbbbb
