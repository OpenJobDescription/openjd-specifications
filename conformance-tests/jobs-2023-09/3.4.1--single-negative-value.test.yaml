template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Val
        type: INT
        range: '-10'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VAL:{{Task.Param.Val}}')
expected:
  output:
  - VAL:-10
  forbidden:
  - VAL:-11
  - VAL:-9
