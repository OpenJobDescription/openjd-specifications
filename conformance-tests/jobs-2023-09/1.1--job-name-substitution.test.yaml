template:
  specificationVersion: jobtemplate-2023-09
  name: Job-{{Param.Version}}
  parameterDefinitions:
  - name: Version
    type: STRING
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:{{Param.Version}}')
parameters:
  Version: '1.0'
expected:
  output:
  - OUTPUT:1.0
