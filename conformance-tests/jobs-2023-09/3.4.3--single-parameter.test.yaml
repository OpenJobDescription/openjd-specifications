template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: A
        type: STRING
        range:
        - '1'
        - '2'
        - '3'
      combination: A
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:A={{Task.Param.A}}')
expected:
  output:
  - TASK:A=1
  - TASK:A=2
  - TASK:A=3
  forbidden:
  - TASK:A=0
