template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  jobEnvironments:
  - name: TestEnv
    script:
      embeddedFiles:
      - name: config
        type: TEXT
        data: config data
      - name: reader
        type: TEXT
        data: 'import sys

          config_path = r''{{Env.File.config}}''

          print(f''CONFIG_PATH:{config_path}'')

          '
      actions:
        onEnter:
          command: python
          args:
          - '{{Env.File.reader}}'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print('TASK_RAN')
expected:
  output_posix:
  - CONFIG_PATH:/
  output_windows:
  - "CONFIG_PATH:"
  - ":\\"
