template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - REDACTED_ENV_VARS
  name: InitialLineRedacted
  jobEnvironments:
  - name: SecretEnv
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - 'print(''openjd_redacted_env: MY_SECRET=actual_secret_value'')'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print('done')
expected:
  output:
  - 'openjd_redacted_env: MY_SECRET=********'
  forbidden:
  - actual_secret_value
