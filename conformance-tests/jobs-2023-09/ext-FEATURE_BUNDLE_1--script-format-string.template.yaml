specificationVersion: jobtemplate-2023-09
extensions:
  - FEATURE_BUNDLE_1
name: ScriptFormatString
parameterDefinitions:
  - name: Message
    type: STRING
    default: "formatted_value"
steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('FORMAT_OUTPUT:{{Param.Message}}')"]
