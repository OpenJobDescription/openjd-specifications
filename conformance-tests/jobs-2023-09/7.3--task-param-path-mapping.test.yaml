template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: InputFile
        type: PATH
        range:
        - /path/to/file_a
        - /path/to/file_b
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:{{Task.Param.InputFile}}')
expected:
  output:
  - TASK:/path/to/file_a
  - TASK:/path/to/file_b
