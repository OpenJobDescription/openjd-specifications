template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Path
    type: PATH
    dataFlow: OUT
    default: /tmp/test
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'MERGE:success')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Path
    type: PATH
    dataFlow: IN
    default: /tmp/test
  environment:
    name: TestEnv
    variables:
      PATH_VAR: '{{Param.Path}}'
