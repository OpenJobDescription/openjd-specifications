template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - TASK_CHUNKING
  name: ChunkTest
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: 1-10
        chunks:
          defaultTaskCount: 5
          rangeConstraint: NONCONTIGUOUS
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'CHUNK:{{Task.Param.Frame}}')
expected:
  output:
  - CHUNK:1,6
  - CHUNK:2,7
  - CHUNK:3,8
  - CHUNK:4,9
  - CHUNK:5,10
