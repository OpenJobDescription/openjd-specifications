template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - TASK_CHUNKING
  name: ChunkTest
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: 1-5
        chunks:
          defaultTaskCount: 100
          rangeConstraint: CONTIGUOUS
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'CHUNK:{{Task.Param.Frame}}')
expected:
  output:
  - CHUNK:1-5
  forbidden:
  - CHUNK:1-1
  - CHUNK:6
