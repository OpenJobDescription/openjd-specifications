template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Middle
    type: STRING
    default: '5'
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Val
        type: INT
        range: 1,{{Param.Middle}},10
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VAL:{{Task.Param.Val}}')
expected:
  output:
  - VAL:1
  - VAL:5
  - VAL:10
  forbidden:
  - VAL:0
  - VAL:11
