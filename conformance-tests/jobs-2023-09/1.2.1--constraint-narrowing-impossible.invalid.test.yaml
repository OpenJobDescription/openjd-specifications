template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Count
    type: INT
    minValue: 0
    maxValue: 10
    default: 5
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'MERGE:success')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Count
    type: INT
    minValue: 20
    maxValue: 30
    default: 25
  environment:
    name: TestEnv
    variables:
      COUNT: '{{Param.Count}}'
