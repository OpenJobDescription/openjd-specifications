template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: A
        type: INT
        range: 1-10
      - name: B
        type: INT
        range: 1-10
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:A={{Task.Param.A}},B={{Task.Param.B}}')
expected:
  output:
  - TASK:A=1,B=1
  - TASK:A=10,B=10
  forbidden:
  - TASK:A=0
  - TASK:A=11
  - TASK:B=0
  - TASK:B=11
