specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
name: MixedEnvTest
jobEnvironments:
  - name: MixedEnv
    variables:
      PUBLIC_VAR: "public_value_visible"
    script:
      actions:
        onEnter:
          command: bash
          args: ["-c", "echo 'openjd_redacted_env: PRIVATE_VAR=private_value_hidden'"]
steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: bash
          args: ["-c", "echo PUBLIC:$PUBLIC_VAR PRIVATE:$PRIVATE_VAR"]
