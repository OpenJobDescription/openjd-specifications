specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
name: RedactionTest
jobEnvironments:
  - name: SecretEnv
    script:
      actions:
        onEnter:
          command: bash
          args: ["-c", "echo 'openjd_redacted_env: SECRET_KEY=super_secret_value_12345'"]
steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: bash
          args: ["-c", "echo SECRET_IS:$SECRET_KEY"]
