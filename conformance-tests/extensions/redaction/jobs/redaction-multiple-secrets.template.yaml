specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
name: MultiRedactTest
jobEnvironments:
  - name: MultiSecrets
    script:
      actions:
        onEnter:
          command: bash
          args:
            - "-c"
            - "echo 'openjd_redacted_env: SECRET1=value_one_secret'; echo 'openjd_redacted_env: SECRET2=value_two_secret'"
steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: bash
          args: ["-c", "echo S1:$SECRET1 S2:$SECRET2"]
