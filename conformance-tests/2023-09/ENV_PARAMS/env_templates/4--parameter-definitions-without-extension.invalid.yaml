# Template Schemas §4 item 3 and §1.2 item 3 (RFC 0010): an Environment's envParameterDefinitions require
# ENV_PARAMS in the document that contains them. This Environment Template lists no extensions.
specificationVersion: environment-2023-09
environment:
  name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
