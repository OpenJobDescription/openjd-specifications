# Template Schemas §4.5 (RFC 0010): dataFlow is permitted on a PATH Environment parameter, with the same
# shape as on a <JobParameterDefinition> of that type; it is informational and does not change how the Job runs.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
- EXPR
parameterDefinitions:
- name: Dir
  type: PATH
environment:
  name: Conda
  envParameterDefinitions:
  - name: CacheDir
    type: PATH
    default: "{{RawParam.Dir}}"
    dataFlow: IN
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
