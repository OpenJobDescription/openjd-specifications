# Template Schemas §4.5 item 1 (RFC 0010): a default may reference only Job Parameters defined in the same
# document. This Environment Template defines no CondaPackages, so the default is rejected, even though
# a Job Template it is attached to might define one.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
- EXPR
environment:
  name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: "{{Param.CondaPackages}}"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
