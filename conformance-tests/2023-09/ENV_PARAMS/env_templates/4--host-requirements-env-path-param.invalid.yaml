# Template Schemas §7.3.2 (RFC 0010): an Environment's hostRequirements may not reference its
# Env.Param.* of type PATH.
specificationVersion: environment-2023-09
extensions:
- ENV_PARAMS
- EXPR
parameterDefinitions:
- name: Dir
  type: PATH
environment:
  name: Gpu
  envParameterDefinitions:
  - name: CacheDir
    type: PATH
    default: "{{RawParam.Dir}}"
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{Env.Param.CacheDir}}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
