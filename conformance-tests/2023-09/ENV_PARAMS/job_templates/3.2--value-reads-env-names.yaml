# Template Schemas §3.2 <EnvironmentParameterValue> and §7.3.1 Job.EnvNames (RFC 0010): with ENV_PARAMS and
# EXPR, a parameters value may reference Job.EnvNames.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Tag
    type: STRING
    default: none
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Tag: "{{ Job.EnvNames.join(',') }}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
