# Template Schemas §7.6 rule 5 and Expression Language §2.1.6 (RFC 0010): at template validation the BOOL Job Parameter
# F is unresolved[bool], U here. Step A's entry for the ON_REQUEST Job Environment Lic has enableIf "Param.F or true". U
# or true is true, so the entry is known to be enabled and to request Lic. A does not supply Product, which has no
# default: a constraint 7 error at template validation.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: KnownEntryUOrTrue
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: Lic
  activation: ON_REQUEST
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "{{Env.Param.Product}}"]
steps:
- name: A
  dependencies:
  - environment: Lic
    enableIf: "Param.F or true"
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
