# Template Schemas §4 item 6 (RFC 0010): an Environment's enableIf requires ENV_PARAMS as well
# as EXPR, so it is rejected in a document that lists only EXPR.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR]
name: TestJob
jobEnvironments:
- name: Setup
  enableIf: true
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Setup]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
