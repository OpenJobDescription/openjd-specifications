# Template Schemas §1.1, §4 item 3, §3.2 item 3 (RFC 0010): with ENV_PARAMS, a Job Environment may declare
# a parameter, read it as Env.Param.<name>, and a Step may request the Environment and supply the value.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
