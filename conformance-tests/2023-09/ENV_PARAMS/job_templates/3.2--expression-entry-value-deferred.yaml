# Template Schemas §3.2 (checked-at paragraph) and §7.6 rules 5 and 6 (RFC 0010): whether an entry whose enableIf is
# not known at template validation is enabled is not known until the Job is created, and this entry's value is valid in
# any case. Without a target type "{{ abs('5') }}" has no matching signature, but if the entry is enabled the value is
# evaluated with the INT parameter's type as its target type and resolves to 5 (§3.2 <EnvironmentParameterValue>,
# Expression Language §1.3.1). So the template is valid, as it is when the entry has no enableIf.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Mode
  type: STRING
  allowedValues: ["on", "off"]
  default: "on"
jobEnvironments:
- name: Lic
  envParameterDefinitions:
  - name: N
    type: INT
    default: 1
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.N}}"]
steps:
- name: Render
  dependencies:
  - environment: Lic
    enableIf: "Param.Mode == 'on'"
    parameters:
      N: "{{ abs('5') }}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
