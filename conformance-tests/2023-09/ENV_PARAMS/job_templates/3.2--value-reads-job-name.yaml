# Template Schemas §3.2 <EnvironmentParameterValue> (RFC 0010): with EXPR, a parameters value may
# reference Job.Name.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Tag
    type: STRING
    default: none
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Tag: "{{Job.Name}}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
