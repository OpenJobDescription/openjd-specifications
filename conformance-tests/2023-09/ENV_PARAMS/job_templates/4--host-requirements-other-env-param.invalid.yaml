# Template Schemas §7.3.2 (RFC 0010): an Environment's hostRequirements may reference only that
# Environment's own Env.Param.*. Gpu declares no Flavor; only Conda does, so Gpu's reference is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Flavor
    type: STRING
    default: vanilla
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
- name: Gpu
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{Env.Param.Flavor}}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
