# Template Schemas §3.2 constraint 4 (RFC 0010): parameters, if provided, must contain at least one entry,
# so parameters: {} is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters: {}
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
