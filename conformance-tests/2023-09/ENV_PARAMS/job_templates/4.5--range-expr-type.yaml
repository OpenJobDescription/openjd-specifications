# Template Schemas §4.5 (RFC 0010): an Environment parameter may have any type available to a Job
# Parameter, so type RANGE_EXPR, with a literal <IntRangeExpr> default, is valid with EXPR.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: "1-10"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
