# Template Schemas §7.3.1 and §7.4 Template validation (RFC 0010): Job.EnvNames is unresolved[list[string]]
# at template validation, and upper() has no list receiver, so the expression is a type error.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["{{ Job.EnvNames.upper() }}"]
