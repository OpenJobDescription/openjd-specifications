# Template Schemas §4 item 4 constraint 1 (RFC 0010): <EnvironmentActivation> values are case-sensitive, so
# activation: always is not ALWAYS and is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  activation: always
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
