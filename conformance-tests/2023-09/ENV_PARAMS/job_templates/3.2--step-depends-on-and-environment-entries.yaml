# Template Schemas §3.2 (RFC 0010): one dependencies list may mix step:, dependsOn:, and environment:
# entries.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: First
  script:
    actions:
      onRun:
        command: echo
        args: ["first"]
- name: Second
  script:
    actions:
      onRun:
        command: echo
        args: ["second"]
- name: Third
  dependencies:
  - step: First
  - dependsOn: Second
  - environment: Conda
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["third"]
