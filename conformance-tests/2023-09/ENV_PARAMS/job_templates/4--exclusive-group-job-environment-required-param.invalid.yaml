# Template Schemas §3.2 constraint 7 and §4 item 7 (RFC 0010): a BY_DEFAULT Job Environment with an exclusiveGroup
# applies to every Step that does not decline it, whether or not an attached Environment of its group supersedes it, so
# its required parameter Product, which no Step supplies, is a constraint 7 error at template validation.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: License
  exclusiveGroup: Licensing
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Product}}"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: [render]
