# Template Schemas §7.3.2 (RFC 0010): with EXPR, an Environment's hostRequirements may reference
# Job.EnvNames.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Gpu
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{ 'docker' if 'Docker' in Job.EnvNames else 'native' }}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
