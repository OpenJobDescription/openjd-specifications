# Template Schemas §3.2 item 3.2 and §3.6.2 <StepTemplate>.let (RFC 0010): with EXPR, an enableIf may read
# Step.Name and the names bound by the Step's let.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  let:
  - heavy = len(Job.Name) > 3
  dependencies:
  - environment: Conda
    enableIf: "heavy and Step.Name == 'Render'"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
