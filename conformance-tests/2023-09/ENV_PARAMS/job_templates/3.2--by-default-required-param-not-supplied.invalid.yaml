# Template Schemas §3.2 constraint 7 (RFC 0010): every Step of the Job enters a BY_DEFAULT Environment, so each
# must supply its parameters that have no default. Step Other has no entry for Conda.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
- name: Other
  script:
    actions:
      onRun:
        command: echo
        args: ["other"]
