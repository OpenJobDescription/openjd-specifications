# Template Schemas §4 item 3 constraint 3 and §1.2.1 (RFC 0010): an Environment parameter may have the same
# name as a Job Parameter; the two do not conflict.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Packages
  type: STRING
  default: numpy
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: "{{Param.Packages}}"
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
