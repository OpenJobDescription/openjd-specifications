# Template Schemas §4 item 4 (RFC 0010): a Step Environment has no activation, and the
# BY_DEFAULT default for an omitted activation applies only to Job Environments and Environment
# Templates. A Step Environment that omits activation, in a Job Template that lists ENV_PARAMS,
# is valid.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: TestJob
steps:
- name: A
  stepEnvironments:
  - name: Scratch
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Scratch]
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
