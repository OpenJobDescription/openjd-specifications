# Template Schemas §3.2 item 3.2 (RFC 0010): enableIf has the same available scopes as a parameters value,
# which exclude Task.*, so an enableIf reading Task.Param.Frame is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "1-2"
  dependencies:
  - environment: Conda
    enableIf: "Task.Param.Frame > 1"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
