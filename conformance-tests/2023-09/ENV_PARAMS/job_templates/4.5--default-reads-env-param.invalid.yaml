# Template Schemas §4.5 item 1 (RFC 0010): a default may reference only Param.* and RawParam.*, so a
# default reading another parameter of the same Environment through Env.Param.* is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  - name: Extra
    type: STRING
    default: "{{Env.Param.Packages}}"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
