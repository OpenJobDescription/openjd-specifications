# Template Schemas §3.2 item 3.2 and constraint 7 (RFC 0010): a disabled entry requests nothing, so the Step
# does not enter the ON_REQUEST Environment and need not supply its parameter without a default.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  activation: ON_REQUEST
  envParameterDefinitions:
  - name: Packages
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: false
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
