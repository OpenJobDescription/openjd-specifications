# Template Schemas §7.3.2 (RFC 0010): a Job Environment's enableIf has the scopes of its
# hostRequirements, so it may read its own Env.RawParam of a PATH parameter, the unmapped string.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: EnableIfReadsEnvRawPath
jobEnvironments:
- name: Cache
  enableIf: "Env.RawParam.Dir != '/none'"
  envParameterDefinitions:
  - name: Dir
    type: PATH
    default: /data
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Cache]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
