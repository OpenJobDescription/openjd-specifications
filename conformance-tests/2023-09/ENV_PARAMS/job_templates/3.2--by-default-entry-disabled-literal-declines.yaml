# Template Schemas §3.2 item 3.2 and constraint 7 (RFC 0010): a disabled entry for a BY_DEFAULT Environment declines
# it, so the Step's Sessions do not enter it and constraint 7 does not apply. Conda's Packages has no default and the
# only entry for it has enableIf: false, a literal, so the template is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: false
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
