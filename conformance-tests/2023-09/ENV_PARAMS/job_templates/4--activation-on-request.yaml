# Template Schemas §4 item 4 (RFC 0010): activation: ON_REQUEST on a Job Environment is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  activation: ON_REQUEST
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: Conda
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
