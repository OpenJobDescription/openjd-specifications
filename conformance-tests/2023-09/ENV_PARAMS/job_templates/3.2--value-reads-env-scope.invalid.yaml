# Template Schemas §3.2 <EnvironmentParameterValue> (RFC 0010): Env.* is not available in a parameters
# value, so a value reading Env.File.* is rejected, even naming an embedded file (Spec) that the requested
# Environment Conda defines.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Tag
    type: STRING
    default: none
  script:
    embeddedFiles:
    - name: Spec
      type: TEXT
      data: "spec"
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Tag: "{{Env.File.Spec}}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
