# Template Schemas §3.3 constraint 1 (RFC 0010): in a document that lists ENV_PARAMS, constraint 1 does
# not apply, so an empty hostRequirements object on a Step is valid and means no requirements.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
steps:
- name: Render
  hostRequirements: {}
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
