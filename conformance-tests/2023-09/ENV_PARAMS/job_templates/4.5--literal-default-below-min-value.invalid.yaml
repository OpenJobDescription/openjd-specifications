# Template Schemas §4.5 "A default is checked" item 1 (RFC 0010): a literal default is checked at template
# validation against the parameter's constraints, and is an error even when every Step supplies the
# parameter. Here default 0 is below minValue 1, and the only Step supplies 2.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: License
  envParameterDefinitions:
  - name: Seats
    type: INT
    minValue: 1
    default: 0
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: License
    parameters:
      Seats: 2
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
