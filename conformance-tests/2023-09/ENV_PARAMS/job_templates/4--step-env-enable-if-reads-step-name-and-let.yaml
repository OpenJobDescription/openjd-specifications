# Template Schemas §7.3.2 (RFC 0010): a Step Environment's enableIf may read Step.Name and the
# names bound by the Step's let.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: TestJob
steps:
- name: A
  let:
  - wanted = Step.Name == 'A'
  stepEnvironments:
  - name: Scratch
    enableIf: "wanted"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Scratch]
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
