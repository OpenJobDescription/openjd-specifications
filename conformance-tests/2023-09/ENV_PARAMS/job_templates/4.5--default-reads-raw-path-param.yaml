# Template Schemas §4.5 item 1 (RFC 0010): a default may reference RawParam.<name> for any Job Parameter,
# including one of type PATH.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: CacheDir
    type: PATH
    default: "{{RawParam.Dir}}"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
