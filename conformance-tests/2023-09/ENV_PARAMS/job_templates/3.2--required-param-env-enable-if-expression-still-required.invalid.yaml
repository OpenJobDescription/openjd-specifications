# Template Schemas §3.2 constraint 7 and §3.2.2 (RFC 0010): Lic is a BY_DEFAULT Job Environment with a parameter without
# default that Step A does not supply. Lic applies to A whatever its enableIf, which reads only Param.Use, so the
# template is rejected at template validation. JB-113 shows the same at job creation with the enableIf false.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: RequiredParamOfDisabledEnvironment
parameterDefinitions:
- name: Use
  type: STRING
  allowedValues: ["yes", "no"]
  default: "yes"
jobEnvironments:
- name: Lic
  enableIf: "Param.Use == 'yes'"
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
