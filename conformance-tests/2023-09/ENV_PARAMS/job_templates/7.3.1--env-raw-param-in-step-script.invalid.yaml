# Template Schemas §7.3.1 (RFC 0010): Env.RawParam.* is available only within the Environment that declares
# the parameter, so a Step's own script reading Env.RawParam.* of an Environment it requests is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.RawParam.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["{{Env.RawParam.Packages}}"]
