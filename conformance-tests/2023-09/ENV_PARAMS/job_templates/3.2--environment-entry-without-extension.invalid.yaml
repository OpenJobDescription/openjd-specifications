# Template Schemas §3.2 item 3 (RFC 0010): the environment: form of <StepDependency> is available only
# with the ENV_PARAMS extension. This Job Template lists no extensions, so the entry is rejected.
specificationVersion: jobtemplate-2023-09
name: TestJob
jobEnvironments:
- name: Conda
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: Conda
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
