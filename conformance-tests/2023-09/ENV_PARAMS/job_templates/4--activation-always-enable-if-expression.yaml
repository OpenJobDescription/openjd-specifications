# Template Schemas §4 item 6 and §7.6 rule 5 (RFC 0010): an ALWAYS Environment's enableIf that reads Env.Param.Product,
# which is unknown at template validation, is not known there, so it may still be true for every Step and the template
# is valid. Whether it is false for some Step is decided when the Job is created (JB-128, JB-129).
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: TestJob
jobEnvironments:
- name: Lic
  activation: ALWAYS
  envParameterDefinitions:
  - name: Product
    type: STRING
    default: arnold
  enableIf: "Env.Param.Product != 'none'"
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
