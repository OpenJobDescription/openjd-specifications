# Template Schemas §3.2.2 and §4 item 6 (RFC 0010): Lic's enableIf reads Env.Param.Product, a parameter without
# default that Step A does not supply. The value is known to be missing at template validation and the enableIf's
# result depends on it, so the template is rejected then.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: EnableIfReadsMissingParam
parameterDefinitions:
- name: Use
  type: STRING
  allowedValues: ["yes", "no"]
  default: "yes"
jobEnvironments:
- name: Lic
  enableIf: "Env.Param.Product != 'none'"
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
