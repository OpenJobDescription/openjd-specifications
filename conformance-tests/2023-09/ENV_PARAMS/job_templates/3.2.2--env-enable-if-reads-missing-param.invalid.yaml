# Template Schemas §3.2 constraint 7 and §3.2.2 (RFC 0010): Lic is a BY_DEFAULT Job Environment, so it applies to Step
# A, which does not supply Product, a parameter without default. That is an error in A's definition whatever Lic's
# enableIf is, so the template is rejected. The enableIf, which reads Product, is never evaluated with a missing value.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: EnableIfReadsMissingParam
parameterDefinitions:
- name: Use
  type: STRING
  allowedValues: ["yes", "no"]
  default: "yes"
jobEnvironments:
- name: Lic
  enableIf: "Env.Param.Product != 'none'"
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
