# Template Schemas §4.5 item 1 (RFC 0010): an Environment parameter's default may reference Param.<name>
# for a Job Parameter, not of type PATH or LIST[PATH], of the same document.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: CondaPackages
  type: STRING
  default: numpy
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: "{{Param.CondaPackages}}"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
