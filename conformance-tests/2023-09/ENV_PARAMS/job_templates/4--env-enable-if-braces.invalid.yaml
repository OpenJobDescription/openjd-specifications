# Template Schemas §4 item 6 and §7.5 rule 1 (RFC 0010): an Environment's enableIf is an expression field,
# written without {{ }}, so a value written as a Format String is rejected.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: ""
  enableIf: "{{true}}"
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Conda, "Packages={{Env.Param.Packages}}"]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
