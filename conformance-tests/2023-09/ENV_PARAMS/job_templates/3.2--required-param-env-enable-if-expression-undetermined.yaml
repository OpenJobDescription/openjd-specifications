# Template Schemas §3.2 constraint 7, §3.2.2, and §7.6 rule 5 (RFC 0010): Lic is a BY_DEFAULT Job Environment with a
# parameter without default that Step A does not supply. Lic's enableIf reads only Param.Use, so whether Lic is
# disabled for A, and so whether constraint 7 applies, is undetermined at template validation: no error. JB-113 runs
# it.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: RequiredParamOfDisabledEnvironment
parameterDefinitions:
- name: Use
  type: STRING
  allowedValues: ["yes", "no"]
  default: "yes"
jobEnvironments:
- name: Lic
  enableIf: "Param.Use == 'yes'"
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
