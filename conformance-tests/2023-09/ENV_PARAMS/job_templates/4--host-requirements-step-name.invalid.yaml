# Template Schemas §7.3.2 (RFC 0010): Step.Name is not available in an Environment's
# hostRequirements, even with EXPR.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Gpu
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{Step.Name}}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
