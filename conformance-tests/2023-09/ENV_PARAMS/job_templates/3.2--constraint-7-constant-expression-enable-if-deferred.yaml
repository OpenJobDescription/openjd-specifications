# Template Schemas §3.2 (checked-at paragraph) and §7.5 rule 5: the entry's enableIf is the string "true", a constant
# expression rather than a boolean scalar, so it is undetermined at template validation. If the entry were disabled,
# A would not request Lic and need not supply Product, so constraint 7 fails only for some values, and template
# validation reports no error. Job creation rejects the Job (JB-102).
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: ConstantExpressionEnableIf
jobEnvironments:
- name: Lic
  activation: ON_REQUEST
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  dependencies:
  - environment: Lic
    enableIf: "true"
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
