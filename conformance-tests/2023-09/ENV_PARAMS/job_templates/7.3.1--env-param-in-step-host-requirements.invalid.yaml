# Template Schemas §7.3.1 Env.Param.<ParamName> (RFC 0010): Env.Param.* is not available in a Step, so a
# Step's own hostRequirements reading Env.Param.Flavor of an Environment the Step requests are rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Flavor
    type: STRING
    default: vanilla
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: Conda
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{Env.Param.Flavor}}"]
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
