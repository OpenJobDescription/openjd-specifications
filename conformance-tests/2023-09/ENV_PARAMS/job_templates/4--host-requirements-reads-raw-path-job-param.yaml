# Template Schemas §7.3.2 (RFC 0010): an Environment's hostRequirements may read RawParam.* of any type,
# including a PATH Job Parameter. (Param.<PATH> stays excluded: JT-50.)
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
jobEnvironments:
- name: Gpu
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{RawParam.Dir}}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
