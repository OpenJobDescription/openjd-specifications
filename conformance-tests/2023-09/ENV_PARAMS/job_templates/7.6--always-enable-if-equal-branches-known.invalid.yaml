# Template Schemas §7.6 rule 5 and Expression Language §2.1.6 (RFC 0010): at template validation the BOOL Job Parameter
# F is unresolved[bool], U here. Audit's enableIf is "false if Param.F else false". A conditional whose branches give
# the same value is that value, so it is known to be false: rejected at template validation.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: KnownEqualBranches
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: Audit
  activation: ALWAYS
  enableIf: "false if Param.F else false"
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Audit]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
