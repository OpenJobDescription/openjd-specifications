# Template Schemas §3.2 constraint 7 (RFC 0010): a BY_DEFAULT Environment's parameter without a default is
# valid when every Step of the Job supplies it.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
- name: Other
  dependencies:
  - environment: Conda
    parameters:
      Packages: colmap
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
