# Template Schemas §4 Env.* scope and §7.3.1 (RFC 0010): a Step's own script cannot reference Env.Param.*,
# even of an Environment the Step requests.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["{{Env.Param.Packages}}"]
