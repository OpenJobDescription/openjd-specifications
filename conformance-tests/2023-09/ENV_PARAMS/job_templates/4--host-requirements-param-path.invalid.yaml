# Template Schemas §7.3.2 (RFC 0010): an Environment's hostRequirements may reference Param.* only
# for Job Parameters not of type PATH or LIST[PATH], so a reference to Param.<PATH> is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
jobEnvironments:
- name: Gpu
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{Param.Dir}}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
