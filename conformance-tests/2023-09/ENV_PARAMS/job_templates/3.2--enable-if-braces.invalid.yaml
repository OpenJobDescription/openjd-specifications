# Template Schemas §3.2 constraint 9 and §7.5 rule 1 (RFC 0010): an entry's enableIf is an expression field,
# written without {{ }}, so a value written as a Format String is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: "{{ true }}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
