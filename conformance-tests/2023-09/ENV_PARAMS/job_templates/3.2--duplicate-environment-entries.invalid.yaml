# Template Schemas §3.2 constraint 3 (RFC 0010): no two environment entries of one dependencies list may
# name the same Environment.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Packages: ffmpeg
  - environment: Conda
    parameters:
      Packages: colmap
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
