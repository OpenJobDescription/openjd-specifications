# Template Schemas §3.2 (checked-at paragraph) and §7.6 rule 5 (RFC 0010): the entry's enableIf "Param.F or true" is
# known at template validation to be true, so the entry is enabled there, and its literal value colmap, outside
# Packages's allowedValues, is checked then (constraint 6). Rejected at template validation.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: KnownTrueEntryValues
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    allowedValues: [numpy, ffmpeg]
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: "Param.F or true"
    parameters:
      Packages: colmap
  script:
    actions:
      onRun:
        command: echo
        args: [render]
