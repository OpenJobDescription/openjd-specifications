# Template Schemas §7.3.1 Env.Param.<ParamName> (RFC 0010): Env.Param.* is available in the declaring
# Environment's embedded files.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    embeddedFiles:
    - name: Spec
      type: TEXT
      data: "{{Env.Param.Packages}}"
    actions:
      onEnter:
        command: echo
        args: ["{{Env.File.Spec}}"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
