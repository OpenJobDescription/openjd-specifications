# Template Schemas §4 item 7 (RFC 0010): an exclusiveGroup is an <Identifier> (§7.1), so a name with a space is
# rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  exclusiveGroup: Software Provider
  script:
    actions:
      onEnter:
        command: echo
        args: [enter]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: [render]
