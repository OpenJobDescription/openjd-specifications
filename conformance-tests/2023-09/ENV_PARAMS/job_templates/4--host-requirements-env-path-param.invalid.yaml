# Template Schemas §7.3.2 (RFC 0010): an Environment's hostRequirements may reference only its
# Env.Param.* of types other than PATH and LIST[PATH], so a reference to a PATH parameter is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
jobEnvironments:
- name: Gpu
  envParameterDefinitions:
  - name: CacheDir
    type: PATH
    default: "{{RawParam.Dir}}"
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: ["{{Env.Param.CacheDir}}"]
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
