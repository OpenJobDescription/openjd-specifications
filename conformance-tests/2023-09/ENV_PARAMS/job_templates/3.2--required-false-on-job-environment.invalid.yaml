# Template Schemas §3.2 constraint 8 (RFC 0010): required must not be false on an entry that names a
# jobEnvironments entry.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    required: false
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
