# Template Schemas §3.2 (checked-at paragraph) and §7.6 rule 5 (RFC 0010): the entry's enableIf is the string "true", a
# constant expression. It reads no value that is unknown at template validation, so its value is known there to be true,
# and the entry requests Lic. A does not supply Product, which has no default, so the template is rejected. JB-102 shows
# the same at job creation.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: ConstantExpressionEnableIf
jobEnvironments:
- name: Lic
  activation: ON_REQUEST
  envParameterDefinitions:
  - name: Product
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  dependencies:
  - environment: Lic
    enableIf: "true"
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
