# Template Schemas §4.5 item 1 and §7.3.1 Job.EnvNames (RFC 0010): Job.EnvNames is not available in an
# Environment parameter default, so a LIST[STRING] default that is the single expression
# {{ Job.EnvNames }} is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Names
    type: LIST[STRING]
    default: "{{ Job.EnvNames }}"
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
