# Template Schemas §3.2 <EnvironmentParameterValue> (RFC 0010): a parameters value may reference
# RawParam.* for every Job Parameter, including one of type PATH.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Tag
    type: STRING
    default: none
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Tag: "{{RawParam.Dir}}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
