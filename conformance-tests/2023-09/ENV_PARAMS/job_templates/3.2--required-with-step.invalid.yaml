# Template Schemas §3.2 constraint 1 (RFC 0010): required is permitted only with environment, so required
# on a step: entry is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
steps:
- name: First
  script:
    actions:
      onRun:
        command: echo
        args: ["first"]
- name: Second
  dependencies:
  - step: First
    required: false
  script:
    actions:
      onRun:
        command: echo
        args: ["second"]
