# Template Schemas §4.5 item 4 and §2.10 (RFC 0010): a RANGE_EXPR Environment parameter's maxLength checks the
# literal value as written and its canonical form. "1,2,3" is 5 characters, so it breaks maxLength 3 although its
# canonical form "1-3" fits; constraint 6 rejects it at template validation.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: RangeExprLength
jobEnvironments:
- name: Cache
  activation: ON_REQUEST
  envParameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    maxLength: 3
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Cache, "{{Env.Param.Frames}}"]
steps:
- name: A
  dependencies:
  - environment: Cache
    parameters:
      Frames: "1,2,3"
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
