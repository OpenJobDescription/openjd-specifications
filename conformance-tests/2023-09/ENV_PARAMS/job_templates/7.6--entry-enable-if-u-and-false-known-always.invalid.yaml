# Template Schemas §7.6 rule 5 and Expression Language §2.1.6 (RFC 0010): at template validation the BOOL Job Parameter
# F is unresolved[bool], U here. Step A's entry for the ALWAYS Job Environment Audit has enableIf "Param.F and false",
# known to be false, so the entry is known to be disabled. A disabled entry for an ALWAYS Environment is an error:
# rejected at template validation (§3.2 *enableIf*).
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: KnownEntryUAndFalse
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: Audit
  activation: ALWAYS
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Audit]
steps:
- name: A
  dependencies:
  - environment: Audit
    enableIf: "Param.F and false"
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
