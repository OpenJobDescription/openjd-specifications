# Template Schemas §3.2 constraint 7 (RFC 0010): the ON_REQUEST Job Environment E has a parameter X without default,
# which its enableIf reads. Step A does not request E, so E does not apply to A and A need not supply X. Valid.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: RequiredParamNotRequested
jobEnvironments:
- name: E
  activation: ON_REQUEST
  enableIf: "Env.Param.X == 'a'"
  envParameterDefinitions:
  - name: X
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, E]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
