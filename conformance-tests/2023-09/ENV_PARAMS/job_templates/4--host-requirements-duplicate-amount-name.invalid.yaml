# Template Schemas §4 item 5 and §3.3 constraint 3 (RFC 0010): an Environment's hostRequirements have the
# same constraints as a Step's, applied to that source alone, so two amounts with the same name are
# rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Gpu
  hostRequirements:
    amounts:
    - name: conformance:amount.widgets
      min: 1
    - name: conformance:amount.widgets
      min: 2
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
