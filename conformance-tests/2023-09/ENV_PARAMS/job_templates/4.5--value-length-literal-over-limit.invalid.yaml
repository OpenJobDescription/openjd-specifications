# Template Schemas §4.5 item 5 (RFC 0010): a STRING effective value is at most 1024 characters. A literal value of 1025 characters for
# a Job Environment is rejected at template validation.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: ValueOverLimit
jobEnvironments:
- name: E
  envParameterDefinitions:
  - name: V
    type: STRING
  variables:
    V_LEN: "{{ len(Env.Param.V) }}"
steps:
- name: A
  dependencies:
  - environment: E
    parameters:
      V: ""
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
