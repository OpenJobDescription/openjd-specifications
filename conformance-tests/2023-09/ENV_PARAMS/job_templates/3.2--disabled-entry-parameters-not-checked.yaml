# Template Schemas §3.2 *enableIf* (RFC 0010): a disabled entry's parameters are not checked. Render's entry for Conda
# has enableIf: false, a key Conda does not declare, and a value outside allowedValues. Neither is an error.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    allowedValues: [numpy, ffmpeg]
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: false
    parameters:
      Packages: colmap
      Bogus: x
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
