# Template Schemas §7.6 rule 5 and Expression Language §2.1.6 (RFC 0010): at template validation the BOOL Job Parameter
# F is unresolved[bool], U here. The ALWAYS Job Environment Audit has enableIf "Param.F and false". U and false is
# false, so the value is known there to be false, and an ALWAYS Environment cannot be disabled: rejected at template
# validation.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: KnownUAndFalse
parameterDefinitions:
- name: F
  type: BOOL
  default: true
jobEnvironments:
- name: Audit
  activation: ALWAYS
  enableIf: "Param.F and false"
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Audit]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
