# Template Schemas §4.5 "A default is checked" item 1 (RFC 0010): a literal default is checked against the
# parameter's type, so INT default "abc" is rejected even though the only Step supplies the parameter.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: License
  envParameterDefinitions:
  - name: Seats
    type: INT
    default: abc
  script:
    actions:
      onEnter:
        command: echo
        args: ["enter"]
steps:
- name: Render
  dependencies:
  - environment: License
    parameters:
      Seats: 1
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
