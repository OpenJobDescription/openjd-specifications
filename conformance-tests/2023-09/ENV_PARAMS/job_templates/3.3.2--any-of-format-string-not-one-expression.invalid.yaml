# Template Schemas §3.3.2 (RFC 0010): a list has no string form, so an anyOf written as a format string that
# is not exactly one {{ }} expression is rejected at template validation, whatever it would resolve to.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: A
  type: STRING
  default: a
steps:
- name: Render
  hostRequirements:
    attributes:
    - name: conformance:attr.flavor
      anyOf: "x{{Param.A}}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
