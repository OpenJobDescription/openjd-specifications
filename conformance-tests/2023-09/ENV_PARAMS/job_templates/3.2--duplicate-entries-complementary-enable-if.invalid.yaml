# Template Schemas §3.2 constraint 3 (RFC 0010): constraint 3 applies to entries as written, enabled or
# not, so two entries for one Environment are rejected even when their enableIf values are complementary.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: true
    parameters:
      Packages: ffmpeg
  - environment: Conda
    enableIf: false
    parameters:
      Packages: colmap
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
