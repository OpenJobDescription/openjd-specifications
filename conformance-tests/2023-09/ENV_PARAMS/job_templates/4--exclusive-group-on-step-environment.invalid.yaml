# Template Schemas §4 (the paragraph after the list) (RFC 0010): exclusiveGroup is not permitted on a
# stepEnvironments entry.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
steps:
- name: Render
  stepEnvironments:
  - name: Conda
    exclusiveGroup: SoftwareProvider
    script:
      actions:
        onEnter:
          command: echo
          args: [enter]
  script:
    actions:
      onRun:
        command: echo
        args: [render]
