# Template Schemas §7.3.1 Env.Param.<ParamName> (RFC 0010): Env.Param.* is available in the declaring
# Environment's variables.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  variables:
    CONDA_PACKAGES: "{{Env.Param.Packages}}"
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
