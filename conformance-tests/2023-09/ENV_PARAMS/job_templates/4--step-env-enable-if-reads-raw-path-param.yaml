# Template Schemas §7.3.2 (RFC 0010): a Step Environment's enableIf may read RawParam.* of any type,
# including a PATH Job Parameter.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
steps:
- name: Render
  stepEnvironments:
  - name: Cache
    enableIf: "RawParam.Dir != ''"
    script:
      actions:
        onEnter:
          command: echo
          args: ["enter"]
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
