# Template Schemas §3.2.2 and §3.2 (checked-at paragraph) (RFC 0010): Lic's enableIf is the literal false, so no Step
# enters it, and A's literal value vray, outside Product's allowedValues, is not checked (constraint 6 is made only
# for an Environment whose enableIf is not false).
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: ValuesOfDisabledEnvironment
parameterDefinitions:
- name: Use
  type: STRING
  allowedValues: ["yes", "no"]
  default: "yes"
jobEnvironments:
- name: Lic
  activation: ON_REQUEST
  enableIf: false
  envParameterDefinitions:
  - name: Product
    type: STRING
    allowedValues: [arnold, redshift]
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  dependencies:
  - environment: Lic
    parameters:
      Product: vray
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
