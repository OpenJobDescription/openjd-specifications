# Template Schemas §3.2 (checked-at paragraph, <EnvironmentParameterValue>) and §7.6 rule 5 (RFC 0010): an entry whose
# enableIf is not known at template validation may turn out to be disabled, and if it is enabled its value is evaluated
# with the parameter's type as its target type. "{{ abs('5') }}" for the INT parameter N resolves to 5 with that target
# (Expression Language §1.3.1), so the template is valid, as it is when the entry has no enableIf.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Mode
  type: STRING
  allowedValues: ["on", "off"]
  default: "on"
jobEnvironments:
- name: Lic
  envParameterDefinitions:
  - name: N
    type: INT
    default: 1
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.N}}"]
steps:
- name: Render
  dependencies:
  - environment: Lic
    enableIf: "Param.Mode == 'on'"
    parameters:
      N: "{{ abs('5') }}"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
