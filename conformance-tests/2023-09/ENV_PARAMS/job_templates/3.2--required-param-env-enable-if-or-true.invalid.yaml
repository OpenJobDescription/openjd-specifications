# Template Schemas §3.2 constraint 7 and §3.2.2 (RFC 0010): as JT-190 with E's enableIf "Env.Param.X == 'a' or true",
# which would be true whatever X is. Step A does not supply X, so the template is rejected under constraint 7.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: RequiredParamEnableIfOrTrue
jobEnvironments:
- name: E
  enableIf: "Env.Param.X == 'a' or true"
  envParameterDefinitions:
  - name: X
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, E]
steps:
- name: A
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
