# Template Schemas §3.2 constraint 7 (RFC 0010): only the Steps that request an ON_REQUEST Environment
# enter it, so only they must supply its parameters without a default. Step Other does not request
# Conda.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  activation: ON_REQUEST
  envParameterDefinitions:
  - name: Packages
    type: STRING
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    parameters:
      Packages: ffmpeg
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
- name: Other
  script:
    actions:
      onRun:
        command: echo
        args: ["other"]
