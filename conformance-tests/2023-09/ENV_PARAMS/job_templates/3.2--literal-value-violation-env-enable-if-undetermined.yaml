# Template Schemas §3.2.2, §3.2 (checked-at paragraph), and §7.5 rule 5 (RFC 0010): Lic's enableIf is an expression,
# undetermined at template validation. A's literal value vray is outside Product's allowedValues, but it is checked
# only if the enableIf resolves to true, so template validation reports nothing. JB-108 and JB-109 run it.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: ValuesOfDisabledEnvironment
parameterDefinitions:
- name: Use
  type: STRING
  allowedValues: ["yes", "no"]
  default: "yes"
jobEnvironments:
- name: Lic
  activation: ON_REQUEST
  enableIf: "Param.Use == 'yes'"
  envParameterDefinitions:
  - name: Product
    type: STRING
    allowedValues: [arnold, redshift]
  script:
    actions:
      onEnter:
        command: echo
        args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
steps:
- name: A
  dependencies:
  - environment: Lic
    parameters:
      Product: vray
  script:
    actions:
      onRun:
        command: echo
        args: [TASK, A]
