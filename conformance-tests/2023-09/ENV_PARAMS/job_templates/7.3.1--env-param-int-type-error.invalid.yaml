# Template Schemas §7.3.1 and §7.4 Template validation (RFC 0010): with EXPR, Env.Param.* is type-checked
# using the declared types of the Environment's envParameterDefinitions. Seats is INT, and upper() has no
# int receiver (method receivers are not coerced), so the expression is a type error.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: License
  envParameterDefinitions:
  - name: Seats
    type: INT
    default: 1
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{ Env.Param.Seats.upper() }}"]
steps:
- name: Render
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
