# Template Schemas §3.2 constraint 9 and §7.5 rule 2 (RFC 0010): enableIf is an expression field of type bool,
# and an expression field does not convert string to bool, whatever the text. Param.Mode is a STRING whose
# default is "true", so the entry is rejected at template validation.
specificationVersion: jobtemplate-2023-09
extensions:
- ENV_PARAMS
- EXPR
name: TestJob
parameterDefinitions:
- name: Mode
  type: STRING
  default: "true"
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: numpy
  script:
    actions:
      onEnter:
        command: echo
        args: ["{{Env.Param.Packages}}"]
steps:
- name: Render
  dependencies:
  - environment: Conda
    enableIf: "Param.Mode"
  script:
    actions:
      onRun:
        command: echo
        args: ["render"]
