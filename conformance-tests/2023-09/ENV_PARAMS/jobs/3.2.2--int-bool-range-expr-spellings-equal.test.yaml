# RFC 0010 / Template Schemas §3.2.2 (equal values): an INT, a BOOL, and a RANGE_EXPR each have one string form for
# each value, so how a Step writes them does not matter. Step A supplies "007", "yes", and "1,2,3", and Step B 7, true,
# and "1-3": the values are equal, and both Steps' Tasks see 7, true, and the canonical form 1-3. Sharing the entered
# Environment is permitted but not required, so only what every conforming run prints is checked.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: IntBoolRangeExprSpellingsEqual
  jobEnvironments:
  - name: Render
    envParameterDefinitions:
    - name: Threads
      type: INT
    - name: Denoise
      type: BOOL
    - name: Frames
      type: RANGE_EXPR
    variables:
      RENDER_SETTINGS: "{{Env.Param.Threads}} {{Env.Param.Denoise}} {{Env.Param.Frames}}"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Render, "Settings=[{{Env.Param.Threads}} {{Env.Param.Denoise}} {{Env.Param.Frames}}]"]
  steps:
  - name: A
    dependencies:
    - environment: Render
      parameters:
        Threads: "007"
        Denoise: "yes"
        Frames: "1,2,3"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os;print('TASK_A_SETTINGS=['+os.environ['RENDER_SETTINGS']+']')"]
  - name: B
    dependencies:
    - dependsOn: A
    - environment: Render
      parameters:
        Threads: 7
        Denoise: true
        Frames: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os;print('TASK_B_SETTINGS=['+os.environ['RENDER_SETTINGS']+']')"]
runOn: [posix, windows]
expected:
  output:
  - ENTER Render Settings=[7 true 1-3]
  - TASK_A_SETTINGS=[7 true 1-3]
  - TASK_B_SETTINGS=[7 true 1-3]
