# RFC 0010 / Template Schemas §4.5 ("A default is checked", item 2): a
# non-literal default that resolves outside allowedValues is rejected at job
# creation when a Step (B, which has no entry) takes it as its effective value.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ResolvedDefaultTaken
  parameterDefinitions:
  - name: DefaultProduct
    type: STRING
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Product
      type: STRING
      allowedValues: [arnold, redshift]
      default: "{{Param.DefaultProduct}}"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
parameters:
  DefaultProduct: notallowed
runOn: [posix, windows]
