# RFC 0010 / Template Schemas §3.2.1 item 4: an attached Environment with the name of a jobEnvironments entry cannot be
# reached by any entry. With activation ALWAYS, every Step's Sessions enter it, so its parameter without a default
# rejects the submission.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: UnreachableAttachedAlways
  jobEnvironments:
  - name: Lic
    variables: {V: x}
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
