# RFC 0010 / Template Schemas §4.5, §3.2.2: a value a Step supplies reaches the
# Environment's onEnter as an argv element through {{Env.Param.<name>}}.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ValueReachesOnEnter
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=arnold
  - TASK A
