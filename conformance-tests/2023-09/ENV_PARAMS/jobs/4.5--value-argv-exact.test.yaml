# RFC 0010 §Security Considerations ("Do not substitute values into script
# source": each args element reaches the process as one argv entry), with the
# value read through §4.5 Env.Param.*: a value with spaces, quotes, and `$`
# arrives as one argv element, byte for byte. printf prints one bracketed line per argument.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ValueArgvExact
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Value
      type: STRING
    script:
      actions:
        onEnter:
          command: bash
          args: ["-c", "printf 'ARG[%s]\\n' \"$@\"", argv0, "{{Env.Param.Value}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Value: "a b 'c' \"d\" $HOME"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix]
expected:
  output:
  - "ARG[a b 'c' \"d\" $HOME]"
  forbidden:
  - "ARG[a]"
  - "ARG[b]"
