# Template Schemas §3.2 item 3.2 and constraint 7, §3.2.2, and §4 item 6, with RFC 0008 (single-layer rule): two
# wrapping BY_DEFAULT Job Environments, each with a parameter without default, whose enableIf conditions are never true
# together. With Runtime=a, A's entry for RuntimeB is disabled, so A declines RuntimeB, which then does not apply to A,
# so constraint 7 does not require Image of it. RuntimeB is also disabled for A by its own enableIf, and the stack holds
# one wrapper. The Job runs wrapped by RuntimeA.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, WRAP_ACTIONS, EXPR]
  name: WrappersNeverEnabledTogether
  parameterDefinitions:
  - name: Runtime
    type: STRING
    allowedValues: [a, b]
  jobEnvironments:
  - name: RuntimeA
    enableIf: "Param.Runtime == 'a'"
    envParameterDefinitions:
    - name: Image
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, RuntimeA, "Image={{Env.Param.Image}}"]
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: [WRAP, RuntimeA]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
  - name: RuntimeB
    enableIf: "Param.Runtime == 'b'"
    envParameterDefinitions:
    - name: Image
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, RuntimeB, "Image={{Env.Param.Image}}"]
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: [WRAP, RuntimeB]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
  steps:
  - name: A
    dependencies:
    - environment: RuntimeA
      parameters:
        Image: img-a
    - environment: RuntimeB
      enableIf: "Param.Runtime == 'b'"
      parameters:
        Image: img-b
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Runtime: a
runOn: [posix]
expected:
  output:
  - ENTER RuntimeA Image=img-a
  - WRAP RuntimeA
  forbidden:
  - ENTER RuntimeB
  - WRAP RuntimeB
