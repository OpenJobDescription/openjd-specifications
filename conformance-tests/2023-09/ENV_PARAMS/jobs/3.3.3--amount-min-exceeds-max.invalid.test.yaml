# RFC 0010 / Template Schemas §3.3.3 item 1: the Step requires at most 1 of
# an amount and an Environment its Sessions enter requires at least 2; the
# combined min exceeds max, so the submission is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AmountMinExceedsMax
  jobEnvironments:
  - name: Hw
    activation: ALWAYS
    envParameterDefinitions:
    - name: Flavor
      type: STRING
      default: a
    hostRequirements:
      amounts:
      - name: conformance:amount.widgets
        min: 2
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw, "Flavor={{Env.Param.Flavor}}"]
  steps:
  - name: A
    hostRequirements:
      amounts:
      - name: conformance:amount.widgets
        max: 1
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
