# RFC 0010 / Template Schemas §3.2 item 3.1, §3.2.1 item 2: with required: false,
# an entry naming an Environment that nothing attaches is ignored; the Step
# runs, and Job.EnvNames lists only the Job's own Environment.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ExternalRequiredFalseMissing
  jobEnvironments:
  - name: J
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, J]
  steps:
  - name: A
    dependencies:
    - environment: Conda
      required: false
      parameters:
        Packages: ffmpeg=7
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A, "NAMES=[{{ Job.EnvNames.join(',') }}]"]
runOn: [posix, windows]
expected:
  output:
  - TASK A NAMES=[J]
