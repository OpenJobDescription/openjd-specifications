# Template Schemas §4.5 item 3 (RFC 0010): an Environment parameter PATH value is used as given. It is not required
# to be absolute or to have any path format, and Env.RawParam reads it unchanged.
# A LIST[PATH] value mixing a POSIX, a Windows drive, a UNC, and a relative path is accepted.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: PathValueAsGiven
  steps:
  - name: A
    dependencies:
    - environment: Mnt
      parameters:
        Dirs:
        - "/mnt/a"
        - "D:\\b"
        - "\\\\server\\share\\c"
        - "rel/d"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Mnt
    envParameterDefinitions:
    - name: Dirs
      type: LIST[PATH]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Mnt, "{{Env.RawParam.Dirs}}"]
runOn: [posix, windows]
expected:
  output:
  - "ENTER Mnt /mnt/a D:\\b \\\\server\\share\\c rel/d"
  - TASK A
