# Template Schemas §3.2.1 (after resolution), constraint 7, and §3.2.2 (RFC 0010): an attached BY_DEFAULT Environment
# with a parameter that has no default, and an enableIf over its Environment Template's own Job Parameter that resolves
# to false. The Environment applies to Step A, which does not decline it, so A must supply Product whatever the enableIf
# is, and the submission is rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttachedRequiredDisabled
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  parameterDefinitions:
  - name: UseLic
    type: STRING
    default: "no"
  environment:
    name: Lic
    activation: BY_DEFAULT
    enableIf: "Param.UseLic == 'yes'"
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
