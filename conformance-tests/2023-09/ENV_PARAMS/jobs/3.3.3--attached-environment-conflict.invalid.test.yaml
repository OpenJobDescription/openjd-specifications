# RFC 0010 / Template Schemas §3.3.3 item 2.1: an attached BY_DEFAULT Environment requires anyOf [windows] and the Step
# requires anyOf [linux] of attr.worker.os.family; the combined requirements conflict and the submission is rejected
# at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttachedEnvironmentConflict
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [linux]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Hw
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [windows]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw]
runOn: [posix, windows]
