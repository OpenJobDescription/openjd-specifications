# RFC 0010 / Template Schemas §4 item 6 ("a null result is an error"): an Environment's enableIf that resolves
# to null at job creation is rejected. §7.5 rule 2 accepts bool? for a bool expression field and makes null an
# error at evaluation (README ambiguity 13, resolved).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: EnvEnableIfNull
  parameterDefinitions:
  - name: Mode
    type: STRING
    allowedValues: ["on", "off"]
  jobEnvironments:
  - name: Setup
    enableIf: "null if Param.Mode == 'off' else true"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Setup]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Mode: "off"
runOn: [posix, windows]
