# RFC 0010 / Template Schemas §4.5 ("A default is checked", item 1): a relative
# literal PATH default is an error at job creation even when every Step supplies
# the parameter. The supplied value comes from a PATH Job Parameter whose
# relative default is joined with the template directory, so it is absolute on
# every host. See README ambiguity 2 for rejection at template validation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: RelativeLiteralPathDefault
  parameterDefinitions:
  - name: D
    type: PATH
    default: data
  steps:
  - name: A
    dependencies:
    - environment: Mnt
      parameters:
        Dir: "{{RawParam.D}}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Mnt
    envParameterDefinitions:
    - name: Dir
      type: PATH
      default: relative/dir
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Mnt, "Dir={{Env.RawParam.Dir}}"]
runOn: [posix, windows]
