# Template Schemas §4 item 7, §3.2.2 (RFC 0010): a superseded Environment is disabled for the Step, so constraint 7
# does not apply to it. Docker is BY_DEFAULT and its Image has no default, which the Step does not supply; without
# the group the Job would be rejected. Conda, attached first, is enabled, so Docker is superseded and the Job runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: GroupJob
  steps:
  - name: S
    dependencies:
    - environment: Conda
      parameters:
        Packages: colmap=3.11
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, S]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Conda
    exclusiveGroup: SoftwareProvider
    envParameterDefinitions:
    - name: Packages
      type: STRING
      default: ""
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda]
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Docker
    exclusiveGroup: SoftwareProvider
    envParameterDefinitions:
    - name: Image
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Docker]
runOn: [posix, windows]
expected:
  output:
  - ENTER Conda
  - TASK S
  forbidden:
  - ENTER Docker
