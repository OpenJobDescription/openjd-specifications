# Template Schemas §4 item 6 (enableIf tail) and §7.5 rule 5, with RFC 0008 (single-layer rule, §4.3 constraint 2):
# WrapA and WrapB have no enableIf, so every Session certainly enters both; WrapC's enableIf is an expression,
# undetermined until the Job is created. The rule is violated whatever WrapC resolves to, so the Job is rejected, and
# an implementation may already report it at template validation (README item 18).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, WRAP_ACTIONS, EXPR]
  name: TwoCertainWrappers
  parameterDefinitions:
  - name: Use
    type: STRING
    allowedValues: ["yes", "no"]
    default: "yes"
  jobEnvironments:
  - name: WrapA
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, WrapA]
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: [WRAP, WrapA]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
  - name: WrapB
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, WrapB]
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: [WRAP, WrapB]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
  - name: WrapC
    enableIf: "Param.Use == 'yes'"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, WrapC]
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: [WRAP, WrapC]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix]
