# RFC 0010 / Template Schemas §3.2 *enableIf*: a disabled entry for a BY_DEFAULT Job Environment declines it. Step A's
# entry for Lic has enableIf: false, so A's Sessions do not enter Lic, neither with A's value nor with the default.
# Before ENV_PARAMS changed this, a disabled entry was as if absent and A entered Lic with its default.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ByDefaultEntryDisabledLiteral
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      enableIf: false
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - TASK A
  forbidden:
  - ENTER Lic
