# RFC 0010 / Template Schemas §3.2 (<EnvironmentParameterValue>): a format
# string value "{{Param.N}}" for an INT parameter resolves to a string that is
# converted to INT, and is accepted against minValue.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: FormatStringToInt
  parameterDefinitions:
  - name: N
    type: INT
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Seats
      type: INT
      minValue: 1
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Seats={{Env.Param.Seats}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Seats: "{{Param.N}}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  N: 3
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Seats=3
