# Template Schemas §2.10, §1.2.1 (RFC 0010): as 2.10--range-expr-merged-length-written-only, with minLength 4 in the
# Job Template, which lists ENV_PARAMS, so it also applies to the canonical form of "1-3:2", which is "1,3" (3
# characters). The attached Environment Template lists only EXPR and sets no length. Job creation fails.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: MergedRangeExprLength
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    minLength: 4
  steps:
  - name: A
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: INT
        range: "{{Param.Frames}}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, "{{Task.Param.Frame}}"]
environments:
- specificationVersion: environment-2023-09
  extensions: [EXPR]
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
  environment:
    name: Frames
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Frames]
parameters:
  Frames: "1-3:2"
