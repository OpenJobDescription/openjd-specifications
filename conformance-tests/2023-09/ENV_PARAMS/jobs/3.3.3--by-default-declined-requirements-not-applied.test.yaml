# RFC 0010 / Template Schemas §3.3.3 and §3.2 *enableIf*: a Step that declines a BY_DEFAULT Environment with a disabled
# entry gets none of its requirements. Gpu's anyOf conflicts with Step A's own, and A's only entry for Gpu has an
# enableIf that resolves to false, so A declines Gpu, there is no conflict, and the Job runs without entering Gpu.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ByDefaultDeclinedRequirementsNotApplied
  jobEnvironments:
  - name: Gpu
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [b]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Gpu]
  steps:
  - name: A
    dependencies:
    - environment: Gpu
      enableIf: "'Nope' in Job.EnvNames"
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - TASK A
  forbidden:
  - ENTER Gpu
