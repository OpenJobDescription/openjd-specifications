# Template Schemas §3.3.3 item 2.1 and §7.4.1 (RFC 0010): a Job Template that does not list ENV_PARAMS has a Step
# that requires anyOf [linux] of attr.worker.os.family. An attached Environment from a document that lists ENV_PARAMS
# requires anyOf ["{{Env.Param.Os}}"], which resolves to windows with the default. Every Session enters the
# Environment, so the combined requirements conflict and the submission is rejected.
template:
  specificationVersion: jobtemplate-2023-09
  name: AttachedRequirementsConflict
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [linux]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Hw
    envParameterDefinitions:
    - name: Os
      type: STRING
      default: windows
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: ["{{Env.Param.Os}}"]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw]
runOn: [posix, windows]
