# RFC 0010 / Template Schemas §4 hostRequirements item 1, §3.3.3 item 2: an
# Environment's attribute requirement anyOf ["{{Env.Param.Flavor}}"] resolves
# with the Step's value (a); its intersection with the Step's own anyOf [a, b]
# is non-empty, so the Job is created and runs. openjd run does not place
# Sessions, so only job creation is observable.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: NonConflictingRequirements
  jobEnvironments:
  - name: Hw
    activation: ALWAYS
    envParameterDefinitions:
    - name: Flavor
      type: STRING
      default: a
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: ["{{Env.Param.Flavor}}"]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw, "Flavor={{Env.Param.Flavor}}"]
  steps:
  - name: A
    dependencies:
    - environment: Hw
      parameters:
        Flavor: a
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a, b]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - ENTER Hw Flavor=a
  - TASK A
