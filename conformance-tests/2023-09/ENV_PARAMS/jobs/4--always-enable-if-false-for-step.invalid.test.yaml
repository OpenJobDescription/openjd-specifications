# RFC 0010 / Template Schemas §4 item 6 and §3.2.2 item 6: an Environment whose activation is ALWAYS cannot be
# disabled. Its enableIf is an expression, so the template passes template validation (JT-172), but when the Job
# is created it is false for Step B, which takes the default none. That is an error naming B and Lic, so the Job
# is rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AlwaysEnableIfFalseForStep
  jobEnvironments:
  - name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: none
    enableIf: "Env.Param.Product != 'none'"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    dependencies:
    - step: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
runOn: [posix, windows]
