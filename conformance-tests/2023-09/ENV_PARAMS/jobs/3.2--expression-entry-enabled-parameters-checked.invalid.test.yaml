# RFC 0010 / Template Schemas §3.2 constraints 5 and 6: the same entry as JB-143, with an enableIf that resolves to
# true when the Job is created. The entry is enabled, so its undeclared key and its value outside allowedValues are
# errors at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ExpressionEntryParameters
  parameterDefinitions:
  - name: Mode
    type: STRING
    allowedValues: ["on", "off"]
  jobEnvironments:
  - name: Conda
    envParameterDefinitions:
    - name: Packages
      type: STRING
      allowedValues: [numpy, ffmpeg]
      default: numpy
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda, "Packages={{Env.Param.Packages}}"]
  steps:
  - name: A
    dependencies:
    - environment: Conda
      enableIf: "Param.Mode == 'on'"
      parameters:
        Packages: colmap
        Bogus: x
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Mode: "on"
runOn: [posix, windows]

