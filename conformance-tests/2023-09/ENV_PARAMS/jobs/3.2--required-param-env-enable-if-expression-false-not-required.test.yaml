# Template Schemas §3.2 constraint 7 and §3.2.2 (RFC 0010): the template of JT-158. With Use=no, Lic's enableIf is
# false for Step A, so Lic is disabled and A need not supply Product; the Job runs without entering Lic.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: RequiredParamOfDisabledEnvironment
  parameterDefinitions:
  - name: Use
    type: STRING
    allowedValues: ["yes", "no"]
    default: "yes"
  jobEnvironments:
  - name: Lic
    enableIf: "Param.Use == 'yes'"
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Use: "no"
runOn: [posix, windows]
expected:
  output:
  - TASK A
  forbidden:
  - ENTER Lic
