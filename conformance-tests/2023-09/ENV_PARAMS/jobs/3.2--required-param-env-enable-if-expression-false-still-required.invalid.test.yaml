# Template Schemas §3.2 constraint 7, §3.2.2, and §7.4.1 step 5 (RFC 0010): the template of JT-158. With Use=no, Lic's
# enableIf would be false for Step A, but constraint 7 is checked before it: Lic applies to A, which does not supply
# Product, so the Job is rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: RequiredParamOfDisabledEnvironment
  parameterDefinitions:
  - name: Use
    type: STRING
    allowedValues: ["yes", "no"]
    default: "yes"
  jobEnvironments:
  - name: Lic
    enableIf: "Param.Use == 'yes'"
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Use: "no"
runOn: [posix, windows]
