# RFC 0010 / Template Schemas §4 item 6 with RFC 0008 (single-layer rule, §4.3 constraint 2): the rule applies to
# the Environments a Step's Sessions enter. InnerWrap's enableIf is false, so the Session's stack has one wrapping
# Environment and the Job runs, wrapped by OuterWrap only.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, WRAP_ACTIONS, EXPR]
  name: SecondWrapperDisabled
  jobEnvironments:
  - name: OuterWrap
    enableIf: true
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, OuterWrap]
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: ["OUTER_WRAP"]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
  - name: InnerWrap
    enableIf: false
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, InnerWrap]
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: ["INNER_WRAP"]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [ORIGINAL]
runOn: [posix]
expected:
  output:
  - OUTER_WRAP
  forbidden:
  - INNER_WRAP
  - ENTER InnerWrap
