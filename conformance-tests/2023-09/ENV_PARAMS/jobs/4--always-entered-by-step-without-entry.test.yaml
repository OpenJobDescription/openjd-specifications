# RFC 0010 / Template Schemas §4 activation ALWAYS, §3.2.2 item 2: a
# Step with no entry still enters an ALWAYS Job Environment, with its default.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AllEnteredWithoutEntry
  jobEnvironments:
  - name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    dependencies:
    - dependsOn: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=arnold
  - ENTER Lic Product=pdefault
  - TASK B
