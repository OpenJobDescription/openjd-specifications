# RFC 0010 / Template Schemas §3.2.1 item 1, §3.2 constraint 6: with EXPR, a
# list literal supplied to an attached Environment's STRING parameter is not of
# its type and is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ExternalListLiteralForString
  steps:
  - name: A
    dependencies:
    - environment: Conda
      parameters:
        Packages: [ffmpeg=7, colmap=3.11]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Conda
    envParameterDefinitions:
    - name: Packages
      type: STRING
      default: pkgdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda, "Packages={{Env.Param.Packages}}"]
runOn: [posix, windows]
