# RFC 0010 / Template Schemas §4 activation ON_REQUEST, §3.2.1: an attached
# ON_REQUEST Environment that no Step requests is never entered.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttachedOnRequestNotEntered
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Lic
    activation: ON_REQUEST
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
expected:
  output:
  - TASK A
  forbidden:
  - ENTER Lic Product=pdefault
