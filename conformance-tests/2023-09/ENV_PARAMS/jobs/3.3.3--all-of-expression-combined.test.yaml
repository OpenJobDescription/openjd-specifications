# Template Schemas §3.3.2 and §3.3.3 (RFC 0010): a Step's allOf written as one expression resolves to a
# two-element list, [a, x], and combines with a Job Environment's literal allOf on the same custom
# attribute without conflict (§3.3.3 item 2.2); the Job runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AllOfExpressionCombined
  parameterDefinitions:
  - name: Flavor
    type: STRING
    default: a
  jobEnvironments:
  - name: Hw
    activation: ALWAYS
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        allOf: [b]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw]
  steps:
  - name: Render
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        allOf: "{{ [Param.Flavor, 'x'] }}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, Render]
runOn: [posix, windows]
expected:
  output:
  - ENTER Hw
  - TASK Render
