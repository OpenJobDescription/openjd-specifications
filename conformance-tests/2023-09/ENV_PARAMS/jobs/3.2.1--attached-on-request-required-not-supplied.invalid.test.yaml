# RFC 0010 / Template Schemas §3.2 constraint 7: a Step that requests an
# attached ON_REQUEST Environment must supply its parameter without a
# default; requesting it without the parameter is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttachedOnRequestNotSupplied
  steps:
  - name: A
    dependencies:
    - environment: Lic
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Lic
    activation: ON_REQUEST
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
