# RFC 0010 / Template Schemas §3.3.3 item 2.1: for attr.worker.os.family the Step's allOf [linux] and an
# Environment's anyOf [windows, macos] have no common value, so the submission is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: OsFamilyAllOfAnyOfConflict
  jobEnvironments:
  - name: Hw
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [windows, macos]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw]
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        allOf: [linux]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
