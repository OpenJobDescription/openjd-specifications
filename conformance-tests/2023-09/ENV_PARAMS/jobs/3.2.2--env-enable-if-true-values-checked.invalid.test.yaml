# Template Schemas §3.2.2 and constraint 6 (RFC 0010): the template of JT-157 with Lic's enableIf resolving to true.
# A enters Lic, so its value vray is checked against Product's allowedValues, and the Job is rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ValuesOfDisabledEnvironment
  parameterDefinitions:
  - name: Use
    type: STRING
    allowedValues: ["yes", "no"]
    default: "yes"
  jobEnvironments:
  - name: Lic
    activation: ON_REQUEST
    enableIf: "Param.Use == 'yes'"
    envParameterDefinitions:
    - name: Product
      type: STRING
      allowedValues: [arnold, redshift]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: vray
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Use: "yes"
runOn: [posix, windows]
