# RFC 0010 / Template Schemas §3.2 item 3.2: Step A's entry for Conda has an undeclared key and a value outside
# allowedValues, and an enableIf that resolves to false when the Job is created. A disabled entry's parameters are not
# checked, so the Job runs; A declines the BY_DEFAULT Conda, so its Sessions do not enter it.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ExpressionEntryParameters
  parameterDefinitions:
  - name: Mode
    type: STRING
    allowedValues: ["on", "off"]
  jobEnvironments:
  - name: Conda
    envParameterDefinitions:
    - name: Packages
      type: STRING
      allowedValues: [numpy, ffmpeg]
      default: numpy
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda, "Packages={{Env.Param.Packages}}"]
  steps:
  - name: A
    dependencies:
    - environment: Conda
      enableIf: "Param.Mode == 'on'"
      parameters:
        Packages: colmap
        Bogus: x
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Mode: "off"
runOn: [posix, windows]
expected:
  output:
  - TASK A
  forbidden:
  - ENTER Conda
