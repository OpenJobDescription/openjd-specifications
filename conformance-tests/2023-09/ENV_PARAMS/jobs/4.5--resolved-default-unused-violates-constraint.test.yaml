# RFC 0010 / Template Schemas §4.5 ("A default is checked", item 2): a
# non-literal default that resolves outside allowedValues is not an error when
# every Step that enters the Environment supplies the parameter.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ResolvedDefaultUnused
  parameterDefinitions:
  - name: DefaultProduct
    type: STRING
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Product
      type: STRING
      allowedValues: [arnold, redshift]
      default: "{{Param.DefaultProduct}}"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  DefaultProduct: notallowed
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=arnold
  - TASK A
