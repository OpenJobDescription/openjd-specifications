# RFC 0010 / Template Schemas §3.2 item 3.2 ("a null result is an error"): an
# enableIf of static type bool? that resolves to null at job creation is
# rejected. §7.5 rule 2 accepts bool? for a bool expression field and makes
# null an error at evaluation (README ambiguity 13, resolved).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: EnableIfNull
  parameterDefinitions:
  - name: Mode
    type: STRING
    allowedValues: ["on", "off"]
  jobEnvironments:
  - name: Lic
    activation: ON_REQUEST
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      enableIf: "null if Param.Mode == 'off' else true"
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Mode: "off"
runOn: [posix, windows]
