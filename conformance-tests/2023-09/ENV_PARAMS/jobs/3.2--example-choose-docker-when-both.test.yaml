# Template Schemas §3.2 *enableIf*, §7.3.1 Job.EnvNames (RFC 0010): an entry's enableIf may read Job.EnvNames. With
# Conda and Docker both attached as ON_REQUEST, the Conda entry's enableIf "'Docker' not in Job.EnvNames" is false,
# so the Step enters Docker only.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: VideoToCompositeChoose
  steps:
  - name: SolveSfM
    dependencies:
    - environment: Conda
      required: false
      enableIf: "'Docker' not in Job.EnvNames"
      parameters:
        Packages: colmap=3.11
    - environment: Docker
      required: false
      parameters:
        Image: docker.io/colmap/colmap:latest
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, SolveSfM]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Conda
    activation: ON_REQUEST
    envParameterDefinitions:
    - name: Packages
      type: STRING
      default: ""
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda, "Packages={{Env.Param.Packages}}"]
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Docker
    activation: ON_REQUEST
    envParameterDefinitions:
    - name: Image
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Docker, "Image={{Env.Param.Image}}"]
runOn: [posix, windows]
expected:
  output:
  - ENTER Docker Image=docker.io/colmap/colmap:latest
  - TASK SolveSfM
  forbidden:
  - ENTER Conda
