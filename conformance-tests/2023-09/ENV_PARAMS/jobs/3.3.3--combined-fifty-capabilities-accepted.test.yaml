# Template Schemas §3.3.3 (RFC 0010): an implementation may reject a Step whose combined host requirements name more
# capabilities than a limit it documents, which must be at least 50. A Step with 30 attribute requirements that enters
# a Job Environment with 20 others has 50 in its combined requirements, which every implementation accepts.
