# RFC 0010 / Template Schemas §3.2 constraint 7, §3.2.1 (after resolution): an
# attached ALWAYS Environment is entered by every Session, so a Step (B) that does
# not supply its parameter without a default is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttachedAllRequiredNotSupplied
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
