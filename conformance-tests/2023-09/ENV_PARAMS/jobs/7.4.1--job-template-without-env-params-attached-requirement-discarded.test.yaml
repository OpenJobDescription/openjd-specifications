# Template Schemas §7.4.1, §3.3, and §3.3.3 (RFC 0010): a Job Template that does not list ENV_PARAMS runs with an
# attached Environment from a document that does, whose hostRequirements read its own parameter. For the Step, which
# takes the default Gpus "", the amount's min resolves to null and the amount is discarded, because the Environment's
# document lists ENV_PARAMS. The Environment is entered and the Job runs.
template:
  specificationVersion: jobtemplate-2023-09
  name: AttachedRequirementDiscarded
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR, FEATURE_BUNDLE_1]
  environment:
    name: Docker
    activation: ALWAYS
    envParameterDefinitions:
    - name: Gpus
      type: STRING
      default: ""
    hostRequirements:
      amounts:
      - name: conformance:amount.widgets
        min: "{{ 1 if Env.Param.Gpus != '' else None }}"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Docker, "Gpus=[{{Env.Param.Gpus}}]"]
runOn: [posix, windows]
expected:
  output:
  - ENTER Docker Gpus=[]
  - TASK A
