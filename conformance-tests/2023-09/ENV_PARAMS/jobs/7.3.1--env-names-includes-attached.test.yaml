# RFC 0010 / Template Schemas §7.3.1 Job.EnvNames and §1.1 item 7: the list
# includes attached Environments, which come before the Job Template's
# jobEnvironments, in the order they are attached, as a Session enters them.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: EnvNamesIncludesAttached
  jobEnvironments:
  - name: J1
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, J1]
  - name: J2
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, J2]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A, "NAMES=[{{ Job.EnvNames.join(',') }}]"]
environments:
- specificationVersion: environment-2023-09
  environment:
    name: Q
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Q]
- specificationVersion: environment-2023-09
  environment:
    name: R
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, R]
runOn: [posix, windows]
expected:
  output:
  - TASK A NAMES=[Q,R,J1,J2]
