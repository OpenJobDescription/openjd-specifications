# RFC 0010 / Template Schemas §3.2 item 3.2 and §3.2.1: Step A's entry for Lic has the literal enableIf: false. Lic is
# not a jobEnvironments entry, so template validation cannot know its activation; when the Job is created the name
# resolves to an attached ALWAYS Environment, which no Step can leave out, so the submission is rejected, naming A
# and Lic. Lic's parameter has a default, so constraint 7 is not what rejects it.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttachedAlwaysEntryDisabledLiteral
  steps:
  - name: A
    dependencies:
    - environment: Lic
      enableIf: false
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
