# Template Schemas §3.2.1 item 4 and constraint 7 (RFC 0010): the attached BY_DEFAULT Environment Lic has the name of a
# jobEnvironments entry, so no entry can reach it to supply Product, which has no default. Its enableIf, over its
# Environment Template's own Job Parameter, resolves to false, so it is disabled for every Step and needs no values:
# the Job runs without entering it.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: UnreachableAttached
  jobEnvironments:
  - name: Lic
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, JobLic]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  parameterDefinitions:
  - name: UseLic
    type: STRING
    default: "no"
  environment:
    name: Lic
    activation: BY_DEFAULT
    enableIf: "Param.UseLic == 'yes'"
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, AttachedLic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
expected:
  output:
  - ENTER JobLic
  - TASK A
  forbidden:
  - ENTER AttachedLic
