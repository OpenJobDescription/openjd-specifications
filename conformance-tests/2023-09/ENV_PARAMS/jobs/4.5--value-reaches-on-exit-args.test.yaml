# RFC 0010 / Template Schemas §4.5, How Jobs Are Run §Environment Parameters:
# onExit sees the same Env.Param value the Session entered the Environment with.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ValueReachesOnExit
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
        onExit:
          command: echo
          args: [EXIT, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=arnold
  - EXIT Lic Product=arnold
