# Template Schemas §3.3 item 2 (RFC 0010): with ENV_PARAMS, an anyOf or allOf list that has no values
# once its null items are skipped is an error at job creation, as an empty list is under §3.3.2; the
# attribute requirement is not discarded. The Step's only attribute has one anyOf value that resolves
# to null when Flavor is empty, so the Job is rejected, naming the Step and the attribute.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttributeAnyOfResolvesEmpty
  parameterDefinitions:
  - name: Flavor
    type: STRING
    default: ""
  steps:
  - name: Render
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: ["{{ Param.Flavor if Param.Flavor != '' else None }}"]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, Render]
runOn: [posix, windows]
