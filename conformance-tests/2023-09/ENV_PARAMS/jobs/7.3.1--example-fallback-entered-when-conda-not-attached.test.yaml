# RFC 0010 rationale `Job.EnvNames`, Template Schemas §7.3.1: a Job Template's own fallback Environment is entered
# only where no Environment named Conda is attached. Nothing is attached, so the Session enters InstallTools.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: FallbackWhenNothingAttached
  jobEnvironments:
  - name: InstallTools
    enableIf: "'Conda' not in Job.EnvNames"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, InstallTools]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - ENTER InstallTools
  - TASK A
