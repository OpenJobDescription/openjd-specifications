# RFC 0010 / Template Schemas §7.3.1 Job.EnvNames ("Step Environments are not
# included"): a Step Environment's name does not appear in the list.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: EnvNamesExcludesStepEnvironments
  jobEnvironments:
  - name: J
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, J]
  steps:
  - name: A
    stepEnvironments:
    - name: S
      script:
        actions:
          onEnter:
            command: echo
            args: [ENTER, S]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A, "NAMES=[{{ Job.EnvNames.join(',') }}]"]
runOn: [posix, windows]
expected:
  output:
  - ENTER S
  - TASK A NAMES=[J]
