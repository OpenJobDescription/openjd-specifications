# RFC 0010 / Template Schemas §3.2 item 3.2: an entry whose enableIf resolves to
# true at job creation is in effect, so its ON_REQUEST Environment is
# entered with the entry's value.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: EnableIfTrueEnters
  parameterDefinitions:
  - name: Mode
    type: STRING
    allowedValues: ["on", "off"]
  jobEnvironments:
  - name: Lic
    activation: ON_REQUEST
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: pdefault
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      enableIf: "Param.Mode == 'on'"
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Mode: "on"
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=arnold
  - TASK A
