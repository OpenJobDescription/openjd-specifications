# RFC 0010 / Template Schemas §4 item 4 (activation), §3.2 *enableIf*, §7.4.1 step 4: as JB-140, whose disabled entry
# declines an attached BY_DEFAULT Environment, but Conda's Environment Template does not list ENV_PARAMS. The entry's
# enableIf "'Docker' in Job.EnvNames" is false when the Job is created, and the disabled entry has no effect on an
# Environment that behaves as ALWAYS, so Step A's Session still enters Conda.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ExternalWithoutEnvParamsDisabledByExpression
  steps:
  - name: A
    dependencies:
    - environment: Conda
      required: false
      enableIf: "'Docker' in Job.EnvNames"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: CondaPackages
    type: STRING
    default: ""
  environment:
    name: Conda
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda, "CondaPackages={{Param.CondaPackages}}"]
parameters:
  CondaPackages: ffmpeg=6
runOn: [posix, windows]
expected:
  output:
  - ENTER Conda CondaPackages=ffmpeg=6
  - TASK A
