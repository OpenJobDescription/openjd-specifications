# RFC 0010 / Template Schemas §3.3.3 item 2.1 (conflicting sources may be two Environments the Step's Sessions
# enter): two BY_DEFAULT Job Environments require disjoint anyOf values of attr.worker.os.family, so every Step's combined
# requirements conflict and the submission is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ConflictBetweenTwoEnvironments
  jobEnvironments:
  - name: E1
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [linux]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, E1]
  - name: E2
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [windows]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, E2]
  steps:
  - name: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
