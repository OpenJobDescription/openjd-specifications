# RFC 0010 / Template Schemas §4.5 (Env.Param.<name> for PATH has path mapping
# rules applied): a PATH value supplied from "{{RawParam.Dir}}" is path-mapped
# when read as Env.Param.Dir.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: PathValueMappedPosix
  parameterDefinitions:
  - name: Dir
    type: PATH
  jobEnvironments:
  - name: Mnt
    envParameterDefinitions:
    - name: Dir
      type: PATH
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print(r'ENV_DIR:{{Env.Param.Dir}}')"]
  steps:
  - name: A
    dependencies:
    - environment: Mnt
      parameters:
        Dir: "{{RawParam.Dir}}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Dir: /original/data
pathMapping:
- source_path_format: POSIX
  source_path: /original
  destination_path: /mapped
runOn: [posix]
expected:
  output:
  - ENV_DIR:/mapped/data
  forbidden:
  - ENV_DIR:/original/data
