# RFC 0010 / Template Schemas §3.2 constraint 6 (checked at job creation once
# format strings are resolved): a Job Environment value "{{Param.N}}" that
# resolves below minValue is rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: FormatStringValueViolates
  parameterDefinitions:
  - name: N
    type: INT
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Seats
      type: INT
      minValue: 1
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Seats={{Env.Param.Seats}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Seats: "{{Param.N}}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  N: 0
runOn: [posix, windows]
