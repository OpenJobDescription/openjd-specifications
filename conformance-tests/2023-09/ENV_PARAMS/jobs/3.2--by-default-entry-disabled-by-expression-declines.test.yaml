# RFC 0010 / Template Schemas §3.2 item 3.2 and constraint 7: a disabled entry for a BY_DEFAULT Job Environment
# declines it. Lic's Product has no default. Step A's entry has enableIf "'Nope' in Job.EnvNames", which resolves to
# false when the Job is created, so A's Sessions do not enter Lic and constraint 7 does not apply to A. Step B's entry
# resolves to true and supplies Product, so B's Sessions enter Lic. Had A entered Lic, it would have had no Product
# and the Job would be rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ByDefaultEntryDisabledDeclines
  jobEnvironments:
  - name: Lic
    envParameterDefinitions:
    - name: Product
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      enableIf: "'Nope' in Job.EnvNames"
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    dependencies:
    - environment: Lic
      enableIf: "'Nope' not in Job.EnvNames"
      parameters:
        Product: maya
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=maya
  forbidden:
  - ENTER Lic Product=arnold
