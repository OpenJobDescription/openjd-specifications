# RFC 0010 / Template Schemas §3.2.1, §4 item 6, and §3.2.2 item 6: an attached Environment whose activation is
# ALWAYS cannot be disabled. Its enableIf reads its own Env.Param.Product and is false for Step B, which takes the
# default none, so the submission is rejected, naming B and Lic. Each document passes template validation on its
# own (ET-44 covers only a literal false).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttachedAlwaysEnableIfFalse
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    dependencies:
    - step: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: none
    enableIf: "Env.Param.Product != 'none'"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
runOn: [posix, windows]
