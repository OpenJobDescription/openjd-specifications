# Template Schemas §3.2.2 item 2 (RFC 0010): Lic's enableIf reads Env.Param.Seats, and A's value for it, {{ Param.L[5]
# }}, fails to resolve (L has one element). The enableIf sees only concrete values, so it is not evaluated, and the
# value's error rejects the Job when it is created.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: EnableIfReadsUnresolvable
  parameterDefinitions:
  - name: L
    type: LIST[INT]
    default: [1]
  jobEnvironments:
  - name: Lic
    activation: ON_REQUEST
    enableIf: "Env.Param.Seats > 0"
    envParameterDefinitions:
    - name: Seats
      type: INT
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Seats={{Env.Param.Seats}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Seats: "{{ Param.L[5] }}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
