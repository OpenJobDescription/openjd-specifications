# RFC 0010 / Template Schemas §3.3.3 item 2.2 (each form depends only on the set of requirements): the Step's anyOf
# [a], E1's anyOf [b, c], and E2's allOf [x] are allOf [a, x] together with anyOf [b, c], which some host satisfies
# whatever order the sources are combined in. Not a conflict; the Job runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AttributeCombinationOrderIndependent
  jobEnvironments:
  - name: E1
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [b, c]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, E1]
  - name: E2
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        allOf: [x]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, E2]
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - ENTER E1
  - ENTER E2
  - TASK A
