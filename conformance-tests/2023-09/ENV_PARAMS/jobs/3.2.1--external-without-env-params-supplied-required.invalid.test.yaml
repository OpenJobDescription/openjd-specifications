# RFC 0010 / Template Schemas §3.2.1 item 1, §3.2 constraint 5: the same
# pre-extension Environment, which declares no parameters, rejects an entry
# with required: true that supplies one. Only required: false has its
# parameters ignored.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ExternalWithoutEnvParamsSuppliedRequired
  steps:
  - name: A
    dependencies:
    - environment: Conda
      required: true
      parameters:
        Packages: ffmpeg=7
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: CondaPackages
    type: STRING
    default: ""
  environment:
    name: Conda
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda, "CondaPackages={{Param.CondaPackages}}"]
parameters:
  CondaPackages: ffmpeg=6
runOn: [posix, windows]
