# Template Schemas §4.5 item 4 (RFC 0010): Step A's value is the single expression {{Param.Frames}}, whose result is a
# range_expr with no other spelling, so only its canonical form "1-3" is checked against maxLength 3, although the Job
# Parameter was submitted as "1,2,3". The Job runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: RangeExprComputedLength
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
  jobEnvironments:
  - name: Cache
    activation: ON_REQUEST
    envParameterDefinitions:
    - name: Frames
      type: RANGE_EXPR
      maxLength: 3
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Cache, "{{Env.Param.Frames}}"]
  steps:
  - name: A
    dependencies:
    - environment: Cache
      parameters:
        Frames: "{{Param.Frames}}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
parameters:
  Frames: "1,2,3"
runOn: [posix, windows]
expected:
  output:
  - ENTER Cache 1-3
  - TASK A
