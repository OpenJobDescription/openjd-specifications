# RFC 0010 / Template Schemas §4 hostRequirements item 1, §3.3.3 item 2.1: the Environment's
# anyOf ["{{Env.Param.Os}}"] on attr.worker.os.family resolves with the Step's value windows, which is not in the
# Step's own anyOf [linux, macos]. The conflict exists only after resolution, and the submission is rejected at job
# creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ConflictResolvedFromEnvParam
  jobEnvironments:
  - name: Hw
    activation: ALWAYS
    envParameterDefinitions:
    - name: Os
      type: STRING
      default: linux
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: ["{{Env.Param.Os}}"]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw, "Os={{Env.Param.Os}}"]
  steps:
  - name: A
    dependencies:
    - environment: Hw
      parameters:
        Os: windows
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [linux, macos]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
