# Template Schemas §4 item 7 (RFC 0010): the group is applied after each Environment's enableIf. Conda is attached
# first, but the Step supplies no packages, so Conda's enableIf is false and the Step's Sessions enter Docker.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: GroupJob
  steps:
  - name: S
    dependencies:
    - environment: Conda
      required: false
      parameters:
        Packages: ""
    - environment: Docker
      required: false
      parameters:
        Image: img
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, S]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Conda
    activation: ON_REQUEST
    exclusiveGroup: SoftwareProvider
    envParameterDefinitions:
    - name: Packages
      type: STRING
      default: ""
    enableIf: "Env.Param.Packages != ''"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Conda]
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Docker
    activation: ON_REQUEST
    exclusiveGroup: SoftwareProvider
    envParameterDefinitions:
    - name: Image
      type: STRING
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Docker]
runOn: [posix, windows]
expected:
  output:
  - ENTER Docker
  - TASK S
  forbidden:
  - ENTER Conda
