# Template Schemas §4 item 7, §1.1 item 7 (RFC 0010): the group applies to Job Environments too, in the Job's
# Environment order. A and B are BY_DEFAULT Job Environments in one group, listed A then B, so every Step's Sessions
# enter only A.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: GroupJob
  jobEnvironments:
  - name: A
    exclusiveGroup: G
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, A]
  - name: B
    exclusiveGroup: G
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, B]
  steps:
  - name: S
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, S]
runOn: [posix, windows]
expected:
  output:
  - ENTER A
  - TASK S
  forbidden:
  - ENTER B
