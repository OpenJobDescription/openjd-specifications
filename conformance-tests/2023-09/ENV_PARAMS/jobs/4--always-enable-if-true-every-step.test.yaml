# RFC 0010 / Template Schemas §4 item 4 and item 6: an ALWAYS Environment whose enableIf is true for every Step is
# not an error. Every Step's Session enters it: A with its own Product, and B, which has no entry, with the default.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AlwaysEnableIfTrue
  jobEnvironments:
  - name: Lic
    activation: ALWAYS
    envParameterDefinitions:
    - name: Product
      type: STRING
      default: maya
    enableIf: "Env.Param.Product != 'none'"
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Lic, "Product={{Env.Param.Product}}"]
  steps:
  - name: A
    dependencies:
    - environment: Lic
      parameters:
        Product: arnold
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
  - name: B
    dependencies:
    - step: A
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, B]
runOn: [posix, windows]
expected:
  output:
  - ENTER Lic Product=arnold
  - ENTER Lic Product=maya
  - TASK A
  - TASK B
