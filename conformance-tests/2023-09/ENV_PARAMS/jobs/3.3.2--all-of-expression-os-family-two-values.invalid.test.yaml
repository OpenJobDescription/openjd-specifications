# Template Schemas §3.3.2.1 (RFC 0010): a host has exactly one value of attr.worker.os.family, so an allOf for it has at
# most one value. Here the allOf is one expression; it resolves to [linux, windows] for every value of Second, so the
# submission is rejected for every value. An implementation should already report it at template validation (§7.6 rule
# 5); the test passes whichever stage rejects it (README item 18).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AllOfExpressionOsFamilyTwoValues
  parameterDefinitions:
  - name: Second
    type: STRING
    default: windows
  steps:
  - name: Render
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        allOf: "{{ ['linux', Param.Second] }}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, Render]
runOn: [posix, windows]
