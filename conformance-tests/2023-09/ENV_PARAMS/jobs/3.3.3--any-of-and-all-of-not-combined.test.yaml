# RFC 0010 / Template Schemas §3.3.3 item 4: an anyOf requirement from the
# Step and an allOf requirement from an Environment on one attribute are not
# combined, and are not a conflict; the Job runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: AnyOfAndAllOfNotCombined
  jobEnvironments:
  - name: Hw
    activation: ALWAYS
    envParameterDefinitions:
    - name: Flavor
      type: STRING
      default: a
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        allOf: [c]
    script:
      actions:
        onEnter:
          command: echo
          args: [ENTER, Hw, "Flavor={{Env.Param.Flavor}}"]
  steps:
  - name: A
    hostRequirements:
      attributes:
      - name: conformance:attr.flavor
        anyOf: [a, b]
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
runOn: [posix, windows]
expected:
  output:
  - TASK A
