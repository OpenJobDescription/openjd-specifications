# Template Schemas §4.5 item 3 (RFC 0010): a string converted to a PATH value, or to an element of a LIST[PATH] value,
# keeps its text, so a PATH value that is a single {{ }} expression whose result is a string is that string, with its
# repeated separators, "." components and trailing separator, as are the strings in a LIST[PATH] value's list. The
# strings come from string literals and from a STRING Job Parameter, as a Step's entry values and as an Environment
# parameter's default; Env.RawParam reads each unchanged. In contrast, a result that is already a path is that path's
# string form, which path() normalizes.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: SingleExpressionStringKeepsText
  parameterDefinitions:
  - name: Text
    type: STRING
    default: "from//param/./x/"
  steps:
  - name: A
    dependencies:
    - environment: Mnt
      parameters:
        Lit: "{{ 'rel//a/./b/' }}"
        Copy: "{{Param.Text}}"
        Dirs: "{{ ['x//y/', './z', Param.Text] }}"
        Norm: "{{ path('rel//a/./b/') }}"
    script:
      actions:
        onRun:
          command: echo
          args: [TASK, A]
environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Mnt
    envParameterDefinitions:
    - name: Lit
      type: PATH
    - name: Copy
      type: PATH
    - name: Dirs
      type: LIST[PATH]
    - name: Norm
      type: PATH
    - name: Def
      type: PATH
      default: "{{ './def//d/' }}"
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - |
            print(r'LIT:[{{Env.RawParam.Lit}}]')
            print(r'COPY:[{{Env.RawParam.Copy}}]')
            print(r'DIRS:[{{ Env.RawParam.Dirs.join(',') }}]')
            print(r'DEF:[{{Env.RawParam.Def}}]')
            print(r'NORM:[{{Env.RawParam.Norm}}]')
runOn: [posix, windows]
expected:
  output:
  - LIT:[rel//a/./b/]
  - COPY:[from//param/./x/]
  - DIRS:[x//y/,./z,from//param/./x/]
  - DEF:[./def//d/]
  - NORM:[rel/a/b]
  - TASK A
