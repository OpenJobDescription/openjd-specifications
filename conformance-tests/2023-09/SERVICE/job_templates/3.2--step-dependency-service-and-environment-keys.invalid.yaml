# Section 3.2 constraint 4 (RFC 0009): exactly one of dependsOn, step, service,
# or environment is present in a <StepDependency>; an entry that gives both
# `service` and `environment` is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Tools
  variables:
    TOOLS: "1"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
    environment: Tools
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
