# Section 4 item 3 constraint 5 / Section 4 item 4 constraint 2 / Section 9.9
# item 14: an Environment that lists a Service in `dependencies` must not give
# an explicit `runScope` that includes SERVICE, whether or not it references
# the Service: a Service Session may begin before any Service other than its
# own has an endpoint.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  dependencies:
  - service: Store
  runScope: [TASK, SERVICE]
  variables:
    GREETING: hello
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
