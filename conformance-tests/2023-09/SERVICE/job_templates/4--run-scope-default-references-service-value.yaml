# Section 4 item 4 (RFC 0009): a Job Environment that lists a Service in its
# `dependencies` and gives no runScope defaults to [TASK], so it is entered in
# Task Sessions only and its reference to the listed Service is valid. The
# dependency puts every Step in the Service's scope (Section 9.1 rule 3).
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  dependencies:
  - service: Store
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
