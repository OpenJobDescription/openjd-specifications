# Section 9 item 7 / Section 9.9 item 4: an explicit TCP_CONNECT check on a
# Service none of whose ports is TCP is rejected like the default; its default
# port list (every TCP port) is empty.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Telemetry
  ports:
  - name: ingest
    protocol: UDP
  - name: discovery
    protocol: UDP
  healthCheck:
    type: TCP_CONNECT
    readinessTimeoutSeconds: 30
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Telemetry
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
