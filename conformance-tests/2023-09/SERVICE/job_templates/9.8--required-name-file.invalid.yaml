# Section 9.8 item 1 / Section 9.2 (RFC 0009): a requirement's `name` is a
# <ServiceName>, which must not be `File`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
externalServices:
- name: File
  ports:
  - name: main
steps:
- name: Use
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
