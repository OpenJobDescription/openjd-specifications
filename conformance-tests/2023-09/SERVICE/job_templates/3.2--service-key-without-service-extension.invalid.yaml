# Section 3.2 (RFC 0009): the `service` key of a <StepDependency> is available
# only when using the SERVICE extension. In a template that does not declare
# SERVICE it is an unknown field, gated like every other SERVICE property, and
# the template must be rejected.
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Prepare
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Use
  dependencies:
  - service: Prepare
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
