# Section 4 scope list item 5 / Section 7.3.1: a Job Environment that lists a
# Service in `dependencies` may reference its `port` and `connectAddress`
# only, never `bindAddress`, which is in scope in the declaring Service alone.
# Client is ON_REQUEST and requested by Step1, so Store's Sessions do not
# enter it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  activation: ON_REQUEST
  dependencies:
  - service: Store
  variables:
    STORE_BIND: "{{ Service.Store.main.bindAddress }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - environment: Client
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
