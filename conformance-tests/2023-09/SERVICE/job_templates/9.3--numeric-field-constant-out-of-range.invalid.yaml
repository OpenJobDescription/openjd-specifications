# Section 9.3 (RFC 0009): a whole-field expression's non-null result must
# satisfy the field's range. A constant expression can be folded at
# template validation and rejected there.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
    port: "{{ 65535 + 1 }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
