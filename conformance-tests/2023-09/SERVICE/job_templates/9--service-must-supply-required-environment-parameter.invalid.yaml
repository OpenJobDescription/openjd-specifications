# Section 3.2 item 3 (RFC 0009) / RFC 0010 <StepDependency> constraint 7: a
# Service is held to constraint 7 as a Step is. The ALWAYS Environment Conda
# has a parameter with no default; the Step supplies it, but the Service,
# whose Session also enters Conda, does not.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
  variables:
    CONDA_PACKAGES: "{{ Env.Param.Packages }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  - environment: Conda
    parameters:
      Packages: numpy
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
