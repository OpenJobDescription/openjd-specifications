# Section 9 / Section 9.9 item 7 (RFC 0009): a template that lists SERVICE in
# `extensions` must also list EXPR. SERVICE alone must be rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
name: TestJob
