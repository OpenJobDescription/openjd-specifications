# Section 3.3.2.1 / Section 9 item 5 (RFC 0009): a stateful Service requires
# non-preemptible capacity through its own hostRequirements.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  hostRequirements:
    attributes:
    - name: attr.worker.preemptible
      anyOf: ["false"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
