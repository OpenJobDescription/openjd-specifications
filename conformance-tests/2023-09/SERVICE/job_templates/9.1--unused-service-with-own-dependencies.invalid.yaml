# Section 9.1 rule 4 / Section 1.1 item 8 constraint 6 / Section 9.9 item 11
# (RFC 0009): a Service that no Step, Service, or Job Environment lists in
# `dependencies` has an empty scope and is rejected. Indexer's own dependency
# on Prepare does not make it used; nothing depends on Indexer.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Indexer
  dependencies:
  - dependsOn: Prepare
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Prepare
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Other
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
