# Section 4.3 WRAP_ACTIONS constraint 6 (RFC 0009 rule 1): a wrapping
# Environment in a Step's `stepEnvironments` has no runScope (Section 4 item 4)
# and is entered only by the Task Sessions of its Step, so it defines exactly
# RFC 0008's three hooks: onWrapEnvEnter, onWrapTaskRun, onWrapEnvExit. It is
# valid alongside a Service, whose Session never enters it.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  stepEnvironments:
  - name: Wrapper
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["-c", "print()"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print()"]
        onWrapTaskRun:
          command: python
          args: ["-c", "print()"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
