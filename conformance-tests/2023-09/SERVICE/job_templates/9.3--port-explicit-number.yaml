# Section 9.3 item 2: `port` may request a specific TCP port in 1-65535, as
# an integer or an integer string.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
    port: 6379
  - name: admin
    port: "65535"
  - name: low
    port: 1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
