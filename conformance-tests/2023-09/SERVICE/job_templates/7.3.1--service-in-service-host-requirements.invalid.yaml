# Section 9 / Section 9.9 item 2: `Service.*` is never in scope in a
# Service's own hostRequirements either, not even its own endpoint.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  hostRequirements:
    amounts:
    - name: amount.worker.vcpu
      min: "{{ Service.Store.main.port }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
