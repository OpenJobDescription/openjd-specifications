# Section 5 / Section 7.4: an action's `timeout` is resolved at job
# creation, when Service.* values are unknown, so it cannot reference them.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
        timeout: "{{ Service.Store.main.port }}"
