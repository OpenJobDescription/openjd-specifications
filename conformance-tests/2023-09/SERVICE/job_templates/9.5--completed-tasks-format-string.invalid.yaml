# Section 9.5 item 2: `completedTasks` is a literal enum("KEEP", "RERUN") and,
# unlike `maxAttempts`, is not @fmtstring. A format string over a STRING
# parameter -- even one whose default resolves to a valid value -- is rejected
# at template validation, not resolved at job creation.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
parameterDefinitions:
- name: Policy
  type: STRING
  default: KEEP
services:
- name: Store
  ports:
  - name: main
  restartPolicy:
    completedTasks: "{{ Param.Policy }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
