# Section 9.4: the ready deadline is `readinessTimeoutSeconds`; `timeoutSeconds` is
# not a property of <ServiceHealthCheck> and must be rejected as unknown.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  healthCheck:
    type: TCP_CONNECT
    timeoutSeconds: 60
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
