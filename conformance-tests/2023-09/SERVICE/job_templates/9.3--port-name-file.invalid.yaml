# Section 9.3 item 1: a port's `name` must not be `File`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: File
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
