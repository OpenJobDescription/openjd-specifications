# Section 1.1 item 8 / Section 9 (RFC 0009): a minimal Service. Only
# `name`, `ports`, and `script.actions.onRun` are required; healthCheck
# defaults to TCP_CONNECT on every TCP port and restartPolicy to
# { maxAttempts: 0 }, which needs no completedTasks.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print({{ Service.Store.main.port }})"]
