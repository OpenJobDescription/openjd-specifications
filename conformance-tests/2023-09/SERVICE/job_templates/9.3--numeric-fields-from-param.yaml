# Section 9.3 (RFC 0009): the numeric @fmtstring fields -- <ServicePort>.port,
# <ServiceHealthCheck>.readinessTimeoutSeconds and readinessIntervalSeconds (see
# 9.3--health-numeric-fields-from-param for all four), and
# <ServiceRestartPolicy>.maxAttempts -- may be format strings over Param.*,
# RawParam.*, Job.Name, and <Service>.let bindings, resolved at job creation.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
parameterDefinitions:
- name: Port
  type: INT
  default: 16379
- name: Patience
  type: INT
  default: 60
services:
- name: Store
  let:
  - attempts = 1 if Param.Patience > 30 else 0
  ports:
  - name: main
    port: "{{ Param.Port }}"
  healthCheck:
    type: COMMAND
    readinessIntervalSeconds: "{{ Param.Patience // 10 }}"
    readinessTimeoutSeconds: "{{ Param.Patience }}"
  restartPolicy:
    maxAttempts: "{{ attempts }}"
    completedTasks: KEEP
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
      onHealthCheck:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
