# Section 7.3.1 / Section 9 scope rule 3 (RFC 0009): a Service's `port` and
# `connectAddress` are in scope in the script of a Step that lists
# `service: <name>` in its `dependencies`, including its embedded files and
# <StepScript>.let.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    let:
    - endpoint = join_host_port(Service.Store.main.connectAddress, Service.Store.main.port)
    actions:
      onRun:
        command: python
        args: ["{{ Task.File.Run }}", "{{ endpoint }}"]
    embeddedFiles:
    - name: Run
      type: TEXT
      data: |
        print("{{ Service.Store.main.connectAddress }}", {{ Service.Store.main.port }})
