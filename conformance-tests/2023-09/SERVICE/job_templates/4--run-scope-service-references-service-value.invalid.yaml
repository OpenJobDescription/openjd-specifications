# Section 4 item 4 constraint 2 / Section 9.9 items 2 and 14: an Environment
# whose runScope includes SERVICE must neither list a Service in `dependencies`
# nor reference any Service.* value, because a Service Session may begin before
# any Service other than its own has an endpoint.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  dependencies:
  - service: Store
  runScope: [SERVICE]
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
