# Section 3.2 constraint 3 / Section 9 item 4 constraint 3 / Section 9.9 item
# 10 (RFC 0009): a cycle through two Services is rejected like a direct one.
# Prepare depends on Service Front, Front depends on Service Indexer, and
# Indexer depends on Prepare, so Prepare is in Indexer's scope (Section 9.1
# rule 2) and the graph has a cycle.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Indexer
  dependencies:
  - dependsOn: Prepare
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Front
  dependencies:
  - service: Indexer
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Indexer.main.port }}"]
steps:
- name: Prepare
  dependencies:
  - service: Front
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Front.main.port }}"]
