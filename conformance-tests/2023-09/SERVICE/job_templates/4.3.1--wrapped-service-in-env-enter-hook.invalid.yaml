# Section 4 scope rule / Section 4.3.1: WrappedService.* is not available in
# onWrapEnvEnter, even in a SERVICE-scoped wrapping Environment whose inner
# Environments are entered in a Service Session.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Wrapper
  runScope: [SERVICE]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()", "{{ WrappedService.Name }} {{ WrappedService.PortNames[0] }} {{ WrappedService.Ports[0] }} {{ WrappedService.BindAddresses[0] }}"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
