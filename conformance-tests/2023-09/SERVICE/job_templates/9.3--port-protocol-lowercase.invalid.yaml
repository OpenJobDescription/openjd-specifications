# Section 9.3 item 3: `protocol` values are literals; `udp` is not `UDP`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Telemetry
  ports:
  - name: ingest
    protocol: udp
  healthCheck:
    type: STDOUT
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Telemetry
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
