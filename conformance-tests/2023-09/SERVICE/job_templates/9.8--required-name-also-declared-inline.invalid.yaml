# Section 1.1 item 9 constraint 4 / Section 9.8 item 1 (RFC 0009): a Service
# is either declared or required. `Cache` appears in both lists.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
externalServices:
- name: Cache
  ports:
  - name: main
services:
- name: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Use
  dependencies:
  - service: Cache
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Cache.main.port }}"]
