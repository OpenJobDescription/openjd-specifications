# Section 9 item 4 (RFC 0009): a Service may depend on several Steps; it
# starts once all of them have completed.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Indexer
  dependencies:
  - dependsOn: PrepareA
  - dependsOn: PrepareB
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: PrepareA
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: PrepareB
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Use
  dependencies:
  - dependsOn: PrepareA
  - dependsOn: PrepareB
  - service: Indexer
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Indexer.main.port }}"]
