# Section 9.3 (RFC 0009): the numeric @fmtstring fields must not reference
# `Service.*`; an endpoint is not known at job creation.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  healthCheck:
    type: TCP_CONNECT
    readinessTimeoutSeconds: "{{ Service.Store.main.port }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
