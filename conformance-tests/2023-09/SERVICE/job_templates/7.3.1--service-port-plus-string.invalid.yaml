# Section 7.3.1 / Section 7.4: `Service.<name>.<port>.port` is an int and
# `connectAddress` a string; concatenating them without conversion is a
# type error at template validation, even though the values are unresolved.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.connectAddress + Service.Store.main.port }}"]
