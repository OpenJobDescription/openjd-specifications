# Section 9.1 rule 2 (RFC 0009): Front depends on Service Back, and only Step1
# depends on Service Front. Step1 is therefore in Back's scope transitively,
# although it never names Back, and Back is READY before Front starts. Step2
# is in neither scope.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Front
  dependencies:
  - service: Back
  ports:
  - name: api
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.connectAddress }}", "{{ Service.Back.main.port }}"]
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Front
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Front.api.port }}"]
- name: Step2
  dependencies:
  - dependsOn: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
