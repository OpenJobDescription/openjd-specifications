# Section 9 item 3 / Section 9.9 item 2: a <Service>'s `let` is evaluated at
# job creation and may not reference `Service.*`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  let:
  - Port = Service.Store.main.port
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Port }}"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
