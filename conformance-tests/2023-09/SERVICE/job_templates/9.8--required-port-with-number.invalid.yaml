# Section 9.8.1 (RFC 0009): a <ServiceRequirementPort> names a port and its
# protocol only; the number is the attached Service's to choose.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
externalServices:
- name: Ext
  ports:
  - name: main
    port: 6379
steps:
- name: Use
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
