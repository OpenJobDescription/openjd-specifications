# Section 3.2 constraint 3 / Section 9 item 4 constraint 3 / Section 9.9 item
# 10 (RFC 0009): the `dependencies` of a template's Steps and Services form one
# graph, which must be acyclic. Prepare depends on Service Indexer and Indexer
# depends on Prepare: Prepare could not run until Indexer was READY, and
# Indexer could not start until Prepare completed.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Indexer
  dependencies:
  - dependsOn: Prepare
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Prepare
  dependencies:
  - service: Indexer
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Indexer.main.port }}"]
