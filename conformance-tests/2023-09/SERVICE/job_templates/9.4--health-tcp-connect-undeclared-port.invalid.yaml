# Section 9.4 item 2 / Section 9.9 item 4: every port a TCP_CONNECT check
# names must be declared in the Service's `ports`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  - name: admin
  healthCheck:
    type: TCP_CONNECT
    ports: [main, metrics]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
