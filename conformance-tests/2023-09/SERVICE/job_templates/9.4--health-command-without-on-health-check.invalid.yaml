# Section 9.4 item 1 / Section 9.7 item 3 / Section 9.9 item 4: a Service
# whose health check type is COMMAND must define onHealthCheck.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  - name: admin
  healthCheck:
    type: COMMAND
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
