# Section 9 item 6 constraint 2: a Service may declare up to 10 ports.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: p1
  - name: p2
  - name: p3
  - name: p4
  - name: p5
  - name: p6
  - name: p7
  - name: p8
  - name: p9
