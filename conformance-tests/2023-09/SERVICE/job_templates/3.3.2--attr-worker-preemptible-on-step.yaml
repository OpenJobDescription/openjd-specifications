# Section 3.3.2.1 (RFC 0009): attr.worker.preemptible is a standard attribute
# capability, not gated by SERVICE, that any Step may require. Values are the
# strings "true" and "false".
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: attr.worker.preemptible
      anyOf: ["false"]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
