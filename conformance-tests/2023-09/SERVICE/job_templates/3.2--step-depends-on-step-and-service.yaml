# Section 3 item 4 / Section 3.2 (RFC 0009): one `dependencies` list names
# both kinds of dependency. Use's Tasks are scheduled only once Prepare has
# completed and Store is READY; the `service` entry puts Use in Store's scope
# and is what lets Use's script reference Service.Store.*.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: Prepare
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Use
  dependencies:
  - dependsOn: Prepare
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.connectAddress }}"]
