# Section 4.3 item 5: the onWrapService* hooks are available only when using
# both WRAP_ACTIONS and SERVICE. With WRAP_ACTIONS alone they must be
# rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- EXPR
name: TestJob
jobEnvironments:
- name: Wrapper
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapTaskRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
