# Section 9.4 item 6: on a STDOUT check `failureThreshold` is permitted only
# together with `healthIntervalSeconds`; without a heartbeat interval there is
# no probe for the threshold to count.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  healthCheck:
    type: STDOUT
    failureThreshold: 2
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
