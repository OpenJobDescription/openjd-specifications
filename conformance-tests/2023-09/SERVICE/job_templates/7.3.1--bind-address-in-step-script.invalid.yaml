# Section 7.3.1 (RFC 0009): `Service.<name>.<port>.bindAddress` is available
# only within the declaring Service, never to the Tasks that connect to it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.bindAddress }}"]
