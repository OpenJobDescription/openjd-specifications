# Section 4 item 3 constraint 3 / Section 3.2 constraint 2 / Section 9.9 item
# 14: no two entries of an Environment's `dependencies` may name the same
# Service. Client is ON_REQUEST and requested by Step1, so Store's Sessions
# do not enter it and the duplicate is the only error.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  activation: ON_REQUEST
  dependencies:
  - service: Store
  - service: Store
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: Step1
  dependencies:
  - environment: Client
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
