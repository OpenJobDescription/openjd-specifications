# Section 9 item 4 (RFC 0009): the *parameters* values and *enableIf* of a
# Service's `environment:` entry may not reference Step.Name, since a Service
# belongs to no Step.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  activation: ON_REQUEST
  envParameterDefinitions:
  - name: Packages
    type: STRING
    default: ""
  variables:
    CONDA_PACKAGES: "{{ Env.Param.Packages }}"
services:
- name: Store
  dependencies:
  - environment: Conda
    parameters:
      Packages: "{{ Step.Name }}"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
