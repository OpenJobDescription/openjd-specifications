# Section 9.3 item 3: `protocol` is one of TCP or UDP.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
    protocol: SCTP
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
