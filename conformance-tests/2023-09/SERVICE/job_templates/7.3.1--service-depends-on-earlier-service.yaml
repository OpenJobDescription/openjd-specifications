# Section 9 item 4 / Section 9 scope rule 2 / Section 9.1 rule 2 (RFC 0009):
# a Service may depend on another Service in the same list with
# `service: <name>`, which lets it reference that Service's `port`
# and `connectAddress`, guarantees Back is READY before Front starts, and puts
# Front's scope inside Back's.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
- name: Front
  dependencies:
  - service: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.connectAddress }}", "{{ Service.Back.main.port }}"]
steps:
- name: Step1
  dependencies:
  - service: Front
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Front.main.port }}"]
