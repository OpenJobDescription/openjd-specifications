# Section 9.4 item 2: a TCP_CONNECT check on a mixed Service may name its TCP
# port explicitly, leaving the UDP port unprobed.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Metrics
  ports:
  - name: ingest
    protocol: UDP
  - name: api
  healthCheck:
    type: TCP_CONNECT
    ports: [api]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Metrics
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
