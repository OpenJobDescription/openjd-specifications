# Section 9.5 item 2 (RFC 0009): when `maxRestarts` is 0, its default, the
# Service is never relaunched after a failure, so `completedTasks` may be
# omitted. A restartPolicy that gives only `maxRestarts: 0` is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  restartPolicy:
    maxRestarts: 0
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
