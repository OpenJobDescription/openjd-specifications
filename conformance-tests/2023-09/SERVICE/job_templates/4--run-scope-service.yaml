# Section 4 item 4 (RFC 0009): `runScope` names the kinds of Session this
# Environment is entered in. [SERVICE] is a valid, exhaustive list.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  runScope: [SERVICE]
  variables:
    FOO: bar
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
