# Section 4 item 4 constraint 1 / Section 9.9 item 3: no <RunScopeName> may
# appear more than once in `runScope`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  runScope: [TASK, TASK]
  variables:
    FOO: bar
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
