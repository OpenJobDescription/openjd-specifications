# Expression Language 2.2.4: the port argument of join_host_port is an int;
# a string port is a type error.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ join_host_port(Service.Store.main.connectAddress, string(Service.Store.main.port)) }}"]
