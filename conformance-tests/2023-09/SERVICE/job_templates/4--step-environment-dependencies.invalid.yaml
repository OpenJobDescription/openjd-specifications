# Section 4 item 3 constraint 4 / Section 3 item 5 constraint 3 / Section 9.9
# item 14: a Step Environment follows its Step's `dependencies` and must not
# give a `dependencies` list of its own, even one that names a Service the
# Step itself lists.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: Use
  dependencies:
  - service: Store
  stepEnvironments:
  - name: Client
    dependencies:
    - service: Store
    variables:
      STORE_PORT: "{{ Service.Store.main.port }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
