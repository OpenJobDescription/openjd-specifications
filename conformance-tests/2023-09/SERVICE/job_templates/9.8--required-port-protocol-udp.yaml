# Section 9.8.1 item 2 (RFC 0009): a required port may declare `protocol:
# UDP`; the attached Service's port must then be UDP. Its `port` and
# `connectAddress` are used like any other.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
externalServices:
- name: Metrics
  ports:
  - name: ingest
    protocol: UDP
  - name: api
    protocol: TCP
steps:
- name: Use
  dependencies:
  - service: Metrics
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Metrics.ingest.connectAddress }}", "{{ Service.Metrics.ingest.port }}", "{{ Service.Metrics.api.port }}"]
