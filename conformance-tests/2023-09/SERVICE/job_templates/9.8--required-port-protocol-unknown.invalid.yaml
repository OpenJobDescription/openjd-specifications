# Section 9.8.1 item 2 (RFC 0009): `protocol` is `TCP` or `UDP`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
externalServices:
- name: Ext
  ports:
  - name: main
    protocol: SCTP
steps:
- name: Use
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
