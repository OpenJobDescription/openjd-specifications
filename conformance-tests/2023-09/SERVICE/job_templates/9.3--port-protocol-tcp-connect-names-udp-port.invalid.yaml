# Section 9.4 item 2 / Section 9.9 item 4: a TCP_CONNECT check may name only
# TCP ports; `ingest` is UDP and cannot accept a connection.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Metrics
  ports:
  - name: ingest
    protocol: UDP
  - name: api
  healthCheck:
    type: TCP_CONNECT
    ports: [api, ingest]
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Metrics
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
