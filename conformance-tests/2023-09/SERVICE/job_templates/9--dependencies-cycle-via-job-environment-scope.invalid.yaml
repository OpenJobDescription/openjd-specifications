# Section 3.2 constraint 3 / Section 9 item 4 constraint 3 / Section 9.9 item
# 10 (RFC 0009): when a Job Environment lists Service X, every Step is in X's
# scope, so the dependency graph gains an edge from every Step to X. Here the
# Job Environment Client lists Indexer and Indexer depends on Step Prepare:
# Prepare, like every Step, could not run until Indexer was READY, and Indexer
# could not start until Prepare completed. The cycle is Prepare -> Indexer ->
# Prepare, closed through the Job Environment's scope, and the template is
# rejected even though no Step lists Indexer directly.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  dependencies:
  - service: Indexer
  variables:
    INDEX_PORT: "{{ Service.Indexer.main.port }}"
services:
- name: Indexer
  dependencies:
  - dependsOn: Prepare
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Prepare
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Use
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
