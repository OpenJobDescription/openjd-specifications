# Section 4.3 WRAP_ACTIONS constraint 6: the four onWrapService* hooks are
# all-or-nothing within a runScope that includes SERVICE. Omitting
# onWrapServiceHealthCheck must be rejected even though the Service uses
# TCP_CONNECT and the hook would never run.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Wrapper
  runScope: [SERVICE]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
