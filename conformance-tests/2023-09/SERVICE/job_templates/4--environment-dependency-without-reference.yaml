# Section 4 item 3 (RFC 0009): an Environment may list a Service in
# `dependencies` without referencing its endpoint. Client is ON_REQUEST and
# requested by Step1, so Store's Sessions do not enter it, and Step1 is in
# Store's scope through the dependency.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  activation: ON_REQUEST
  dependencies:
  - service: Store
  variables:
    GREETING: hello
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: Step1
  dependencies:
  - environment: Client
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
