# Section 9.5 item 1: `maxRestarts` is an <integer> or <intstring>.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  restartPolicy:
    maxRestarts: "many"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
