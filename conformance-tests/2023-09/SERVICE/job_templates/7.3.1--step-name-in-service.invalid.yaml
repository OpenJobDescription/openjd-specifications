# Section 9 (RFC 0009): a Service belongs to no Step, so `Step.Name` is not
# available within it, even when exactly one Step depends on it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Coordinator
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Step.Name }}"]
steps:
- name: Step1
  dependencies:
  - service: Coordinator
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Coordinator.main.port }}"]
