# Section 4 item 4 constraint 2 (RFC 0009): the default runScope follows the
# Environment's `dependencies`, but an explicit list is honored as written.
# `[TASK, SERVICE]` includes SERVICE, so the Environment must neither depend on
# nor reference a Service; this one does both.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  dependencies:
  - service: Store
  runScope: [TASK, SERVICE]
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
