# Section 9: <Service> has no `serviceEnvironments` property. A Service is
# provisioned by the Environments of its scope (those whose runScope includes
# SERVICE) and by its own onEnter; a Service-scoped Environment list is an
# unknown property and must be rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  serviceEnvironments:
  - name: Provision
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print()"]
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
