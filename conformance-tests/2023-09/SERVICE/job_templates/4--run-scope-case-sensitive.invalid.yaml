# Section 4 item 4 constraint 3: <RunScopeName> is a literal; `task` is not
# the recognized name `TASK`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  runScope: [task]
  variables:
    FOO: bar
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
