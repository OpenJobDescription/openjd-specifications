# Section 9.8 item 2 / Section 9.9 item 1 (RFC 0009): only the ports a
# requirement lists are in scope. `api` is not declared on `Ext`.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
externalServices:
- name: Ext
  ports:
  - name: main
steps:
- name: Use
  dependencies:
  - service: Ext
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Ext.api.port }}"]
