# Section 3.2 item 3 (RFC 0009) / RFC 0010 <StepDependency> constraint 7: the
# valid counterpart of 9--service-must-supply-required-environment-parameter:
# the Service supplies the required parameter of the ALWAYS Environment its
# Session enters, with a value of its own.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Conda
  envParameterDefinitions:
  - name: Packages
    type: STRING
  variables:
    CONDA_PACKAGES: "{{ Env.Param.Packages }}"
services:
- name: Store
  dependencies:
  - environment: Conda
    parameters:
      Packages: valkey
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  - environment: Conda
    parameters:
      Packages: numpy
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
