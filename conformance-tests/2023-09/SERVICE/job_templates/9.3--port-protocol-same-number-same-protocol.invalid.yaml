# Section 9 item 6 constraint 4 / Section 9.9 item 8: two ports with the same
# `protocol` may not have the same `port` number, whether the protocol is
# given or defaulted.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
    port: 6379
  - name: admin
    port: 6379
    protocol: TCP
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
