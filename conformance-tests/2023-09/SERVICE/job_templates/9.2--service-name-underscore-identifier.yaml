specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: _key_store2
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: _key_store2
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service._key_store2.main.port }}"]
