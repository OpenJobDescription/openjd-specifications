# Section 4 item 4: `runScope` is available only when using the SERVICE
# extension. A template that uses it without SERVICE must be rejected, even
# though the value itself would be valid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  runScope: [TASK]
  variables:
    FOO: bar
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
