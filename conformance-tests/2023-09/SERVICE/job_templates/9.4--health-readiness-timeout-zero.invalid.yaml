# Section 9.4 item 4: `readinessTimeoutSeconds` is a <posinteger>; 0 must be rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  - name: admin
  healthCheck:
    type: TCP_CONNECT
    readinessTimeoutSeconds: 0
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
