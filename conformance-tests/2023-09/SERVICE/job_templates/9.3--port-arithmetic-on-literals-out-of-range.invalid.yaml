# 9.2 / 7.4: a port given as arithmetic on literals is resolved at template validation and range-checked there, not deferred to job creation.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  let:
  - big = 70000
  ports:
  - name: main
    port: "{{ 65535 + 1 }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "ok"]
