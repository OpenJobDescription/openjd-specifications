# Section 9.7: `onRun` is the only required action of a Service; a Service
# with only onEnter and onExit must be rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onEnter:
        command: python
        args: ["-c", "print()"]
      onExit:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
