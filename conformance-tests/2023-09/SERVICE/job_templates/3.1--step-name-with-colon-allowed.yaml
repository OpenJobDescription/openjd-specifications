# Section 3.1 / Section 3.2 (RFC 0009): a Step's `name` may contain `:` in a
# template that declares SERVICE, as in the base specification. A dependency on
# a Service is written with the `service` key, so `dependsOn` always names a
# Step and no character of a Step name is reserved. Here `Layer: Beauty` is an
# ordinary Step name that another Step depends on beside Service Store.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: "Layer: Beauty"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Composite
  dependencies:
  - dependsOn: "Layer: Beauty"
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
