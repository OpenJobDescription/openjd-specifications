# Section 9 item 7 / Section 9.9 item 4: a Service none of whose ports is TCP
# must provide a STDOUT or COMMAND health check; the default TCP_CONNECT
# has no port to probe and could never pass.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Telemetry
  ports:
  - name: ingest
    protocol: UDP
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Telemetry
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
