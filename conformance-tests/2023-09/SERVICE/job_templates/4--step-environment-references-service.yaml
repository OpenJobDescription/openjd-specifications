# Section 4 item 4 / Section 9 scope rule 3 (RFC 0009): a Step Environment is
# entered only by the Task Sessions of its Step and gives no runScope, so it
# is never entered in the Service's Session and a reference to the Service is
# valid. The Step lists the Service in `dependencies`, which is what lets its
# Step Environment reference it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Coordinator
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - service: Coordinator
  stepEnvironments:
  - name: Client
    variables:
      COORD_PORT: "{{ Service.Coordinator.main.port }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
