# Section 4 item 4 constraint 3 / Section 9.9 item 3: implementations must
# reject a <RunScopeName> they do not recognize. Only TASK and SERVICE are
# defined.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  runScope: [TASK, BATCH]
  variables:
    FOO: bar
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
