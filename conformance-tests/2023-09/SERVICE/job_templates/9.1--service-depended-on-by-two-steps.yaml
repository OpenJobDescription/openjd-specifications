# Section 9.1 rule 1 (RFC 0009): any Step may depend on a Service, including
# a Step that depends on another Step that depends on it. Both Steps are in
# the Service's scope, and the Service lives from the first to the last of
# them.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Coordinator
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Coordinator
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Coordinator.main.port }}"]
- name: Step2
  dependencies:
  - dependsOn: Step1
  - service: Coordinator
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Coordinator.main.connectAddress }}"]
