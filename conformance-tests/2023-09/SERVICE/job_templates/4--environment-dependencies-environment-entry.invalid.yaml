# Section 4 item 3 constraint 2 (RFC 0009): an Environment's `dependencies`
# holds only `service` entries. An Environment does not request another
# Environment, so an `environment:` entry there is rejected. Client is
# ON_REQUEST and requested by Step1, so Store's Sessions do not enter it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Base
  variables:
    BASE: "1"
- name: Client
  activation: ON_REQUEST
  dependencies:
  - service: Store
  - environment: Base
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - environment: Client
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
