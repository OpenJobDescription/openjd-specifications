# Section 9 item 4 / Section 9.1 rule 2 (RFC 0009): list order carries no
# meaning. Front may depend on, and reference, Back although Back is listed
# after it; the dependency makes Back start before Front.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Front
  dependencies:
  - service: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.port }}"]
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  dependencies:
  - service: Front
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
