# Section 9 (RFC 0009): `Task.Param.*` is not available within a Service,
# even one whose scope is a single Step with a parameter space; the Service
# runs once for every Task of the Step.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Coordinator
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Task.Param.Frame }}"]
steps:
- name: Step1
  dependencies:
  - service: Coordinator
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "1-3"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Coordinator.main.port }}"]
