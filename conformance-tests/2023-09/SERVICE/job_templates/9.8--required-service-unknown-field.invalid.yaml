# Section 9.8 (RFC 0009): a <ServiceRequirement> has only `name` and
# `ports`; the Job Template does not describe how the Service runs.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
externalServices:
- name: Ext
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Use
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
