# Section 9 item 6 constraint 4 / Section 9.9 item 8: the same-number rule
# applies within UDP as within TCP.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Telemetry
  ports:
  - name: ingest
    port: 8125
    protocol: UDP
  - name: trace
    port: 8125
    protocol: UDP
  healthCheck:
    type: STDOUT
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Telemetry
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
