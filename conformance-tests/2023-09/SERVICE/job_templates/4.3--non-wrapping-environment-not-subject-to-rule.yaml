# Section 4.3 WRAP_ACTIONS constraint 6: the hooks-follow-runScope rule
# applies to wrapping Environments only. An ordinary Environment with
# `runScope: [SERVICE]` and no wrap hooks is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Wrapper
  runScope: [SERVICE]
  script:
    actions:
      onEnter:
        command: python
        args: ["-c", "print()"]
      onExit:
        command: python
        args: ["-c", "print()"]
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
