# Section 4.3 WRAP_ACTIONS constraint 6: the hook rule applies to wrapping
# Environments only. An ordinary Environment that only the Service requests
# (`activation: ON_REQUEST`) and that defines no wrap hooks is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Wrapper
  activation: ON_REQUEST
  script:
    actions:
      onEnter:
        command: python
        args: ["-c", "print()"]
      onExit:
        command: python
        args: ["-c", "print()"]
services:
- name: Store
  dependencies:
  - environment: Wrapper
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
