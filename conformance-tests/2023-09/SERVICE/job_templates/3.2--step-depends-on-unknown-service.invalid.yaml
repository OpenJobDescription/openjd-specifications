# Section 3.2 constraint 1 / Section 9.9 item 9 (RFC 0009): a `service` entry
# must name a Service of the Job Template's `services` or `externalServices`.
# `service: Cache` names neither.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
steps:
- name: Use
  dependencies:
  - service: Store
  - service: Cache
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Store.main.port }}"]
