# 9.2 / 7.4: arithmetic on literals that resolves to a valid port passes.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Store
  let:
  - big = 70000
  ports:
  - name: main
    port: "{{ 8000 + 80 }}"
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "ok"]
