# Section 4.3 WRAP_ACTIONS constraint 6 (RFC 0009 rule 1): a wrapping
# Environment that only Service Sessions enter (`activation: ON_REQUEST`,
# requested by the Service and by no Step) needs onWrapEnvEnter,
# onWrapEnvExit, and the four onWrapService* hooks; onWrapTaskRun is not
# required.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Wrapper
  activation: ON_REQUEST
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
services:
- name: Store
  dependencies:
  - environment: Wrapper
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
