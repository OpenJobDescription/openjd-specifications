# Section 1.1 item 8 constraint 4 / Section 3.2 constraint 3 / Section 9.9
# item 10: the dependency graph of a document's Services must be acyclic.
# Front depends on Service Back and Back on Service Front; neither could start
# first. Each also references the other's endpoint, as the dependency permits.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
services:
- name: Front
  dependencies:
  - service: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Back.main.port }}"]
- name: Back
  dependencies:
  - service: Front
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Front.main.port }}"]
steps:
- name: Step1
  dependencies:
  - service: Front
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Front.main.port }}"]
