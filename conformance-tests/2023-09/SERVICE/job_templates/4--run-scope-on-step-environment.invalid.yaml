# Section 4 item 4 constraint 4 / Section 9.9 item 3 (RFC 0009): `runScope`
# is permitted only on a Job Template's `jobEnvironments` entries and on an
# Environment Template's `environment`; a `stepEnvironments` entry must not
# give it. A Step Environment is entered only by the Task Sessions of its
# Step, so there is no kind of Session for it to choose. Even `[TASK]`, the
# only kind that could enter it, is rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
steps:
- name: Step1
  stepEnvironments:
  - name: StepEnv
    runScope: [TASK]
    variables:
      FOO: bar
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
