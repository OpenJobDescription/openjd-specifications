# Section 9.1 rules 3 and 4 (RFC 0009): an `activation: ON_REQUEST` Job
# Environment that lists Service Store and that no Step requests puts no Step
# in Store's scope. Nothing else lists Store, so it is unused and the
# template is rejected, naming it.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  activation: ON_REQUEST
  dependencies:
  - service: Store
  variables:
    STORE_PORT: "{{ Service.Store.main.port }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
