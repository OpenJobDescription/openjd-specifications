# Section 4 scope list item 5 / Section 7.3.1: a Job Environment that lists a
# Service in `dependencies` may reference its `port` and `connectAddress`
# only, never `bindAddress`, which is in scope in the declaring Service alone.
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Client
  dependencies:
  - service: Store
  runScope: [TASK]
  variables:
    STORE_BIND: "{{ Service.Store.main.bindAddress }}"
services:
- name: Store
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
