# Section 4 item 4 constraint 1: `runScope` must have at least one element.
# (Omit the property to get the default of every kind of Session.)
specificationVersion: jobtemplate-2023-09
extensions:
- SERVICE
- EXPR
name: TestJob
jobEnvironments:
- name: Env1
  runScope: []
  variables:
    FOO: bar
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
