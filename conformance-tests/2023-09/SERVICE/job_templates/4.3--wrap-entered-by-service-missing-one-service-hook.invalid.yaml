# Section 4.3 WRAP_ACTIONS constraint 6: the check is over the actions a kind
# of Session may run, not those a template defines. A wrapper that a Service
# Session enters must define all four onWrapService* hooks; omitting
# onWrapServiceHealthCheck must be rejected even though this Service uses
# TCP_CONNECT and the hook would never run.
specificationVersion: jobtemplate-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- ENV_PARAMS
- EXPR
name: TestJob
jobEnvironments:
- name: Wrapper
  activation: ON_REQUEST
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
services:
- name: Store
  dependencies:
  - environment: Wrapper
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
steps:
- name: Step1
  dependencies:
  - service: Store
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
