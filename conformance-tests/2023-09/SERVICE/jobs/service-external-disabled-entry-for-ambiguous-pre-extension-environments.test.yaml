# Section 1.2 item 6 constraint 5 (RFC 0009) / RFC 0010 Template Schemas
# §3.2.1 item 3: an Environment Template Service's disabled entry whose name
# two earlier attachments share is not an error, as for a Step. It refers to
# each of them. Neither attachment lists ENV_PARAMS, so each behaves as ALWAYS
# and the entry has no effect on either: Cache's Session enters both. Nothing
# else names Shared, and Cache declines its own client Environment, so the Job
# is valid.
template:
  specificationVersion: jobtemplate-2023-09
  name: ExternalServiceDisabledEntryForAmbiguousPreExtensionEnvironments
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; [print('TASK_' + v + '=' + os.environ.get(v, 'unset')) for v in ['SHARED_FIRST', 'SHARED_SECOND']]"]

environments:
- specificationVersion: environment-2023-09
  environment:
    name: Shared
    variables:
      SHARED_FIRST: "yes"
- specificationVersion: environment-2023-09
  environment:
    name: Shared
    variables:
      SHARED_SECOND: "yes"
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Cache
    dependencies:
    - environment: CacheClient
      enableIf: false
    # Two earlier attachments define Shared; neither lists ENV_PARAMS, so this
    # entry has no effect on either.
    - environment: Shared
      enableIf: false
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, time; [print('SERVICE_' + v + '=' + os.environ.get(v, 'unset'), flush=True) for v in ['SHARED_FIRST', 'SHARED_SECOND']]; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  environment:
    name: CacheClient
    dependencies:
    - service: Cache
    variables:
      CACHE_PORT: "{{ Service.Cache.main.port }}"

expected:
  output:
  - SERVICE_SHARED_FIRST=yes
  - SERVICE_SHARED_SECOND=yes
  - TASK_SHARED_FIRST=yes
  - TASK_SHARED_SECOND=yes
