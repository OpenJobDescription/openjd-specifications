# Template Schemas §9.5 item 1 (RFC 0009): maxAttempts resolved through a
# parameter must still be 0 or greater; -1 is rejected at job creation.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: MaxAttemptsFromParamNegative
  parameterDefinitions:
  - name: Attempts
    type: INT
    default: 1
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    restartPolicy:
      maxAttempts: "{{ Param.Attempts }}"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]

parameters:
  Attempts: -1
