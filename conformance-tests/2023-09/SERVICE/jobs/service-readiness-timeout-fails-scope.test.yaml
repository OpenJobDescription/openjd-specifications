# RFC 0009 <ServiceHealthCheck> item 4 (readinessTimeoutSeconds "runs continuously,
# including while a probe is in progress. If exceeded, the instance has
# failed"), "Concurrency with onRun" rule 5 (an
# invocation in progress when the Session ends is canceled before onExit),
# "Failure and restart" step 4, and lifecycle constraints 6-7 (Template
# Schemas §9.4, §9.7.1): a COMMAND check whose onHealthCheck never
# finishes inside readinessTimeoutSeconds. With the default maxAttempts of 0 the
# Service becomes FAILED and fails the Job before any Task runs; the
# in-flight check is canceled (CHECK_FINISHED never prints) and onExit still
# runs because an action of the Service ran.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ReadyTimeoutFailsScope
  services:
  - name: Slow
    ports:
    - name: main
    healthCheck:
      type: COMMAND
      readinessIntervalSeconds: 1
      readinessTimeoutSeconds: 2
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('SLOW_NEVER_READY', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onHealthCheck:
          command: python
          args: ["-c", "import time; print('CHECK_STARTED', flush=True); time.sleep(60); print('CHECK_FINISHED', flush=True)"]
          timeout: 120
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('SLOW_EXIT_RAN')"]
  steps:
  - name: Never
    dependencies:
    - service: Slow
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]

expected:
  taskFailure: {}
  output:
  - SLOW_NEVER_READY
  - CHECK_STARTED
  - SLOW_EXIT_RAN
  forbidden:
  - CHECK_FINISHED
  - TASK_MUST_NOT_RUN
