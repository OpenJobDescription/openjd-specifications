# Section 1.2 item 6 constraint 5 (RFC 0009) / RFC 0010 "Resolving external
# Environments": an Environment Template Service's disabled `environment:`
# entry resolves only among the Environments of its own document and of
# earlier attachments, whatever their activation. As for a Step,
# a disabled entry whose name matches none of them has no effect, whatever
# `required` says. Cache names the Job Template's Job Environment JobEnv, the
# later attachment's ALWAYS Environment Later, and an Environment no document
# defines. None is an error, not even declining an ALWAYS Environment, since
# Later is not among the ones Cache chooses from. Cache's Session enters
# Earlier and none of the others, and the Task's Session enters all four.
template:
  specificationVersion: jobtemplate-2023-09
  name: ExternalServiceDisabledEntryMatchingNothingIgnored
  jobEnvironments:
  - name: JobEnv
    variables:
      SEEN_JOB_ENV: "yes"
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; [print('TASK_' + v + '=' + os.environ.get(v, 'unset')) for v in ['SEEN_EARLIER', 'SEEN_CACHE_CLIENT', 'SEEN_LATER', 'SEEN_JOB_ENV']]"]

environments:
- specificationVersion: environment-2023-09
  environment:
    name: Earlier
    variables:
      SEEN_EARLIER: "yes"
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Cache
    dependencies:
    - environment: CacheClient
      enableIf: false
    # The Job Template's Environment: not one Cache chooses from.
    - environment: JobEnv
      enableIf: false
    # A later attachment's ALWAYS Environment: not one Cache chooses from.
    - environment: Later
      enableIf: false
    # No document defines this name. `required: true` changes nothing for a
    # disabled entry.
    - environment: NoSuchEnvironment
      required: true
      enableIf: false
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, time; [print('SERVICE_' + v + '=' + os.environ.get(v, 'unset'), flush=True) for v in ['SEEN_EARLIER', 'SEEN_CACHE_CLIENT', 'SEEN_LATER', 'SEEN_JOB_ENV']]; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  environment:
    name: CacheClient
    dependencies:
    - service: Cache
    variables:
      SEEN_CACHE_CLIENT: "yes"
      CACHE_PORT: "{{ Service.Cache.main.port }}"
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Later
    activation: ALWAYS
    variables:
      SEEN_LATER: "yes"

expected:
  output:
  - SERVICE_SEEN_EARLIER=yes
  - SERVICE_SEEN_CACHE_CLIENT=unset
  - SERVICE_SEEN_LATER=unset
  - SERVICE_SEEN_JOB_ENV=unset
  - TASK_SEEN_EARLIER=yes
  - TASK_SEEN_CACHE_CLIENT=yes
  - TASK_SEEN_LATER=yes
  - TASK_SEEN_JOB_ENV=yes
