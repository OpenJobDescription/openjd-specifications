# RFC 0009 <ServiceHealthCheck> (Template Schemas §9.4) after READY, lifecycle
# constraint 11, and "Failure and restart": a COMMAND probe that passes until
# Task 1 writes a marker, then fails. With healthIntervalSeconds: 1 and
# failureThreshold: 2, two consecutive failed probes make instance 1 UNHEALTHY,
# an instance failure: onRun is canceled and, with maxAttempts: 1 and KEEP, a
# second instance is launched. Instance 2 clears the marker, passes a probe,
# and serves the remaining Tasks. Task 1 (running under KEEP) completes against
# instance 1 and keeps its result. Whether the relaunch reuses the Service
# Session is the scheduler's choice and is not asserted.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: HealthCommandFailsAfterReadyRelaunches
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: COMMAND
      readinessIntervalSeconds: 1
      readinessTimeoutSeconds: 60
      healthIntervalSeconds: 1
      failureThreshold: 2
    restartPolicy:
      maxAttempts: 1
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Store.main.bindAddress }}", "{{ Service.Store.main.port }}", "{{ Job.Name }}"]
          cancelation:
            mode: TERMINATE
        onHealthCheck:
          command: python
          args: ["{{ Service.File.Check }}", "{{ Service.Store.main.connectAddress }}", "{{ Service.Store.main.port }}", "{{ Job.Name }}"]
          timeout: 10
        onExit:
          command: python
          args: ["-c", "import os, sys, tempfile\nfor suffix in ('.marker', '.sick'):\n    m = os.path.join(tempfile.gettempdir(), 'openjd-' + sys.argv[1] + suffix)\n    os.path.exists(m) and os.remove(m)", "{{ Job.Name }}"]
      embeddedFiles:
      - name: Check
        type: TEXT
        data: |
          import os, socket, sys, tempfile
          host, port, job = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          # Before READY a refused connection is "not yet ready"; after READY it
          # would be a failed probe. Neither happens here: the listener is up
          # for the whole life of each instance, and the failures come from the
          # marker Task 1 writes.
          socket.create_connection((host, port), timeout=1).close()
          sick = os.path.join(tempfile.gettempdir(), "openjd-" + job + ".sick")
          if os.path.exists(sick):
              print("CHECK_UNHEALTHY", flush=True)
              sys.exit(1)
          print("CHECK_OK", flush=True)
      - name: Serve
        type: TEXT
        data: |
          import os, socket, sys, tempfile
          host, port, job = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          # The instance marker tells the instances apart (a stale one from an
          # aborted run makes instance 1 report itself as 2, which the TASK 1
          # GOT INSTANCE 1 assertion catches). Every instance clears the sick
          # marker on start, so the relaunched instance passes its probe.
          marker = os.path.join(tempfile.gettempdir(), "openjd-" + job + ".marker")
          sick = os.path.join(tempfile.gettempdir(), "openjd-" + job + ".sick")
          instance = 2 if os.path.exists(marker) else 1
          open(marker, "a").close()
          os.path.exists(sick) and os.remove(sick)
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          print("INSTANCE", instance, "LISTENING", flush=True)
          while True:
              c, _ = s.accept()
              # The onHealthCheck probe connects and closes without sending;
              # recv may return b"" or raise on an abortive close.
              try:
                  data = c.recv(64)
              except OSError:
                  data = b""
              if data:
                  c.sendall(str(instance).encode())
              c.close()
  steps:
  - name: Work
    dependencies:
    - service: Store
    parameterSpace:
      taskParameterDefinitions:
      - name: N
        type: INT
        range: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Service.Store.main.connectAddress }}", "{{ Service.Store.main.port }}", "{{ Task.Param.N }}", "{{ Job.Name }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Run
        type: TEXT
        data: |
          import os, socket, sys, tempfile, time
          host, port, n, job = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
          c = socket.create_connection((host, port), timeout=10)
          c.sendall(("task " + n).encode())
          instance = c.recv(64).decode()
          c.close()
          print("TASK", n, "GOT INSTANCE", instance, flush=True)
          if n == "1":
              # Make the probe start failing, then stay running long enough for
              # two failed probes (two 1-second intervals plus probe time) so the
              # instance is UNHEALTHY before Task 2 could be scheduled.
              open(os.path.join(tempfile.gettempdir(), "openjd-" + job + ".sick"), "a").close()
              time.sleep(5)
          print("TASK", n, "INSTANCE", instance, "DONE", flush=True)

expected:
  output:
  - INSTANCE 1 LISTENING
  - TASK 1 GOT INSTANCE 1
  - CHECK_UNHEALTHY
  - TASK 1 INSTANCE 1 DONE
  - INSTANCE 2 LISTENING
  - TASK 2 INSTANCE 2 DONE
  - TASK 3 INSTANCE 2 DONE
  forbidden:
  - TASK 1 GOT INSTANCE 2
  - TASK 2 GOT INSTANCE 1
  - TASK 3 GOT INSTANCE 1
