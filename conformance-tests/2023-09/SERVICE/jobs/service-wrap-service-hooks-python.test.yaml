# Cross-platform (python) variant of service-wrap-service-scoped-hooks: the
# wrap hooks re-launch the wrapped command with python's subprocess module,
# forwarding stdout, so the wrapped onRun's `openjd_service_ready` is
# recognized through the wrap script. WrappedService.* reaches each hook.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: WrapServiceHooksPython
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('SERVICE_ENTER_ORIGINAL')"]
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: wrapped up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('SERVICE_EXIT_ORIGINAL')"]
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN', {{ Service.Store.main.port }} > 0)"]

environments:
- specificationVersion: environment-2023-09
  extensions: [WRAP_ACTIONS, SERVICE, EXPR]
  environment:
    name: ServiceWrapper
    runScope: [SERVICE]
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["{{ Env.File.Launch }}", "WRAP_ENV_ENTER", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapEnvExit:
          command: python
          args: ["{{ Env.File.Launch }}", "WRAP_ENV_EXIT", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapServiceEnter:
          command: python
          args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_ENTER={{ WrappedService.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapServiceRun:
          command: python
          args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_RUN={{ WrappedService.Name }} ports={{ repr_py(WrappedService.PortNames) }} count={{ len(WrappedService.Ports) }} protocols={{ repr_py(WrappedService.Protocols) }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapServiceHealthCheck:
          command: python
          args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_CHECK", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapServiceExit:
          command: python
          args: ["{{ Env.File.Launch }}", "WRAP_SERVICE_EXIT={{ WrappedService.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
      embeddedFiles:
      - name: Launch
        type: TEXT
        data: |
          import ast, subprocess, sys
          marker, command, args = sys.argv[1], sys.argv[2], ast.literal_eval(sys.argv[3])
          print(marker, flush=True)
          sys.exit(subprocess.call([command, *args]))

expected:
  output:
  - WRAP_SERVICE_ENTER=Store
  - SERVICE_ENTER_ORIGINAL
  - "WRAP_SERVICE_RUN=Store ports=['main'] count=1 protocols=['TCP']"
  - TASK_RAN True
  - WRAP_SERVICE_EXIT=Store
  - SERVICE_EXIT_ORIGINAL
  forbidden:
  - WRAP_ENV_ENTER
  - WRAP_ENV_EXIT
  - WRAP_SERVICE_CHECK
