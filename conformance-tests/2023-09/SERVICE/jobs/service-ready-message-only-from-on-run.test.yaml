# How Jobs Are Run "Stdout/Stderr messages": `openjd_service_ready` is
# interpreted only when emitted by onRun. The Service's onEnter emits it
# first, which must not make the Service READY; onRun emits it after a
# delay, and only then does the Task run. A second emission has no effect.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: ReadyOnlyFromOnRun
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 60
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('openjd_service_ready: from on enter (ignored)')"]
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Store.main.bindAddress }}", "{{ Service.Store.main.port }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Serve
        type: TEXT
        data: |
          import socket, sys, time
          host, port = sys.argv[1], int(sys.argv[2])
          time.sleep(1.0)
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          print("openjd_service_ready: from on run", flush=True)
          print("openjd_service_ready: again (no effect)", flush=True)
          while True:
              c, _ = s.accept()
              c.sendall(b"served")
              c.close()
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); print('TASK_GOT', c.recv(64).decode(), flush=True)", "{{ Service.Store.main.connectAddress }}", "{{ Service.Store.main.port }}"]

expected:
  output:
  - TASK_GOT served
