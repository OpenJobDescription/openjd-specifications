# Section 1.2 item 6 constraint 5 (RFC 0009) / RFC 0010 Template Schemas
# §3.2.1 item 3: an Environment Template Service's disabled entry whose name
# two earlier attachments share refers to each of them, as for a Step, and is
# an error for each one with `activation: ALWAYS`. The first attachment's
# Shared is ALWAYS and the second's is BY_DEFAULT, so the entry declines the
# second and is an error for the first. Both list ENV_PARAMS, nothing else
# names Shared, and Cache declines its own client Environment, so declining
# the ALWAYS one is the only error.
template:
  specificationVersion: jobtemplate-2023-09
  name: ExternalServiceDeclinesAmbiguousEarlierAlwaysEnvironment
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]

environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Shared
    activation: ALWAYS
    variables:
      SHARED_FIRST: "yes"
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Shared
    activation: BY_DEFAULT
    variables:
      SHARED_SECOND: "yes"
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Cache
    dependencies:
    - environment: CacheClient
      enableIf: false
    # Two earlier attachments define Shared, and the first is ALWAYS, which
    # cannot be declined.
    - environment: Shared
      enableIf: false
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  environment:
    name: CacheClient
    dependencies:
    - service: Cache
    variables:
      CACHE_PORT: "{{ Service.Cache.main.port }}"
