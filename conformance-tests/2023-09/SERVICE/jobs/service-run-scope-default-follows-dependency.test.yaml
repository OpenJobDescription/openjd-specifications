# Template Schemas §4 item 4 / How Jobs Are Run § Services: an Environment
# that lists a Service in `dependencies` and gives no runScope is entered in
# Task Sessions only, exactly as if `runScope: [TASK]` were given, while an
# Environment that lists nothing and gives no runScope is entered in every
# Session, including the Service's. Each Environment's onEnter prints which
# Session it is in; the Service's onRun and the Task report which variables
# they see.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: RunScopeDefaultFollowsDependency
  jobEnvironments:
  - name: Everywhere
    variables:
      SEEN_EVERYWHERE: "yes"
  - name: ClientByDefault
    dependencies:
    - service: Store
    variables:
      STORE_PORT: "{{ Service.Store.main.port }}"
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "import os; print('CLIENT_ENTER_SEES_STORE_PORT', os.environ['STORE_PORT'].isdigit())"]
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os,time; print('SERVICE_SEEN_EVERYWHERE=' + os.environ.get('SEEN_EVERYWHERE', 'unset')); print('SERVICE_STORE_PORT=' + os.environ.get('STORE_PORT', 'unset')); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_SEEN_EVERYWHERE=' + os.environ.get('SEEN_EVERYWHERE', 'unset')); print('TASK_STORE_PORT_MATCHES', os.environ.get('STORE_PORT') == '{{ Service.Store.main.port }}')"]

expected:
  output:
  - CLIENT_ENTER_SEES_STORE_PORT True
  - SERVICE_SEEN_EVERYWHERE=yes
  - SERVICE_STORE_PORT=unset
  - TASK_SEEN_EVERYWHERE=yes
  - TASK_STORE_PORT_MATCHES True
