# RFC 0009 "Failure and restart" (a start failure -- here the onEnter of a
# SERVICE-scoped Job Environment exiting non-zero -- consumes a relaunch
# attempt, and "After a start failure ... it MUST begin a new Service
# Session"), lifecycle constraint 9 (a new Session means a new working
# directory, Environments re-entered, onEnter re-run), and Design Choice
# Rationale "Start failures consume a restart attempt" (Template Schemas
# §9.5, §4 item 4). The Environment has `runScope: [SERVICE]` so no Task
# Session enters it. With maxAttempts: 1 its onEnter fails on the first
# Service Session and succeeds on the second, which runs in a different
# working directory; the Service then comes up and the Task runs.
#
# The two Sessions are told apart by a marker file in the host's temp
# directory keyed by Job.Name (nothing in the first Session survives into the
# second, by design). The first entry records its working directory in the
# marker and the second compares against it, deletes the marker, and
# continues. A stale marker from an aborted run makes the first entry take the
# second-entry branch, so PROVISION_FAILING_ONCE never prints and the fixture
# fails loudly; the Service's onExit deletes the marker as well. Ports are not
# compared: a new Session allocates new ports, but nothing forbids the same
# number being chosen again.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: StartFailureRelaunchesInNewSession
  jobEnvironments:
  - name: Provision
    runScope: [SERVICE]
    script:
      actions:
        onEnter:
          command: python
          args: ["{{ Env.File.Provision }}", "{{ Job.Name }}"]
      embeddedFiles:
      - name: Provision
        type: TEXT
        data: |
          import os, sys, tempfile
          marker = os.path.join(tempfile.gettempdir(), "openjd-" + sys.argv[1] + ".marker")
          if not os.path.exists(marker):
              with open(marker, "w") as f:
                  f.write(os.getcwd())
              print("PROVISION_FAILING_ONCE", flush=True)
              sys.exit(3)
          with open(marker) as f:
              first_cwd = f.read()
          os.remove(marker)
          print("PROVISION_NEW_WORKDIR", os.getcwd() != first_cwd, flush=True)
          print("PROVISION_OK", flush=True)
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 60
    restartPolicy:
      maxAttempts: 1
      completedTasks: KEEP
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('SVC_ENTER')"]
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "import os, sys, tempfile; print('SVC_EXIT'); m = os.path.join(tempfile.gettempdir(), 'openjd-' + sys.argv[1] + '.marker'); os.path.exists(m) and os.remove(m)", "{{ Job.Name }}"]
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN', {{ Service.Store.main.port }} > 0)"]

expected:
  output:
  - PROVISION_FAILING_ONCE
  - PROVISION_NEW_WORKDIR True
  - PROVISION_OK
  - SVC_ENTER
  - TASK_RAN True
  - SVC_EXIT
