# RFC 0009 "Services run inside Environments" / Template Schemas §4.3
# constraint 6: in a Service Session, a SERVICE-scoped wrapping Environment
# wraps the inner Environments the Session enters with onWrapEnvEnter and
# onWrapEnvExit, as in any Session, while the Task Session (which the
# wrapper does not enter) runs the inner Environment's actions unwrapped.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: WrapInnerEnvironmentInServiceSession
  jobEnvironments:
  - name: Tooling
    script:
      actions:
        onEnter:
          command: echo
          args: ["TOOLING_ENTER"]
        onExit:
          command: echo
          args: ["TOOLING_EXIT"]
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: echo
          args: ["TASK_RAN", "{{ Service.Store.main.port }}"]

environments:
- specificationVersion: environment-2023-09
  extensions: [WRAP_ACTIONS, SERVICE, EXPR]
  environment:
    name: ServiceWrapper
    runScope: [SERVICE]
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args: ["-c", "echo WRAP_ENV_ENTER={{ WrappedEnv.Name }}; exec {{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"]
        onWrapEnvExit:
          command: bash
          args: ["-c", "echo WRAP_ENV_EXIT={{ WrappedEnv.Name }}; exec {{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"]
        onWrapServiceEnter:
          command: bash
          args: ["-c", "exec {{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"]
        onWrapServiceRun:
          command: bash
          args: ["-c", "echo WRAP_SERVICE_RUN={{ WrappedService.Name }}; exec {{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"]
        onWrapServiceHealthCheck:
          command: bash
          args: ["-c", "exec {{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"]
        onWrapServiceExit:
          command: bash
          args: ["-c", "exec {{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"]

runOn:
- posix

expected:
  output:
  - WRAP_ENV_ENTER=Tooling
  - WRAP_SERVICE_RUN=Store
  - WRAP_ENV_EXIT=Tooling
  - TOOLING_ENTER
  - TOOLING_EXIT
  - TASK_RAN
