# Template Schemas §4 item 3 / How Jobs Are Run § Services: a Service declines
# its BY_DEFAULT client Environment, which lists it, with a disabled
# `environment:` entry, as a Step declines one. The client Environment is then
# entered in Task Sessions but not in the Service's Session, while an
# Environment that lists nothing is entered in every Session, including the
# Service's. The client Environment's onEnter reports what it sees; the
# Service's onRun and the Task report which variables they see. Without the
# entry the template is a cycle (job_templates/
# 4--service-enters-by-default-environment-that-lists-it.invalid).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  name: ClientEnvironmentNotEnteredByItsService
  jobEnvironments:
  - name: Everywhere
    variables:
      SEEN_EVERYWHERE: "yes"
  - name: ClientByDefault
    dependencies:
    - service: Store
    variables:
      STORE_PORT: "{{ Service.Store.main.port }}"
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "import os; print('CLIENT_ENTER_SEES_STORE_PORT', os.environ['STORE_PORT'].isdigit())"]
  services:
  - name: Store
    dependencies:
    - environment: ClientByDefault
      enableIf: false
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os,time; print('SERVICE_SEEN_EVERYWHERE=' + os.environ.get('SEEN_EVERYWHERE', 'unset')); print('SERVICE_STORE_PORT=' + os.environ.get('STORE_PORT', 'unset')); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_SEEN_EVERYWHERE=' + os.environ.get('SEEN_EVERYWHERE', 'unset')); print('TASK_STORE_PORT_MATCHES', os.environ.get('STORE_PORT') == '{{ Service.Store.main.port }}')"]

expected:
  output:
  - CLIENT_ENTER_SEES_STORE_PORT True
  - SERVICE_SEEN_EVERYWHERE=yes
  - SERVICE_STORE_PORT=unset
  - TASK_SEEN_EVERYWHERE=yes
  - TASK_STORE_PORT_MATCHES True
