# Template Schemas §1.1 item 9, §1.2.2 item 2, §9.8: a Job Template requires
# `Ext` with port `main`, and a single attached Environment Template provides
# it. The requirement is matched at submission, and Service.Ext.main.port and
# .connectAddress resolve in the Task to the attached Service's endpoint.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  name: RequiredSatisfied
  externalServices:
  - name: Ext
    ports:
    - name: main
  steps:
  - name: Use
    dependencies:
    - service: Ext
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); print('TASK_GOT', c.recv(64).decode(), 'PORT_IS_INT', isinstance({{ Service.Ext.main.port }}, int), flush=True)", "{{ Service.Ext.main.connectAddress }}", "{{ Service.Ext.main.port }}"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Ext
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Ext.main.bindAddress }}", "{{ Service.Ext.main.port }}", "EXT_PAYLOAD"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Serve
        type: TEXT
        data: |
          import socket, sys
          host, port, tag = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          print("openjd_service_ready:", tag, flush=True)
          while True:
              c, _ = s.accept()
              c.sendall(tag.encode())
              c.close()

expected:
  output:
  - TASK_GOT EXT_PAYLOAD PORT_IS_INT True
