# Template Schemas §1.2.2 items 2 and 3: two attached Environment Templates
# each define a Service named `Ext`, and the Job Template requires `Ext`. Two
# providers for one requirement is an error (it would not be if nothing
# required the name; see service-external-same-name-in-two-attachments).
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  name: RequiredUnsatisfied
  externalServices:
  - name: Ext
    ports:
    - name: main
  steps:
  - name: Use
    dependencies:
    - service: Ext
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN', {{ Service.Ext.main.port }})"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Ext
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Ext.main.bindAddress }}", "{{ Service.Ext.main.port }}", "EXT_PAYLOAD"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Serve
        type: TEXT
        data: |
          import socket, sys
          host, port, tag = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          print("openjd_service_ready:", tag, flush=True)
          while True:
              c, _ = s.accept()
              c.sendall(tag.encode())
              c.close()
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Ext
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Ext.main.bindAddress }}", "{{ Service.Ext.main.port }}", "OTHER_PAYLOAD"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Serve
        type: TEXT
        data: |
          import socket, sys
          host, port, tag = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind((host, port))
          s.listen(16)
          print("openjd_service_ready:", tag, flush=True)
          while True:
              c, _ = s.accept()
              c.sendall(tag.encode())
              c.close()
