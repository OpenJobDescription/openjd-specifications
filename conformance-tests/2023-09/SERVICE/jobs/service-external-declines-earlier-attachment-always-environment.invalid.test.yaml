# Section 1.2 item 6 constraint 5 (RFC 0009) / RFC 0010 §4 item 4: an
# Environment Template's Service may decline an earlier attachment's
# Environment only when it is not `activation: ALWAYS`. Cache declines the
# first attachment's ALWAYS Environment Earlier, which is an error, as it is
# for a Step. Earlier has no parameters and lists no Service, and Cache
# declines its own client Environment, so the decline is the only error.
template:
  specificationVersion: jobtemplate-2023-09
  name: ExternalServiceDeclinesEarlierAlwaysEnvironment
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]

environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Earlier
    activation: ALWAYS
    variables:
      SEEN_EARLIER: "yes"
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Cache
    dependencies:
    - environment: CacheClient
      enableIf: false
    # An ALWAYS Environment cannot be declined.
    - environment: Earlier
      enableIf: false
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  environment:
    name: CacheClient
    dependencies:
    - service: Cache
    variables:
      CACHE_PORT: "{{ Service.Cache.main.port }}"
