# RFC 0009 <Service> item 5 / RFC 0010 §3.3.3: a Service's combined host
# requirements are its own hostRequirements together with those of the
# Environments its Sessions enter. The ALWAYS Environment requires linux and
# the Service requires windows; no host satisfies both, so the submission is
# rejected, naming the Service.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  name: ServiceCombinedHostRequirementsConflict
  jobEnvironments:
  - name: LinuxTools
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [linux]
    variables:
      TOOLS: "1"
  services:
  - name: Store
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        anyOf: [windows]
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]
