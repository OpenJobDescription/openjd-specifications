# RFC 0009 "Services run inside Environments" / Template Schemas §4 item 4: a
# Service Session enters the Job Environments whose runScope includes
# SERVICE. The default-runScope Environment is entered for both the
# Service and the Task; the TASK-scoped one only for the Task (it lists the
# Service in `dependencies` and reads its endpoint); the SERVICE-scoped one
# only for the Service. An Environment's `variables` reach the Service's
# actions, with the Service's own `variables` taking precedence.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: EnvironmentsFollowRunScope
  jobEnvironments:
  - name: Everywhere
    variables:
      SEEN_EVERYWHERE: "yes"
      OVERRIDDEN: by-environment
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('EVERYWHERE_ENTER')"]
  - name: TaskOnly
    dependencies:
    - service: Store
    runScope: [TASK]
    variables:
      SEEN_TASK_ONLY: "yes"
      STORE_PORT: "{{ Service.Store.main.port }}"
  - name: ServiceOnly
    runScope: [SERVICE]
    variables:
      SEEN_SERVICE_ONLY: "yes"
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    variables:
      OVERRIDDEN: by-service
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Report }}", "SERVICE"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
      - name: Report
        type: TEXT
        data: |
          import os, sys, time
          who = sys.argv[1]
          for var in ["SEEN_EVERYWHERE", "SEEN_TASK_ONLY", "SEEN_SERVICE_ONLY", "OVERRIDDEN"]:
              print(who + "_" + var + "=" + os.environ.get(var, "unset"), flush=True)
          print("openjd_service_ready: reported", flush=True)
          time.sleep(600)
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; [print('TASK_' + v + '=' + os.environ.get(v, 'unset')) for v in ['SEEN_EVERYWHERE', 'SEEN_TASK_ONLY', 'SEEN_SERVICE_ONLY', 'OVERRIDDEN']]; print('TASK_STORE_PORT_MATCHES', os.environ['STORE_PORT'] == '{{ Service.Store.main.port }}')"]

expected:
  output:
  - EVERYWHERE_ENTER
  - SERVICE_SEEN_EVERYWHERE=yes
  - SERVICE_SEEN_TASK_ONLY=unset
  - SERVICE_SEEN_SERVICE_ONLY=yes
  - SERVICE_OVERRIDDEN=by-service
  - TASK_SEEN_EVERYWHERE=yes
  - TASK_SEEN_TASK_ONLY=yes
  - TASK_SEEN_SERVICE_ONLY=unset
  - TASK_OVERRIDDEN=by-environment
  - TASK_STORE_PORT_MATCHES True
