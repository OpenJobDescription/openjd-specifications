# Template Schemas §1.2 / §1.2.2: an Environment Template with `services` and
# no `environment` is valid, and supplies an external Service to the combined
# Job. Nothing in this Job lists the Service -- the Job Template neither
# declares SERVICE nor names it, and the attachment has no Environment -- so
# its scope is empty and it is never started (§9.1): the submission is
# accepted, the Task runs, and no action of the Service runs.
template:
  specificationVersion: jobtemplate-2023-09
  name: ServicesOnlyAttachment
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN')"]

environments:
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Telemetry
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('TELEMETRY_RUNNING', flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('TELEMETRY_EXIT')"]

expected:
  output:
  - TASK_RAN
  forbidden:
  - TELEMETRY_RUNNING
  - TELEMETRY_EXIT
