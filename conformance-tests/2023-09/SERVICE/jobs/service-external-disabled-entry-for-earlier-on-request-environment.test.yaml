# Section 1.2 item 6 constraint 5 (RFC 0009) / RFC 0010 §3.2 item 3: an
# Environment Template Service's disabled entry resolves among its own
# document's and earlier attachments' Environments whatever their
# activation, and RFC 0010 gives it its effect. For the first attachment's
# ON_REQUEST Environment Tools, the entry has no effect: Cache does not
# request Tools, as if the entry were absent, and it is not an error. The
# Step requests Tools and enters it; Cache's Session does not.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [ENV_PARAMS, EXPR]
  name: ExternalServiceDisabledEntryForEarlierOnRequestEnvironment
  steps:
  - name: Use
    dependencies:
    - environment: Tools
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_SEEN_TOOLS=' + os.environ.get('SEEN_TOOLS', 'unset'))"]

environments:
- specificationVersion: environment-2023-09
  extensions: [ENV_PARAMS, EXPR]
  environment:
    name: Tools
    activation: ON_REQUEST
    variables:
      SEEN_TOOLS: "yes"
- specificationVersion: environment-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  services:
  - name: Cache
    dependencies:
    - environment: CacheClient
      enableIf: false
    - environment: Tools
      enableIf: false
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, time; print('SERVICE_SEEN_TOOLS=' + os.environ.get('SEEN_TOOLS', 'unset'), flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  environment:
    name: CacheClient
    dependencies:
    - service: Cache
    variables:
      CACHE_PORT: "{{ Service.Cache.main.port }}"

expected:
  output:
  - SERVICE_SEEN_TOOLS=unset
  - TASK_SEEN_TOOLS=yes
