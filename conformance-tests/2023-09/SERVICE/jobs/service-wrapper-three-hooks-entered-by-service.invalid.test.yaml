# Template Schemas §1.2.2 item 4 (submission-time check): the attached queue
# wrapper declares SERVICE and ENV_PARAMS but defines only RFC 0008's three
# hooks, with the default `activation: ALWAYS`. It is valid on its own
# (env_templates/4.3--wrap-three-hooks-with-service-extension), but in this
# Job the Service's Session enters it, and the wrapper cannot wrap the
# Service's actions, so the submission must be rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, ENV_PARAMS, EXPR]
  name: WrapperThreeHooksEnteredByService
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]
environments:
- specificationVersion: environment-2023-09
  extensions: [WRAP_ACTIONS, SERVICE, ENV_PARAMS, EXPR]
  environment:
    name: QueueWrapper
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["{{ Env.File.Launch }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapTaskRun:
          command: python
          args: ["{{ Env.File.Launch }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
        onWrapEnvExit:
          command: python
          args: ["{{ Env.File.Launch }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
      embeddedFiles:
      - name: Launch
        type: TEXT
        data: |
          import ast, subprocess, sys
          sys.exit(subprocess.call([sys.argv[1], *ast.literal_eval(sys.argv[2])]))
