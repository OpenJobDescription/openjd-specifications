# Template Schemas §1.1 item 8: `services` without the SERVICE extension
# must be rejected before the Job is created; the run must fail.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [EXPR]
  name: ServiceWithoutExtension
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print(\"openjd_service_ready: up\", flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print(\"TASK_RAN\", {{ Service.Store.main.port }} > 0)"]
