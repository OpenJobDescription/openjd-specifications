# RFC 0009 "Service lifecycle" constraints 6-7: a Service Session ends when
# its scope completes, including because the scope failed. A Task failure
# fails the Job (the local runner has no Task retry) and the Service's
# Session is still ended normally: onRun is canceled and onExit runs.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: OnExitAfterTaskFailure
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('STORE_EXIT_RAN')"]
  steps:
  - name: Failing
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_FAILING', {{ Service.Store.main.port }} > 0); raise SystemExit(7)"]

expected:
  taskFailure:
    exitCode: 7
  output:
  - TASK_FAILING True
  - STORE_EXIT_RAN
