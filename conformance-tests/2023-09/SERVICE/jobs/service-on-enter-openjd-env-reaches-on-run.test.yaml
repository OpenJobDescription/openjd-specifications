# Template Schemas §9.7 "Environment variables within a Service": a variable
# set with openjd_env by the Service's onEnter is set in the process
# environment of every subsequent action of the Service Session -- onRun and
# onExit here -- and takes precedence over the Service's declarative
# `variables`. Nothing set within a Service is propagated to the entities in
# its scope, so the Task does not see it.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR]
  name: OnEnterOpenjdEnv
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    variables:
      STORE_TOKEN: from-variables
      STORE_MODE: declarative
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('openjd_env: STORE_TOKEN=from-on-enter'); print('openjd_env: STORE_SECRET=s3cret')"]
        onRun:
          command: python
          args: ["-c", "import os,time; print('RUN_TOKEN=' + os.environ.get('STORE_TOKEN', 'unset')); print('RUN_SECRET=' + os.environ.get('STORE_SECRET', 'unset')); print('RUN_MODE=' + os.environ.get('STORE_MODE', 'unset')); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "import os; print('EXIT_TOKEN=' + os.environ.get('STORE_TOKEN', 'unset'))"]
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_TOKEN=' + os.environ.get('STORE_TOKEN', 'unset')); print('TASK_MODE=' + os.environ.get('STORE_MODE', 'unset')); print('TASK_PORT_SEEN', {{ Service.Store.main.port }} > 0)"]

expected:
  output:
  - RUN_TOKEN=from-on-enter
  - RUN_SECRET=s3cret
  - RUN_MODE=declarative
  - EXIT_TOKEN=from-on-enter
  - TASK_TOKEN=unset
  - TASK_MODE=unset
  - TASK_PORT_SEEN True
