# RFC 0009 <ServiceActions> "Environment variables within a Service"
# (Template Schemas §9.7): the stdout of a Service's onEnter is watched for
# openjd_redacted_env with the same rules as an Environment's onEnter --
# "openjd_redacted_env sets the variable only when the document declares the
# REDACTED_ENV_VARS extension, while its value is redacted from the log
# regardless". With the extension declared, the variable is set in every
# subsequent action of the Service Session (onRun, onExit), its value is
# masked in the log, and nothing set within a Service reaches the Task.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE, EXPR, REDACTED_ENV_VARS]
  name: OnEnterRedactedEnvWithExtension
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('openjd_redacted_env: STORE_SECRET=s3cret-value-xyz')"]
        onRun:
          command: python
          args: ["-c", "import os,time; v = os.environ.get('STORE_SECRET'); print('RUN_SECRET_SET', v is not None); print('RUN_SECRET_LEN=' + str(len(v or ''))); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "import os; print('EXIT_SECRET_SET', 'STORE_SECRET' in os.environ)"]
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_SECRET_SET', 'STORE_SECRET' in os.environ); print('TASK_PORT_SEEN', {{ Service.Store.main.port }} > 0)"]

expected:
  output:
  - RUN_SECRET_SET True
  - RUN_SECRET_LEN=16
  - EXIT_SECRET_SET True
  - TASK_SECRET_SET False
  - TASK_PORT_SEEN True
  - 'openjd_redacted_env: STORE_SECRET=********'
  forbidden:
  - s3cret-value-xyz
