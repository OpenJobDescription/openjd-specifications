# Template Schemas §9 / §9.9 item 7: SERVICE requires EXPR; a template that
# lists SERVICE alone must be rejected.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [SERVICE]
  name: ServiceWithoutExpr
  services:
  - name: Store
    ports:
    - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print(\"openjd_service_ready: up\", flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  steps:
  - name: Use
    dependencies:
    - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print(\"TASK_RAN\", {{ Service.Store.main.port }} > 0)"]
