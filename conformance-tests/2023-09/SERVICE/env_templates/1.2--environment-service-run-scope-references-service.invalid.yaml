# Section 4 item 4 constraint 2 / Section 9.9 items 2 and 14: an Environment
# with `runScope: [SERVICE]` must neither list a Service in `dependencies` nor
# reference Service.*; a Service Session may begin before any Service other
# than its own has an endpoint.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
environment:
  name: ServiceSide
  dependencies:
  - service: Cache
  runScope: [SERVICE]
  variables:
    CACHE_PORT: "{{ Service.Cache.main.port }}"
