# Section 1.2 item 5 / Section 4 item 4 (RFC 0009): the Environment may list
# the document's Services in `dependencies` and reference their endpoints;
# because it depends on a Service its runScope defaults to [TASK].
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
environment:
  name: CacheClient
  dependencies:
  - service: Cache
  variables:
    CACHE_PORT: "{{ Service.Cache.main.port }}"
