# Section 4.3 WRAP_ACTIONS constraint 6: `runScope: [TASK]` does not call for
# the onWrapService* hooks, so defining them must be rejected.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
environment:
  name: Wrapper
  runScope: [TASK]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapTaskRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
