# Section 1.2 item 6 constraint 4 (RFC 0009): with no exception for an
# Environment that lists a Service, a Service whose Sessions enter its own
# document's BY_DEFAULT Environment, which lists it, is the cycle
# Cache -> Cache. The remedy is a disabled entry on the Service
# (1.2--services-and-environment).
specificationVersion: environment-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
services:
- name: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Cache.main.port }}"]
environment:
  name: CacheClient
  dependencies:
  - service: Cache
  variables:
    CACHE_PORT: "{{ Service.Cache.main.port }}"
