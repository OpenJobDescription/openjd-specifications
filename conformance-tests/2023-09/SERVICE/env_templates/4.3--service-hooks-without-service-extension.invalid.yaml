# Section 4.3 item 5: the onWrapService* hooks require SERVICE; a document
# declaring only WRAP_ACTIONS and EXPR cannot define them.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- EXPR
environment:
  name: Wrapper
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapTaskRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
