# Section 4 scope rule: WrappedStep.Name is available within onWrapTaskRun
# only; a Service hook's `timeout` cannot reference it, any more than its
# command can.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
- FEATURE_BUNDLE_1
environment:
  name: Wrapper
  runScope: [SERVICE]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
        timeout: "{{ 60 if WrappedStep.Name == 'Render' else 30 }}"
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
