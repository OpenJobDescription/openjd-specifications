# Section 4.3 WRAP_ACTIONS constraint 6 (RFC 0009): a SERVICE-scoped wrapping
# Environment Template defines onWrapEnvEnter, onWrapEnvExit, and the four
# onWrapService* hooks -- the shape of a queue's container wrapper for
# Services.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- EXPR
environment:
  name: Wrapper
  runScope: [SERVICE]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
