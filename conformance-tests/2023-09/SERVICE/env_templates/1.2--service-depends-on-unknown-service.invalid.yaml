# Section 1.2 item 6 constraint 5 / Section 3.2 constraint 1 (RFC 0009): a
# `service` entry in an Environment Template's Service must name a Service of
# the same document's `services`. `service: Cache` names none.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Front
  dependencies:
  - service: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
