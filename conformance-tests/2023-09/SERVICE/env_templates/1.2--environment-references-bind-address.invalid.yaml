# Section 1.2 item 5 / Section 7.3.1: an Environment that lists a Service in
# `dependencies` may reference its `port` and `connectAddress`, never its
# `bindAddress`. The Service declines CacheClient, so that is the only error.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
services:
- name: Cache
  dependencies:
  - environment: CacheClient
    enableIf: false
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", ]
environment:
  name: CacheClient
  dependencies:
  - service: Cache
  variables:
    CACHE_BIND: "{{ Service.Cache.main.bindAddress }}"
