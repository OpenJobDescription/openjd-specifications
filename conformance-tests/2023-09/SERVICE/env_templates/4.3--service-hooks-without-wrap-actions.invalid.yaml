# Section 4.3 item 5: the onWrapService* hooks require WRAP_ACTIONS; a
# document declaring only SERVICE and EXPR cannot define them.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
environment:
  name: Wrapper
  runScope: [SERVICE]
  script:
    actions:
      onEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
