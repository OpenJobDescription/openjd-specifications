# Section 4 item 4 (RFC 0009): an attached Environment with `runScope:
# [SERVICE]` is entered in Service Sessions only; a queue can provision
# software for Services without entering it for Tasks.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
environment:
  name: ServiceTooling
  runScope: [SERVICE]
  variables:
    SERVICE_TOOLING: enabled
