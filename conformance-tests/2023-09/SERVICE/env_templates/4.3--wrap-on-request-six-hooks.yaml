# Section 4.3 WRAP_ACTIONS constraint 6 (RFC 0009): an `activation: ON_REQUEST`
# wrapping Environment Template that defines onWrapEnvEnter, onWrapEnvExit, and
# the four onWrapService* hooks -- the shape of a queue's container wrapper for
# Services, which the Services that want it request. It is valid on its own;
# a Step that requests it would need onWrapTaskRun, which is checked when the
# Job is created.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- SERVICE
- ENV_PARAMS
- EXPR
environment:
  name: Wrapper
  activation: ON_REQUEST
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print()"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print()"]
      onWrapServiceEnter:
        command: python
        args: ["-c", "print()"]
      onWrapServiceRun:
        command: python
        args: ["-c", "print()"]
      onWrapServiceHealthCheck:
        command: python
        args: ["-c", "print()"]
      onWrapServiceExit:
        command: python
        args: ["-c", "print()"]
