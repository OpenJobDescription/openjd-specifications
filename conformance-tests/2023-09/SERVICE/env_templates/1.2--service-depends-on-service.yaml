# Section 1.2 item 6 constraint 5 / Section 9 item 4 (RFC 0009): a Service in
# an Environment Template may depend on another Service in the same list with
# `service: <name>`, with or without referencing its endpoint; Front
# starts only once Back is READY.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
- name: Front
  dependencies:
  - service: Back
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()"]
