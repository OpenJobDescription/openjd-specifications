# Section 1.2 item 6 constraint 5 (RFC 0009): the only `environment:` entry a
# Service in an Environment Template may have is a disabled one, whose
# `enableIf` is the literal `false`. An expression, even one that evaluates
# to false, is rejected at template validation.
specificationVersion: environment-2023-09
extensions:
- SERVICE
- ENV_PARAMS
- EXPR
services:
- name: Cache
  dependencies:
  - environment: CacheClient
    enableIf: "1 == 2"
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Service.Cache.main.port }}"]
environment:
  name: CacheClient
  dependencies:
  - service: Cache
  variables:
    CACHE_PORT: "{{ Service.Cache.main.port }}"
