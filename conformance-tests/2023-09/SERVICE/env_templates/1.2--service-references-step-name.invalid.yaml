# Section 9 (RFC 0009): a Service belongs to no Step, so Step.Name is not
# available within it (only Job.Name is).
specificationVersion: environment-2023-09
extensions:
- SERVICE
- EXPR
services:
- name: Cache
  ports:
  - name: main
  script:
    actions:
      onRun:
        command: python
        args: ["-c", "print()", "{{ Step.Name }}"]
