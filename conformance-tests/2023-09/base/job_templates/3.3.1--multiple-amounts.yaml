specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  hostRequirements:
    amounts:
    - name: amount.worker.vcpu
      min: 4
    - name: amount.worker.memory
      min: 8192
    - name: amount.worker.gpu
      min: 1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
