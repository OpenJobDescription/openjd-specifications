# Tests PATH parameter minLength validation (Spec 2.2)
# PATH parameter value must meet minLength constraint
specificationVersion: jobtemplate-2023-09
name: PathMinLengthTest
parameterDefinitions:
  - name: InputPath
    type: PATH
    minLength: 10
    default: /tmp/short
steps:
  - name: TestStep
    script:
      actions:
        onRun:
          command: echo
          args:
            - "{{Param.InputPath}}"
