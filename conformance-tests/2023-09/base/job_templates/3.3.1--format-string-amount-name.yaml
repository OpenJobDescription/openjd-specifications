# §3.3.1 annotates the amount requirement name `@fmtstring`. The name is resolved at job
# creation, so template validation must accept a name that is a format string.
specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: AmountName
  type: STRING
  default: 'amount.custom.licenses'
steps:
- name: Step1
  hostRequirements:
    amounts:
    - name: '{{Param.AmountName}}'
      min: 1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'RESULT:created')
