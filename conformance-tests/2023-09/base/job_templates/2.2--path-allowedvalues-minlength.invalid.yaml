# Tests PATH parameter allowedValues item violates minLength (Spec 2.2)
# Each allowedValues item must meet minLength constraint
specificationVersion: jobtemplate-2023-09
name: PathAllowedValuesMinLength
parameterDefinitions:
  - name: InputPath
    type: PATH
    minLength: 15
    allowedValues:
      - /tmp/valid/path
      - /short
steps:
  - name: TestStep
    script:
      actions:
        onRun:
          command: echo
          args:
            - "{{Param.InputPath}}"
