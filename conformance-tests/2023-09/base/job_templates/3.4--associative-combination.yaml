specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range:
      - 1
      - 2
      - 3
    - name: Scene
      type: STRING
      range:
      - a
      - b
      - c
    combination: (Frame, Scene)
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
