specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
    - name: attr.worker.cpu.arch
      anyOf:
      - x86_64
      - arm64
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
