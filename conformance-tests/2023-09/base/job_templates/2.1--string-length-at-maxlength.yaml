# A STRING parameter default whose length exactly equals maxLength is accepted (bound is inclusive).
specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: MyParam
  type: STRING
  maxLength: 5
  default: abcde
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print('{{Param.MyParam}}')"
