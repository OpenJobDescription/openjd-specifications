# Template Schemas §3.4.1.1 and §7.3: a <TaskParameterStringValue> element of an <IntRangeList> is a format string,
# and a format string may only reference variables defined at its location. Param.Missing is not defined.
specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: IntValue
  type: INT
  default: 10
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: X
      type: INT
      range:
      - 1
      - "{{Param.Missing}}"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{Task.Param.X}}')"
