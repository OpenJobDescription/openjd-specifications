specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  stepEnvironments:
  - name: StepEnv
    script:
      actions:
        onEnter:
          command: python
          args:
          - "-c"
          - "print(r'entering step env')"
        onExit:
          command: python
          args:
          - "-c"
          - "print(r'exiting step env')"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
