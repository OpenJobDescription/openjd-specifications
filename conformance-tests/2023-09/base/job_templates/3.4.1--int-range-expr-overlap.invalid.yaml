# Spec 3.4.1.1.1: "no two ranges in the expression are allowed to overlap"
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "1-10,5-15"
