specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: Quality
  type: STRING
  allowedValues:
  - low
  - medium
  - high
  userInterface:
    control: DROPDOWN_LIST
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print('{{Param.Quality}}')"
