# Template Schemas §3.4.1.1: an <IntRangeList> element is an <integer>, an <intstring>, or a
# <TaskParameterStringValue>, a format string that must resolve to an integer. The elements can be mixed.
specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: IntValue
  type: INT
  default: 10
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: X
      type: INT
      range:
      - 1
      - "2"
      - "{{Param.IntValue}}"
      - "1{{Param.IntValue}}"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{Task.Param.X}}')"
