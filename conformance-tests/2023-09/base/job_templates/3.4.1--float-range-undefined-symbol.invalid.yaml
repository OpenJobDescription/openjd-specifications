# Template Schemas sections 3.4.1.2 and 7.3.1: a FLOAT range element may be a
# format string, and a format string can reference only the values available
# in its scope. `Param.Scale` is not defined, so the template is invalid.
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Factor
      type: FLOAT
      range:
      - 1.5
      - "{{ Param.Scale }}"
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ Task.Param.Factor }}')
