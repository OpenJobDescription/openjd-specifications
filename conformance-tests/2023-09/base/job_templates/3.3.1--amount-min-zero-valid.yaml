# Tests that amount min can be zero (Spec 3.3.1)
# min: <nonnegativefloat> means min >= 0
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
  - name: Step1
    hostRequirements:
      amounts:
        - name: amount.worker.vcpu
          min: 0
          max: 4
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
