# A format-string cancelation mode requires the FEATURE_BUNDLE_1 extension; in base it must be rejected.
specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: Mode
  type: STRING
  default: TERMINATE
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
        cancelation:
          mode: "{{Param.Mode}}"
