# Base parameter type names are case-sensitive. Case-insensitive names require
# the EXPR extension (Template Schemas section 2, RFC 0007).
#
# Declares type: string with no extensions field. The positive twin is
# EXPR/job_templates/2--type-case-insensitive.yaml.
#
# Validation must refuse it. An implementation that folds case unconditionally
# accepts it and treats the parameter as STRING.
specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: MyParam
  type: string
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
