# Spec 3.3: capability names are case-insensitive, so these are duplicates
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  hostRequirements:
    amounts:
    - name: amount.worker.vcpu
      min: 4
    - name: AMOUNT.WORKER.VCPU
      min: 8
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
