# §3.3.2 annotates the attribute requirement name `@fmtstring`. The name is resolved at job
# creation, so template validation must accept a name that is a format string.
specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: AttributeName
  type: STRING
  default: 'attr.custom.gpu_type'
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: '{{Param.AttributeName}}'
      anyOf:
      - value1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'RESULT:created')
