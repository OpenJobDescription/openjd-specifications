# Spec 3.4.1.1.1: overlapping stepped ranges should be invalid
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "1-10:2,3-10:2"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
