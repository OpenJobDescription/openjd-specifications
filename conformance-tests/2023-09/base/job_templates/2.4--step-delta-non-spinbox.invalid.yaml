specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: MyParam
  type: FLOAT
  allowedValues:
  - 0.5
  - 1.0
  userInterface:
    control: DROPDOWN_LIST
    singleStepDelta: 0.1
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print('{{Param.MyParam}}')"
