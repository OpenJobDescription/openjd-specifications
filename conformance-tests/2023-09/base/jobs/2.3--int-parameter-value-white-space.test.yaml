# Template Schemas §2.3 and §7.5: an INT Job Parameter's value given as a string is an <intstring>, so white space
# around the integer is ignored, in the submitted value and in the default.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Submitted
    type: INT
    minValue: " 1 "
  - name: Default
    type: INT
    default: "\t3 "
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'SUBMITTED=[{{Param.Submitted}}] DEFAULT=[{{Param.Default}}]')
parameters:
  Submitted: " 7 "
expected:
  output:
  - 'SUBMITTED=[7] DEFAULT=[3]'
