# A supplied INT parameter value of 2^63-1 (largest signed 64-bit integer) is accepted and resolves exactly.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: MyParam
    type: INT
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:{{Param.MyParam}}')
parameters:
  MyParam: 9223372036854775807
expected:
  output:
  - OUTPUT:9223372036854775807
