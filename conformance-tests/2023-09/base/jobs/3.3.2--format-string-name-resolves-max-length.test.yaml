# §3.3.2.1: the 100 character limit applies to the resolved name. This name resolves to exactly
# 100 characters, so job creation succeeds. Negative twin:
# 3.3.2--format-string-name-resolves-too-long.invalid.test.yaml.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: AttributeName
    type: STRING
    default: 'attr.custom.gpu_type'
  steps:
  - name: Step1
    hostRequirements:
      attributes:
      - name: '{{Param.AttributeName}}'
        anyOf:
        - value1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:created')
parameters:
  AttributeName: attr.custom.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
expected:
  output:
  - RESULT:created
