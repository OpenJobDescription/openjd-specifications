# §3.3.1.1: the 100 character limit applies to the resolved name. This name resolves to exactly
# 100 characters, so job creation succeeds. Negative twin:
# 3.3.1--format-string-amount-name-resolves-too-long.invalid.test.yaml.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: AmountName
    type: STRING
    default: 'amount.custom.licenses'
  steps:
  - name: Step1
    hostRequirements:
      amounts:
      - name: '{{Param.AmountName}}'
        min: 1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:created')
parameters:
  AmountName: amount.custom.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
expected:
  output:
  - RESULT:created
