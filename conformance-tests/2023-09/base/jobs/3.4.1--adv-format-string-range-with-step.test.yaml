template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Start
    type: STRING
    default: '0'
  - name: End
    type: STRING
    default: '10'
  - name: Step
    type: STRING
    default: '2'
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Val
        type: INT
        range: '{{Param.Start}}-{{Param.End}}:{{Param.Step}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VAL:{{Task.Param.Val}}')
expected:
  output:
  - VAL:0
  - VAL:2
  - VAL:4
  - VAL:6
  - VAL:8
  - VAL:10
  forbidden:
  - VAL:-1
  - VAL:11
