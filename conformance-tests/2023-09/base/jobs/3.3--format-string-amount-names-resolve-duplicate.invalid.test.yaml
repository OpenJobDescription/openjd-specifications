# §3.3 constraint 3: no two amounts may have the same name after the name format strings have
# been resolved. The raw names differ, but both resolve to amount.custom.licenses, so job
# creation must fail.
#
# .invalid.test.yaml, not .invalid.yaml: the template is valid on its own and the error only
# fires once the submitted value is bound.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: FirstName
    type: STRING
    default: 'amount.custom.licenses'
  - name: SecondName
    type: STRING
    default: 'amount.custom.tokens'
  steps:
  - name: Step1
    hostRequirements:
      amounts:
      - name: '{{Param.FirstName}}'
        min: 1
      - name: '{{Param.SecondName}}'
        min: 1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:created')
parameters:
  FirstName: amount.custom.licenses
  SecondName: amount.custom.licenses
