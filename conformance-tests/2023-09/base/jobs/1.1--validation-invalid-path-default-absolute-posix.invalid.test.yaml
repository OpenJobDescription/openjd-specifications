runOn: [posix]

# 2.2: a PATH default must be relative; it is joined with the job template's
# directory at job creation, and an absolute default is an error. Companion to
# 1.1--validation-invalid-path-default-escapes-template-dir. The script prints
# a constant so the default is the only thing that can fail.

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: OutputDir
    type: PATH
    default: /tmp/output
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:success')
