template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:{{Param.Float}}-{{Param.String}}')
  parameterDefinitions:
  - name: Float
    type: STRING
    default: '4.098'
  - name: String
    type: STRING
    default: hello1
expected:
  output:
  - RESULT:4.098-hello1
  forbidden:
  - '{{Param.'
  - '{{Task.'
