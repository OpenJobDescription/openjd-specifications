# A job name format string resolving to 129 characters exceeds the 128-character post-resolution
# limit (spec 1.1.1) and must be rejected at job creation. The literal is short, so only a
# post-resolution check catches this.
template:
  specificationVersion: jobtemplate-2023-09
  name: XY{{Param.Suffix}}
  parameterDefinitions:
  - name: Suffix
    type: STRING
    default: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'SHOULD_NOT_RUN')
