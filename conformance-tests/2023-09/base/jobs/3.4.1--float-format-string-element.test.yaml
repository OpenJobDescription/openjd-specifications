# Template Schemas §3.4.1.2: a <TaskParameterStringValue> element of a <FloatRangeList> resolves to the string
# representation of a floating point value, which becomes the task parameter value. An integer is a valid floating
# point value, and white space around the number is ignored, as for a <floatstring> (§7.5).
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Text
    type: STRING
  - name: IntValue
    type: INT
  - name: Padded
    type: STRING
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: FLOAT
        range:
        - 0.5
        - "{{Param.Text}}"
        - "{{Param.IntValue}}"
        - "{{Param.Padded}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Text: "2.5"
  IntValue: "7"
  Padded: " 3.5 "
expected:
  output:
  - 'TASK:X=[0.5]'
  - 'TASK:X=[2.5]'
  - 'TASK:X=[7]'
  - 'TASK:X=[3.5]'
