# The job template `name` is annotated @fmtstring (Template Schemas L38) and resolves at
# job creation. Existing base fixtures assert a PARALLEL substitution of the same parameter
# into a task argument, which proves the parameter resolved somewhere but says nothing about
# the name field. EXPR/jobs/7.3.1--job-name-step-name.test.yaml asserts the resolved name
# properly, but needs the EXPR extension to read {{ Job.Name }}.
#
# This asserts the name field itself at base level, through the implementation's own report
# of the job it ran. Both reference CLIs emit the resolved name twice, once as
# `Running job '<name>'` and once as `Job: <name>` in the results block, so the assertion is
# written with anyOf and either satisfies it.
#
# The parameters block overrides both defaults. The default-derived name is forbidden, so a
# fixture that resolved against defaults instead of submitted values fails.
template:
  specificationVersion: jobtemplate-2023-09
  name: Job-{{Param.Project}}-{{Param.Version}}
  parameterDefinitions:
  - name: Project
    type: STRING
    default: TemplateDefault
  - name: Version
    type: STRING
    default: '9.9'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["ran"]
parameters:
  Project: StudioX
  Version: '1.0'
expected:
  output:
  - anyOf: ["Job: Job-StudioX-1.0", "Running job 'Job-StudioX-1.0'"]
  forbidden:
  - "Job-TemplateDefault-9.9"
  - "{{Param."
