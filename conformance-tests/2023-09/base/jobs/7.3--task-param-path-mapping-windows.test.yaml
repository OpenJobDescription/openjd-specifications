runOn: [windows]

# Task PATH parameters with path mapping using Windows-native paths.

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: InputFile
        type: PATH
        range:
        - 'D:\original\file_a'
        - 'D:\original\file_b'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:{{Task.Param.InputFile}}')

pathMapping:
- source_path_format: WINDOWS
  source_path: 'D:\original'
  destination_path: 'E:\mapped'

expected:
  output:
  - 'TASK:E:\mapped\file_a'
  - 'TASK:E:\mapped\file_b'
