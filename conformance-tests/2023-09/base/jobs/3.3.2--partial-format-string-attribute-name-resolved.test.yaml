# §3.3.2.1: only part of the attribute capability name is a format string. The resolved name
# attr.custom.gpu_type is valid, so job creation succeeds.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: AttributeKind
    type: STRING
    default: 'gpu_type'
  steps:
  - name: Step1
    hostRequirements:
      attributes:
      - name: 'attr.custom.{{Param.AttributeKind}}'
        anyOf:
        - value1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:created')
expected:
  output:
  - RESULT:created
