# hostRequirements.attributes[].allOf is annotated @fmtstring in base 2023-09 (Template
# Schemas L1015), the same as anyOf at L1014, with no extension gate. Its element type
# <AttributeCapabilityValue> is constrained to the identifier-like pattern in section 3.3.2.2,
# and that pattern cannot be checked at decode when the element is a format string, so it must
# be re-checked after resolution at job creation.
#
# Here the parameter resolves to "not valid!", violating the pattern on both the space and the
# exclamation mark.
#
# Companion to 3.3.2--format-string-in-anyof-resolves-to-invalid-value.invalid.test.yaml in
# this directory. anyOf and allOf are separate spec fields with separate validators, so they
# are covered separately rather than assumed symmetric, but the observed divergence is the same
# and reviewers may prefer to treat both as one issue.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Feature
    type: STRING
    default: "not valid!"
  steps:
  - name: Step1
    hostRequirements:
      attributes:
      - name: attr.custom.features
        allOf:
        - '{{Param.Feature}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RAN')
