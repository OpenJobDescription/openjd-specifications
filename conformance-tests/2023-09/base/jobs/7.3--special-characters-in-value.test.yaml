template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - 'print(''RESULT:Path: {{Param.Path}}'')'
  parameterDefinitions:
  - name: Path
    type: STRING
    default: /path/with spaces/and$pecial
expected:
  output:
  - 'RESULT:Path: /path/with spaces/and$pecial'
  forbidden:
  - '{{Param.'
  - '{{Task.'
