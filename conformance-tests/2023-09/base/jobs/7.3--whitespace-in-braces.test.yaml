template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - 'print(''RESULT: {{ Param.Float }} - {{    Param.End}}  '')'
  parameterDefinitions:
  - name: Float
    type: STRING
    default: '4.098'
  - name: End
    type: STRING
    default: '10'
expected:
  output:
  - 'RESULT: 4.098 - 10  '
  forbidden:
  - '{{Param.'
  - '{{Task.'
