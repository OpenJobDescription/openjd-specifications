template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: testfile
        type: TEXT
        data: test content
      actions:
        onRun:
          command: python
          args:
          - -c
          - import os; path = r'{{Task.File.testfile}}'; session_dir = r'{{Session.WorkingDirectory}}';
            print('FILE_IN_SESSION_DIR:true' if os.path.dirname(path).startswith(session_dir)
            else 'FILE_IN_SESSION_DIR:false')
expected:
  output:
  - FILE_IN_SESSION_DIR:true
