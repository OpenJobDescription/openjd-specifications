# 2.2: the default is lexically normalized before the within-directory
# check, so a/../../b resolves to ../b and escapes even though it does not
# begin with "..". The script prints a constant so the default is the only
# thing that can fail.

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: OutputDir
    type: PATH
    default: a/../../b
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:success')
