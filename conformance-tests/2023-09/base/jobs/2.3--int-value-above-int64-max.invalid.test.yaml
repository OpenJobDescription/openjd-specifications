# Section 2.3 types an INT parameter value as <integer> or <intstring> and
# states no bound. Both reference implementations store INT as int64, the range
# the Expression Language type table defines.
#
# Supplies 9223372036854775808, one past int64 max, for a parameter with no
# constraints. The 2^63-1 accept twin is added by PR #161.
#
# Job creation must refuse it. An implementation that coerces without checking
# the range saturates the value or wraps it.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: MyParam
    type: INT
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:{{Param.MyParam}}')
parameters:
  MyParam: 9223372036854775808
