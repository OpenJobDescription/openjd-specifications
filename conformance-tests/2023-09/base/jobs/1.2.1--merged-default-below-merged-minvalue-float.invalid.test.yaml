# A merged job parameter definition must be internally consistent, so its
# default has to satisfy the merged constraints (section 1.2.1).
#
# The FLOAT axis of 1.2.1--merged-default-below-merged-minvalue: the environment
# template sets minValue 10.0 and the job template, processed last, sets 0.0
# with default 2.5. Only the merged minimum makes it invalid.
#
# Job creation must refuse it. An implementation whose default check covers INT
# but not FLOAT runs the job and prints SCALE[2.5].
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Scale
    type: FLOAT
    minValue: 0.0
    default: 2.5
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'SCALE[{{Param.Scale}}]')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Scale
    type: FLOAT
    minValue: 10.0
  environment:
    name: TestEnv
    variables:
      SCALE: '{{Param.Scale}}'
