# 2.2: a default of ".." resolves to the parent of the job template's
# directory, which is outside it. The script prints a constant so the default
# is the only thing that can fail.

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: OutputDir
    type: PATH
    default: ..
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:success')
