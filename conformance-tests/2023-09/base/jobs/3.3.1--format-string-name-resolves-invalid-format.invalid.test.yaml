# §3.3.1.1: the name pattern applies to the resolved name. The submitted value resolves to an
# attribute capability name, which does not match the amount capability name pattern, so job
# creation must fail. Positive twin: 3.3.1--format-string-name-resolved.test.yaml.
#
# .invalid.test.yaml, not .invalid.yaml: the template is valid on its own and the error only
# fires once the submitted value is bound.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: AmountName
    type: STRING
    default: 'amount.custom.licenses'
  steps:
  - name: Step1
    hostRequirements:
      amounts:
      - name: '{{Param.AmountName}}'
        min: 1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:created')
parameters:
  AmountName: attr.custom.licenses
