# Template Schemas §3.4.1.1: a <TaskParameterStringValue> element of an <IntRangeList> resolves to the string
# representation of an integer, which becomes the task parameter value. Text around the expression is part of that
# string, and white space around the integer is ignored, as for an <intstring> (§7.5).
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: IntValue
    type: INT
  - name: Text
    type: STRING
  - name: Padded
    type: STRING
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: INT
        range:
        - 1
        - "2"
        - "{{Param.IntValue}}"
        - "{{Param.Text}}"
        - "{{Param.Padded}}"
        - "1{{Param.IntValue}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  IntValue: "7"
  Text: "9"
  Padded: " 8\t"
expected:
  output:
  - 'TASK:X=[1]'
  - 'TASK:X=[2]'
  - 'TASK:X=[7]'
  - 'TASK:X=[9]'
  - 'TASK:X=[8]'
  - 'TASK:X=[17]'
