template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Val
        type: INT
        range: -5--14:-2
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VAL:{{Task.Param.Val}}')
expected:
  output:
  - VAL:-5
  - VAL:-7
  - VAL:-9
  - VAL:-11
  - VAL:-13
  forbidden:
  - VAL:-14
  - VAL:-4
