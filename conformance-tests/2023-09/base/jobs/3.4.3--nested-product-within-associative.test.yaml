template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: A
        type: STRING
        range:
        - '1'
        - '2'
      - name: B
        type: STRING
        range:
        - x
        - y
      - name: C
        type: STRING
        range:
        - '10'
        - '20'
      - name: D
        type: STRING
        range:
        - a
        - b
      combination: (A * B, C * D)
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:A={{Task.Param.A}},B={{Task.Param.B}},C={{Task.Param.C}},D={{Task.Param.D}}')
expected:
  output:
  - TASK:A=1,B=x,C=10,D=a
  - TASK:A=1,B=y,C=10,D=b
  - TASK:A=2,B=x,C=20,D=a
  - TASK:A=2,B=y,C=20,D=b
  forbidden:
  - TASK:A=0,B=y,C=10,D=b
  - TASK:A=2,B=0,C=10,D=b
  - TASK:A=1,B=x,C=10,D=b
  - TASK:A=1,B=x,C=20,D=a
  - TASK:A=2,B=y,C=10,D=a
