# Spec 3.4.1.1.1: overlap is measured on each element's span of actual values, not its written endpoints. 1-10:4 has
# the values 1, 5, 9 and the span 1 to 9, so it does not overlap 10-15 even though its written end is 10.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Val
        type: INT
        range: 1-10:4,10-15
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VAL:[{{Task.Param.Val}}]')
expected:
  output:
  - VAL:[1]
  - VAL:[5]
  - VAL:[9]
  - VAL:[10]
  - VAL:[15]
  forbidden:
  - VAL:[2]
  - VAL:[8]
