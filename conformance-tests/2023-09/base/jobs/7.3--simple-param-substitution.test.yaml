template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:Hello {{Param.Name}}!')
  parameterDefinitions:
  - name: Name
    type: STRING
    default: World
expected:
  output:
  - RESULT:Hello World!
  forbidden:
  - '{{Param.'
  - '{{Task.'
