template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:{{Param.A}}{{Param.B}}')
  parameterDefinitions:
  - name: A
    type: STRING
    default: Hello
  - name: B
    type: STRING
    default: World
expected:
  output:
  - RESULT:HelloWorld
  forbidden:
  - '{{Param.'
  - '{{Task.'
