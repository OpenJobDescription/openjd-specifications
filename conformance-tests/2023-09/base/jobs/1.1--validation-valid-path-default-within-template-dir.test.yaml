template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: OutputDir
    type: PATH
    default: ./output
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:{{Param.OutputDir}}')
expected:
  output:
  - 'OUTPUT:'
  output_posix:
  - /output
  output_windows:
  - "\\output"
