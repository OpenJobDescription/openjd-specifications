# 2.2: a relative PATH default is joined with the job template's directory
# and lexically normalized. TemplateDir has default ".", which resolves to the
# directory itself (the directory counts as within itself), so the script can
# check the joined path exactly without knowing the directory.

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: TemplateDir
    type: PATH
    default: .
  - name: OutputDir
    type: PATH
    default: ./output
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            import os
            t = r'{{Param.TemplateDir}}'
            p = r'{{Param.OutputDir}}'
            print('TDIR_ABS:[' + str(os.path.isabs(t)) + ']')
            print('TDIR_NORM:[' + str(t == os.path.normpath(t)) + ']')
            print('JOINED:[' + str(p == os.path.join(t, 'output')) + ']')
expected:
  output:
  - TDIR_ABS:[True]
  - TDIR_NORM:[True]
  - JOINED:[True]
