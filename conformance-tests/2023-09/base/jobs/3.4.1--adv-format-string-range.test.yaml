template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Start
    type: STRING
    default: '1'
  - name: End
    type: STRING
    default: '5'
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Val
        type: INT
        range: '{{Param.Start}}-{{Param.End}}'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VAL:{{Task.Param.Val}}')
expected:
  output:
  - VAL:1
  - VAL:2
  - VAL:3
  - VAL:4
  - VAL:5
  forbidden:
  - VAL:0
  - VAL:6
