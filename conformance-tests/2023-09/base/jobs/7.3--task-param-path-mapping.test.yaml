template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: InputFile
        type: PATH
        range:
        - /original/file_a
        - /original/file_b
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:{{Task.Param.InputFile}}')

pathMapping:
- source_path_format: POSIX
  source_path: /original
  destination_path: /mapped

expected:
  output:
  - TASK:/mapped/file_a
  - TASK:/mapped/file_b
