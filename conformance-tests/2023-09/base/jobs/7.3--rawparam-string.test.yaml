template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:{{RawParam.Name}}')
  parameterDefinitions:
  - name: Name
    type: STRING
    default: TestValue
expected:
  output:
  - RESULT:TestValue
