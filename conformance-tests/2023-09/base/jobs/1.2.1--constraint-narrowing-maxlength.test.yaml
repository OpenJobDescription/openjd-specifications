template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Value
    type: STRING
    maxLength: 50
    default: test-value
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'Value={{Param.Value}}')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Value
    type: STRING
    maxLength: 100
    default: test-value
  environment:
    name: TestEnv
    variables:
      VAL: '{{Param.Value}}'
expected:
  output:
  - Value=test-value
