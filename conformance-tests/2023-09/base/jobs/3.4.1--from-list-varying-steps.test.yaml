template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Val
        type: INT
        range: 1,3,5,6,7,8,10,13,16
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VAL:{{Task.Param.Val}}')
expected:
  output:
  - VAL:1
  - VAL:3
  - VAL:5
  - VAL:6
  - VAL:7
  - VAL:8
  - VAL:10
  - VAL:13
  - VAL:16
  forbidden:
  - VAL:0
  - VAL:17
