# 2.2: maxLength is checked after the default is joined with the job
# template's directory. The default itself fits, so the template passes
# validation; the joined absolute path does not fit, so job creation fails.
# The script prints a constant so the parameter is the only thing that can fail.

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Short
    type: PATH
    default: a
    maxLength: 3
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:success')
