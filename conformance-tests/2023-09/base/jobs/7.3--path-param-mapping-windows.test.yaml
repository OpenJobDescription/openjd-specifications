runOn: [windows]

# Tests that Windows-style absolute PATH parameters are recognized as absolute
# (not joined to cwd) and that path mapping rules with WINDOWS source format
# match correctly. Covers drive-letter paths (backslash, forward slash, mixed
# separators) and UNC paths.

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: DriveBs
    type: PATH
  - name: DriveFs
    type: PATH
  - name: DriveMixed
    type: PATH
  - name: UncBs
    type: PATH
  - name: UncFs
    type: PATH
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'DRIVE_BS:{{Param.DriveBs}}')
            print(r'DRIVE_FS:{{Param.DriveFs}}')
            print(r'DRIVE_MIXED:{{Param.DriveMixed}}')
            print(r'UNC_BS:{{Param.UncBs}}')
            print(r'UNC_FS:{{Param.UncFs}}')

parameters:
  DriveBs: 'D:\original\path'
  DriveFs: 'D:/original/path'
  DriveMixed: 'D:\original/path\somewhere'
  UncBs: '\\server\share\path'
  UncFs: '//server/share/path'

pathMapping:
- source_path_format: WINDOWS
  source_path: 'D:\original'
  destination_path: 'E:\mapped'
- source_path_format: WINDOWS
  source_path: '\\server\share'
  destination_path: 'Z:\share'

expected:
  output:
  - 'DRIVE_BS:E:\mapped\path'
  - 'DRIVE_FS:E:\mapped\path'
  - 'DRIVE_MIXED:E:\mapped\path\somewhere'
  - 'UNC_BS:Z:\share\path'
  - 'UNC_FS:Z:\share\path'
