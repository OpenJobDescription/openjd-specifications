template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: InputFile
        type: PATH
        range:
        - /path/a.exr
        - /path/b.exr
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:InputFile={{Task.Param.InputFile}}')
expected:
  output_posix:
  - TASK:InputFile=/path/a.exr
  - TASK:InputFile=/path/b.exr
  output_windows:
  - TASK:InputFile=\path\a.exr
  - TASK:InputFile=\path\b.exr
  forbidden:
  - TASK:InputFile=/path/c.exr
