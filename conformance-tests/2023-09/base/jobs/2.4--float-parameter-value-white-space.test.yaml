# Template Schemas §2.4 and §7.5: a FLOAT Job Parameter's value given as a string is a <floatstring>, so white space
# around the number is ignored, in the submitted value and in the default. U+00A0 (no-break space) is white space.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Submitted
    type: FLOAT
    maxValue: " 10 "
  - name: Default
    type: FLOAT
    default: " 0.5\n"
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'SUBMITTED=[{{Param.Submitted}}] DEFAULT=[{{Param.Default}}]')
parameters:
  Submitted: "\u00a02.5 "
expected:
  output:
  - 'SUBMITTED=[2.5] DEFAULT=[0.5]'
