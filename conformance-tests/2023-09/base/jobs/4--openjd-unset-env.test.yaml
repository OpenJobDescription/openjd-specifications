template:
  specificationVersion: jobtemplate-2023-09
  name: EnvStdoutUnsetVar
  jobEnvironments:
  - name: UnsetEnv
    variables:
      UNSET_ME: original_value
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - 'print(''openjd_unset_env: UNSET_ME'')'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - import os; print('UNSET_ME_IS:' + os.environ.get('UNSET_ME', 'UNSET'))
expected:
  output:
  - UNSET_ME_IS:UNSET
