template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:{{Param.First}} and {{Param.Second}}')
  parameterDefinitions:
  - name: First
    type: STRING
    default: One
  - name: Second
    type: STRING
    default: Two
expected:
  output:
  - RESULT:One and Two
  forbidden:
  - '{{Param.'
  - '{{Task.'
