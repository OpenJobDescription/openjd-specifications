template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Scene
        type: STRING
        range:
        - scene_a
        - scene_b
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:Scene={{Task.Param.Scene}}')
expected:
  output:
  - TASK:Scene=scene_a
  - TASK:Scene=scene_b
  forbidden:
  - TASK:Scene=scene_c
