# A job name format string resolving to exactly 128 characters is accepted (limit is inclusive,
# measured after resolution per spec 1.1.1).
template:
  specificationVersion: jobtemplate-2023-09
  name: X{{Param.Suffix}}
  parameterDefinitions:
  - name: Suffix
    type: STRING
    default: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'NAME_LENGTH_OK')
expected:
  output:
  - NAME_LENGTH_OK
