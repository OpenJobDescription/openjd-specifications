# §3.3 constraint 4: no two attributes may have the same name after the name format strings have
# been resolved. The raw names differ, but both resolve to attr.custom.gpu_type, so job creation
# must fail.
#
# .invalid.test.yaml, not .invalid.yaml: the template is valid on its own and the error only
# fires once the submitted value is bound.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: FirstName
    type: STRING
    default: 'attr.custom.gpu_type'
  - name: SecondName
    type: STRING
    default: 'attr.custom.cpu_type'
  steps:
  - name: Step1
    hostRequirements:
      attributes:
      - name: '{{Param.FirstName}}'
        anyOf:
        - value1
      - name: '{{Param.SecondName}}'
        anyOf:
        - value2
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:created')
parameters:
  FirstName: attr.custom.gpu_type
  SecondName: attr.custom.gpu_type
