# Supplied INT values exactly equal to minValue and maxValue are accepted (bounds are inclusive).
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: AtMin
    type: INT
    minValue: 10
    maxValue: 100
  - name: AtMax
    type: INT
    minValue: 10
    maxValue: 100
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'BOUNDS:min={{Param.AtMin}},max={{Param.AtMax}}')
parameters:
  AtMin: 10
  AtMax: 100
expected:
  output:
  - BOUNDS:min=10,max=100
