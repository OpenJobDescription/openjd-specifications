# Spec 1.1.1 <JobName>: max length 128 characters, checked after the format
# string is resolved. The name is a bare {{Param.N}} whose value is 129
# characters, so job creation must fail even though the template text is
# short and passes decode.
template:
  specificationVersion: jobtemplate-2023-09
  name: "{{Param.N}}"
  parameterDefinitions:
  - name: N
    type: STRING
    default: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - "-c"
          - "print()"
