template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - REDACTED_ENV_VARS
  name: MixedEnvTest
  jobEnvironments:
  - name: MixedEnv
    variables:
      PUBLIC_VAR: public_value_visible
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - 'print(''openjd_redacted_env: PRIVATE_VAR=private_value_hidden'')'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - import os; print('PUBLIC:' + os.environ.get('PUBLIC_VAR', '') + ' PRIVATE:'
            + os.environ.get('PRIVATE_VAR', ''))
expected:
  output:
  - PUBLIC:public_value_visible
  - PRIVATE:********
  forbidden:
  - private_value_hidden
