# A redacted value that starts with a multibyte character (U+00E9, two bytes
# in UTF-8) is redacted like any other: its later occurrences in stdout are
# replaced and the run succeeds.
#
# openjd-rs advanced its search one byte past each match, which lands inside
# the multibyte character. It redacted the directive line, then the session's
# output filter panicked on the next line containing the secret, and no
# later output appeared (found by fuzzing, openjd-rs#442).
#
# PYTHONIOENCODING makes Python write UTF-8 on every platform, so the bytes
# the output filter sees do not depend on the console code page. The secret
# is written with \u escapes so this file stays ASCII.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - REDACTED_ENV_VARS
  name: RedactionMultibyteLeadingChar
  jobEnvironments:
  - name: SecretEnv
    variables:
      PYTHONIOENCODING: utf-8
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - "print('openjd_redacted_env: SECRET=\u00e9clair_token')"
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - "print('The value is \u00e9clair_token')"
expected:
  output:
  - The value is ********
  forbidden:
  - clair_token
