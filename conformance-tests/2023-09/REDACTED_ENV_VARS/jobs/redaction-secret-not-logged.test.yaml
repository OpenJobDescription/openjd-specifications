template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - REDACTED_ENV_VARS
  name: RedactionTest
  jobEnvironments:
  - name: SecretEnv
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - 'print(''openjd_redacted_env: SECRET_KEY=super_secret_value_12345'')'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - import os; print('SECRET_IS:' + os.environ.get('SECRET_KEY', ''))
expected:
  output:
  - SECRET_IS:********
  forbidden:
  - super_secret_value_12345
