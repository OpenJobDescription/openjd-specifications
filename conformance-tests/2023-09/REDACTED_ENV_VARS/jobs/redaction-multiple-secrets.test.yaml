template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - REDACTED_ENV_VARS
  name: MultiRedactTest
  jobEnvironments:
  - name: MultiSecrets
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - 'print(''openjd_redacted_env: SECRET1=value_one_secret''); print(''openjd_redacted_env:
            SECRET2=value_two_secret'')'
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - import os; print('S1:' + os.environ.get('SECRET1', '') + ' S2:' + os.environ.get('SECRET2',
            ''))
expected:
  output:
  - S1:********
  - S2:********
  forbidden:
  - value_one_secret
  - value_two_secret
