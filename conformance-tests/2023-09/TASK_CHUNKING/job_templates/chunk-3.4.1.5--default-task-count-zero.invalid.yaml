specificationVersion: jobtemplate-2023-09
extensions:
  - TASK_CHUNKING
name: ChunkTest
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: "CHUNK[INT]"
      range: "1-10"
      chunks:
        defaultTaskCount: 0
        rangeConstraint: CONTIGUOUS
  script:
    actions:
      onRun:
        command: echo
        args:
        - "{{Task.Param.Frame}}"
