specificationVersion: jobtemplate-2023-09
extensions:
  - TASK_CHUNKING
name: ChunkTest
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: "CHUNK[INT]"
      range: "1-10"
      chunks:
        defaultTaskCount: 5
        rangeConstraint: NONCONTIGUOUS
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
