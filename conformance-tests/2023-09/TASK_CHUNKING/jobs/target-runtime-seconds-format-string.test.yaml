# chunks.targetRuntimeSeconds is annotated @fmtstring (Template Schemas L1264), so it may
# be a parameter reference and must be resolved at job creation.
#
# The resolved value is 0, and section 3.4.1.5 says that when targetRuntimeSeconds is 0 a
# scheduler should ignore it and use defaultTaskCount for every chunk. That makes the
# assertion deterministic: the boundaries must be exactly those defaultTaskCount implies,
# with no adaptive resizing. A non-zero resolved value would let a conforming scheduler
# adjust the chunk size, so this case pins the one resolved value whose effect is fixed.
#
# An implementation that reads the pre-resolution template value sees the literal
# "{{Param.TargetRuntime}}" instead of 0 here.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - TASK_CHUNKING
  name: ChunkTest
  parameterDefinitions:
  - name: TargetRuntime
    type: INT
    default: 0
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: 1-6
        chunks:
          defaultTaskCount: 2
          targetRuntimeSeconds: "{{Param.TargetRuntime}}"
          rangeConstraint: CONTIGUOUS
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'CHUNK:{{Task.Param.Frame}}')
expected:
  output:
  - 'CHUNK:1-2'
  - 'CHUNK:3-4'
  - 'CHUNK:5-6'
  forbidden:
  - 'CHUNK:1-6'
  - 'CHUNK:7'
