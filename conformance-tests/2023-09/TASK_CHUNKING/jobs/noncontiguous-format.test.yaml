template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - TASK_CHUNKING
  name: ChunkTest
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: 1-8
        chunks:
          defaultTaskCount: 3
          rangeConstraint: NONCONTIGUOUS
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'CHUNK:{{Task.Param.Frame}}')
expected:
  output:
  - 'CHUNK:1-3'
  - 'CHUNK:4-6'
  - 'CHUNK:7,8'
