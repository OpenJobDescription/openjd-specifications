# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# For a CHUNK[INT] range list, a list whose members do not coerce to int does not match the target, so the job cannot
# be created.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - TASK_CHUNKING
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Names
    type: LIST[STRING]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: CHUNK[INT]
        range:
        - 1
        - "{{ Param.Names }}"
        chunks:
          defaultTaskCount: 1
          rangeConstraint: NONCONTIGUOUS
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Names: [a, b]
