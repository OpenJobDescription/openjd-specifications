# Template Schemas §3.4.1.5 (rangeConstraint): a NONCONTIGUOUS chunk is written in canonical form (§3.4.1.1.1).
# The range 1,3,5,7,9,10 in chunks of three is {1,3,5} and {7,9,10}, written "1-5:2" and "7,9,10".
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - TASK_CHUNKING
  name: TestJob
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: CHUNK[INT]
        range: "1,3,5,7,9,10"
        chunks:
          defaultTaskCount: 3
          rangeConstraint: NONCONTIGUOUS
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"""CHUNK:[{{Task.Param.Frame}}]""")
expected:
  output:
  - 'CHUNK:[1-5:2]'
  - 'CHUNK:[7,9,10]'
