specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: CpuMax
  type: INT
  minValue: 1
steps:
- name: Step1
  hostRequirements:
    amounts:
    - name: amount.worker.vcpu
      max: "{{Param.CpuMax}}"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
