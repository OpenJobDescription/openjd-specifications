specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: NotifyPeriod
  type: INT
  minValue: 1
  maxValue: 600
  default: 120
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
          notifyPeriodInSeconds: "{{Param.NotifyPeriod}}"
