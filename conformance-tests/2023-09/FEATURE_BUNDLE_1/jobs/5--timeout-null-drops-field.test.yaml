# Expression Language §1.3.2: an optional field whose expression evaluates to
# null is omitted as if it were not specified.
#
# Action timeout is the only such field observable at runtime (@fmtstring under
# FEATURE_BUNDLE_1). Its conditional takes the null arm over a 2-second command.
#
# No timeout reaches onRun and the command completes; coercing null instead
# fails validation or kills it. Control: 5--timeout-expr-value-honored.test.yaml.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - FEATURE_BUNDLE_1
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: UseTimeout
    type: BOOL
    default: false
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          timeout: "{{ 30 if Param.UseTimeout else null }}"
          command: python
          args:
          - -c
          - |
            import time
            time.sleep(2)
            print('DONE_NO_TIMEOUT')
expected:
  output:
  - DONE_NO_TIMEOUT
