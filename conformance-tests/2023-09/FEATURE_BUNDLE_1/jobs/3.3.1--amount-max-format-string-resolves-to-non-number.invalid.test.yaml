# hostRequirements.amounts[].max may be a format string under FEATURE_BUNDLE_1 (Template
# Schemas L960), the same as `min` at L958. The numeric constraint cannot be checked at
# decode, so it must be checked after resolution at job creation. Here the parameter resolves
# to a non-numeric string and the run must fail.
#
# Companion to 3.3.1--amount-min-format-string-resolves-to-non-number.invalid.test.yaml.
# `min` and `max` carry different types in the spec, <nonnegativefloat> against
# <positivefloat>, so they are covered separately rather than assumed symmetric.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - FEATURE_BUNDLE_1
  name: TestJob
  parameterDefinitions:
  - name: CpuMax
    type: STRING
    default: "abc"
  steps:
  - name: Step1
    hostRequirements:
      amounts:
      - name: amount.worker.vcpu
        max: "{{Param.CpuMax}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RAN')
