# Action timeout is @fmtstring under FEATURE_BUNDLE_1 (Template Schemas §5) and
# Expression Language §1.3.2 requires a non-null expression value to reach it.
#
# Control for EXPR/jobs/expr1.3.2--timeout-null-drops-field.test.yaml: a
# computed 1-second timeout over a 10-second command. The markers are joined at
# run time because Windows logs the resolved command line at INFO and would
# otherwise match them.
#
# The action must start and then be killed: STARTED prints before the sleep,
# the task fails, and the second marker never prints. STARTED rules out a run
# that failed before the action ran (for example a template that does not
# validate), which would also fail the task.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - FEATURE_BUNDLE_1
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: UseTimeout
    type: BOOL
    default: true
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          timeout: "{{ 1 if Param.UseTimeout else null }}"
          command: python
          args:
          - -c
          - |
            import time
            print('STA' + 'RTED', flush=True)
            time.sleep(10)
            print('SHOULD_NOT' + '_PRINT')
expected:
  taskFailure: {}
  output:
  - STARTED
  forbidden:
  - SHOULD_NOT_PRINT
