# Spec 1.1.1 <JobName> with FEATURE_BUNDLE_1: max length 512 characters,
# checked after the format string is resolved. The name resolves to 513
# characters via {{Param.N}}, so job creation must fail.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - FEATURE_BUNDLE_1
  name: "{{Param.N}}"
  parameterDefinitions:
  - name: N
    type: STRING
    default: ""
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - "-c"
          - "print()"
