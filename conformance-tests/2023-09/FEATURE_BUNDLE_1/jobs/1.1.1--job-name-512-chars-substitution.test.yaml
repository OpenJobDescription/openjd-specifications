# Spec 1.1.1 <JobName> with FEATURE_BUNDLE_1: max length 512 characters,
# checked after the format string is resolved. The name resolves to 512
# characters via {{Param.N}} and must be accepted. The task prints the
# resolved length so a job-creation failure cannot be reported as a pass.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - FEATURE_BUNDLE_1
  name: "{{Param.N}}"
  parameterDefinitions:
  - name: N
    type: STRING
    default: ""
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - "-c"
          - "print('OUTPUT:' + str(len(r'{{Param.N}}')))"
expected:
  output:
  - OUTPUT:512
