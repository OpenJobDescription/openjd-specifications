# Template Schemas §3.3.1 and §7.5: an amount's min and max written as Format Strings are a <nonnegativefloatstring>
# and a <positivefloatstring>, so white space around the number they resolve to is ignored and job creation succeeds.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - FEATURE_BUNDLE_1
  name: TestJob
  parameterDefinitions:
  - name: Min
    type: STRING
  - name: Max
    type: STRING
  steps:
  - name: Step1
    hostRequirements:
      amounts:
      - name: amount.custom.licenses
        min: "{{Param.Min}}"
        max: "{{Param.Max}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'RESULT:created')
parameters:
  Min: " 1 "
  Max: "\t2.5 "
expected:
  output:
  - RESULT:created
