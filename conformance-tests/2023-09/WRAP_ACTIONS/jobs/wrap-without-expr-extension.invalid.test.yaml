# RFC 0008: WRAP_ACTIONS has a hard prerequisite on EXPR. A template that
# lists WRAP_ACTIONS without EXPR must be rejected.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapWithoutExpr
  extensions:
  - WRAP_ACTIONS
  jobEnvironments:
  - name: WrapEnv
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('enter')"]
        onWrapEnvEnter:
          command: python
          args: ["-c", "print('wrap-enter')"]
        onWrapTaskRun:
          command: python
          args: ["-c", "print('wrap-task')"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print('wrap-exit')"]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK')"]
