# An environment template that uses wrap hooks without declaring the
# WRAP_ACTIONS extension must be rejected by the runtime.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapWithoutExtension
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('SHOULD_NOT_RUN')"]

environments:
- specificationVersion: environment-2023-09
  # NOTE: the WRAP_ACTIONS extension is deliberately NOT declared.
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args: ["-c", "print('wrap-enter')"]
        onWrapTaskRun:
          command: python
          args: ["-c", "print('SHOULD_NOT_RUN')"]
        onWrapEnvExit:
          command: python
          args: ["-c", "print('wrap-exit')"]
