template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'HALF_EVEN:{{ round(2.5) }}')
            print(r'HALF_EVEN2:{{ round(3.5) }}')
            print(r'NEG_HALF_EVEN:{{ round(-2.5) }}')
            print(r'NEG_HALF_EVEN2:{{ round(-3.5) }}')
            print(r'DIGITS:{{ round(3.14159, 2) }}')
            print(r'TRAILING:{{ round(3.495, 2) }}')
            print(r'TENS:{{ round(1234.5, -1) }}')
            print(r'HUNDREDS:{{ round(1250.0, -2) }}')
            print(r'ZERO_NDIGITS:{{ round(3.7, 0) }}')
            print(r'INT_NDIGITS:{{ round(5, 2) }}')
expected:
  output:
  - HALF_EVEN:2
  - HALF_EVEN2:4
  - NEG_HALF_EVEN:-2
  - NEG_HALF_EVEN2:-4
  - DIGITS:3.14
  - TRAILING:3.50
  - TENS:1230
  - HUNDREDS:1200
  - ZERO_NDIGITS:4
  - INT_NDIGITS:5
