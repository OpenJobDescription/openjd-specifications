template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'from_literal = path([])'
    - 'joined = path([]) / "a"'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'LITERAL:{{ from_literal }}')
            print(r'JOINED:{{ joined }}')
            print(r'EQ:{{ path([]) == path(".") }}')
expected:
  output:
  - LITERAL:.
  - JOINED:a
  - EQ:true
