# Expression Language §2.2.6: no POSIX shell word can hold a NUL character, so
# repr_sh of a string containing U+0000 is an evaluation error.
#
# The NUL is appended to a parameter value so the expression can't be folded
# when the template is checked, and the error comes from evaluating repr_sh
# when the job is created. Only the length of the result reaches the action, so an
# implementation that doesn't reject the NUL runs the job to success, and the
# test fails, rather than failing later because a NUL reached the command line.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: S
    type: STRING
    default: a
  steps:
  - name: Step1
    let:
    - 'q = len(repr_sh(Param.S + "\x00"))'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - import sys; print(sys.argv[1])
          - '{{ q }}'
