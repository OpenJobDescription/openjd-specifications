runOn: [windows]
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Paths
    type: LIST[PATH]
    default: ["renders\\a.exr", "renders\\b.exr"]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Path
        type: PATH
        range: "{{RawParam.Paths}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'LEN:{{ len(Param.Paths) }}')
            print(r'PATHS:{{ Param.Paths }}')
            print(r'RAW:{{ RawParam.Paths }}')
            print(r'TASK:{{ Task.Param.Path }}')
            print(r'TASK_RAW:{{ Task.RawParam.Path }}')
            print(r'TASK_STEM:{{ Task.Param.Path.stem }}')
expected:
  output:
  - LEN:2
  - "RAW:[\"renders\\\\a.exr\", \"renders\\\\b.exr\"]"
  - "PATHS:[\"renders\\\\a.exr\", \"renders\\\\b.exr\"]"
  - "TASK:renders\\a.exr"
  - "TASK:renders\\b.exr"
  - "TASK_RAW:renders\\a.exr"
  - "TASK_RAW:renders\\b.exr"
  - "TASK_STEM:a"
  - "TASK_STEM:b"
