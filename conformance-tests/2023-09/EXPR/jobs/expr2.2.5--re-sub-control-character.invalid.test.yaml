# conformance: xfail(py, reason="openjd-cli 0.8.0 accepts a re_sub replacement with a control character; fixed in openjd-rs#570 (unreleased, after openjd-expr 0.17)")
# Expression Language §2.2.5 and §1.1.5: a group reference written in a non-raw string,
# '\1', decodes to U+0001, and re_sub rejects a replacement that contains a control
# character. Without that rule the replacement would silently insert an invisible U+0001.
# expr2.2.5--re-sub-tab-newline is the accepted side: tab, newline and carriage return.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ repr_py(re_sub('a1', '(\d)', '\1')) }}|")
