template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'ARITH:{{ 1 +
                2 +
                3 }}')
            print(r'COND:{{ "high"
                if 90 > 80
                else "low" }}')
            print(r'COMP:{{ [
                x * 2
                for x in [1, 2, 3]
                if x > 1
            ] }}')
expected:
  output:
  - ARITH:6
  - COND:high
  - "COMP:[4, 6]"
