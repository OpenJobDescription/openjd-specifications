# conformance: xfail(rs, reason="openjd-cli 0.7.2 (crates.io) rejects a 4096-character command; fixed on openjd-rs main, unreleased", strict=false)
# Template Schemas §5.1 <CommandString>: "Maximum length: There is no maximum string length imposed by this
# specification." The command field below is exactly 4096 characters long: a format string whose expression
# resolves to `echo` (the padding literal is sliced to the empty string, so it contributes only length). The
# template must pass validation, and the job must run: the resolved command is `echo`, and the 4096-character
# template field never reaches the operating system, whose own command-line limits apply only to resolved values.
# The expression needs the EXPR extension for string concatenation and slicing; the length rule itself is base
# specification.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: CommandLength4096
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: "{{ 'echo' + ''[0:0] }}"
          args: ["COMMAND_LENGTH_4096_OK"]
expected:
  output:
  - "COMMAND_LENGTH_4096_OK"
