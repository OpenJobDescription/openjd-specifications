template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'POSIX_MAPPED:{{ apply_path_mapping("/mnt/shared/project/scene.exr") }}')
            print(r'POSIX_UNMAPPED:{{ apply_path_mapping("/other/path/file.txt") }}')
            print(r'WIN_MAPPED:{{ apply_path_mapping("D:\\assets\\textures\\wood.png") }}')
            print(r'WIN_UNMAPPED:{{ apply_path_mapping("E:\\other\\file.txt") }}')
pathMapping:
  - source_path_format: POSIX
    source_path: /mnt/shared
    destination_path: /local/cache
  - source_path_format: WINDOWS
    source_path: "D:\\assets"
    destination_path: /data/assets
expected:
  output_posix:
  - POSIX_MAPPED:/local/cache/project/scene.exr
  - POSIX_UNMAPPED:/other/path/file.txt
  - WIN_MAPPED:/data/assets/textures/wood.png
  - "WIN_UNMAPPED:E:\\other\\file.txt"
  output_windows:
  - POSIX_MAPPED:\local\cache\project\scene.exr
  - POSIX_UNMAPPED:\other\path\file.txt
  - WIN_MAPPED:\data\assets\textures\wood.png
  - WIN_UNMAPPED:E:\other\file.txt
