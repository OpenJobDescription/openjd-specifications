template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'STR:{{ range_expr("1-3") }}')
            print(r'LIST:{{ range_expr([1, 2, 3]) }}')
            print(r'STEP:{{ range_expr("1-9:2") }}')
            print(r'DESC:{{ range_expr("5-1:-1") }}')
            print(r'VALUES:{{ range_expr("2,6,9") }}')
            print(r'MIXED:{{ range_expr("1-3,10,20-22") }}')
            print(r'COMPLEX:{{ range_expr("100,-1--2:-1,3-5,9,8,7,12") }}')
expected:
  output:
  - "STR:1-3"
  - "LIST:1-3"
  - "STEP:1-9:2"
  - "DESC:1-5"
  - "VALUES:2,6,9"
  - "MIXED:1-3,10,20-22"
  - "COMPLEX:-2,-1,3-5,7-9,12,100"
