# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# A null element is dropped, so the range is a, c.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Skip
    type: BOOL
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: STRING
        range:
        - a
        - "{{ null if Param.Skip else 'b' }}"
        - c
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Skip: "true"
expected:
  output:
  - 'TASK:X=[a]'
  - 'TASK:X=[c]'
  forbidden:
  - 'TASK:X=[b]'
  - 'TASK:X=[]'
