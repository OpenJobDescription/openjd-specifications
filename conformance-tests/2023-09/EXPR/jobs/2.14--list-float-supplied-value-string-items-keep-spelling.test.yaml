# Template Schemas §2.14 and §7.5, Expression Language §1.3.4: an item of a LIST[FLOAT] value given as a string is a
# <floatstring>. White space around the number is ignored, and the item keeps the text it was written with, so
# " 1.00 " resolves to 1.00 and "2.50" to 2.50, while a computed value uses the shortest form.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Scales
    type: LIST[FLOAT]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'FIRST:{{ Param.Scales[0] }} SECOND:{{ Param.Scales[1] }}')
            print(r'SUM:{{ Param.Scales[0] + Param.Scales[1] }}')
parameters:
  Scales: [" 1.00 ", "2.50"]
expected:
  output:
  - FIRST:1.00 SECOND:2.50
  - SUM:3.5
