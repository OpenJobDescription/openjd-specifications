# Expression Language §1.3.4: a FLOAT Job Parameter value given as a number, and a number item of a LIST[FLOAT] value,
# has no original string representation, so it is written as Python's repr(float) writes it.
# Each exponent is written with a decimal point and a signed exponent (1.0e+20) so that a YAML 1.1 reader also reads
# it as a number.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: V
    type: FLOAT
  - name: W
    type: FLOAT
  - name: Scales
    type: LIST[FLOAT]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'V:{{ Param.V }} W:{{ Param.W }} LIST:{{ Param.Scales }}')
parameters:
  V: 2
  W: 0.00001
  Scales: [2, 1.0e+20]
expected:
  output:
  - 'V:2.0 W:1e-05 LIST:[2.0, 1e+20]'
