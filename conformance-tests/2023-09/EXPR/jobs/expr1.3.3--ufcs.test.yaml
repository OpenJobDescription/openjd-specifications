template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'func_upper = upper("hello")'
    - 'method_upper = "hello".upper()'
    - 'chained = "a,b,c".split(",").join(";")'
    # Use path() in let binding to test UFCS property access without
    # preprocess_job_parameters PATH resolution issues on Windows.
    - 'file = path("/projects/shot01/render.exr")'
    - 'prop = file.stem'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'FUNC:{{ func_upper }}')
            print(r'METHOD:{{ method_upper }}')
            print(r'CHAINED:{{ chained }}')
            print(r'PROP:{{ prop }}')
expected:
  output:
  - FUNC:HELLO
  - METHOD:HELLO
  - "CHAINED:a;b;c"
  - PROP:render
