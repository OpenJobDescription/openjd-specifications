# Floats are 64-bit IEEE 754 and subject to standard binary floating-point
# precision: "0.1 + 0.2 produces 0.30000000000000004, not 0.3" — the spec's
# own worked example (Expression Language §1.3.4). An implementation using
# decimal arithmetic would produce 0.3 and fail all three SUM assertions.
# Also pins that values near the maximum finite double (1e308) are accepted
# and usable.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SUM:{{ 0.1 + 0.2 }}')
            print(r'SUM_EQ_EXACT:{{ 0.1 + 0.2 == 0.30000000000000004 }}')
            print(r'SUM_NEQ_POINT3:{{ 0.1 + 0.2 == 0.3 }}')
            print(r'BIG_LIT:{{ 1e308 }}')
            print(r'BIG_CMP:{{ 1e308 > 1e307 }}')
expected:
  output:
  - "SUM:0.30000000000000004"
  - "SUM_EQ_EXACT:true"
  - "SUM_NEQ_POINT3:false"
  - "BIG_LIT:1e308"
  - "BIG_CMP:true"
