template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'INT:{{ reversed([3, 1, 2]) }}')
            print(r'STR:{{ reversed(["c", "a", "b"]) }}')
            print(r'SINGLE:{{ reversed([42]) }}')
            print(r'NESTED:{{ reversed([[1], [], [1, 3, 5]]) }}')
            print(r'EMPTY:{{ reversed([]) }}')
expected:
  output:
  - "INT:[2, 1, 3]"
  - 'STR:["b", "a", "c"]'
  - "SINGLE:[42]"
  - "NESTED:[[1, 3, 5], [], [1]]"
  - "EMPTY:[]"
