template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'DOT:{{ re_escape("file.exr") }}')
            print(r'BRACKETS:{{ re_escape("file[1].txt") }}')
expected:
  output:
  - DOT:file\.exr
  - BRACKETS:file\[1\]\.txt
