template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'FIND:[{{ find("hello", "ell") }}]')
            print(r'FIND_MISS:[{{ find("hello", "xyz") }}]')
            print(r'RFIND:[{{ rfind("abcabc", "bc") }}]')
            print(r'RFIND_MISS:[{{ rfind("hello", "xyz") }}]')
            print(r'INDEX:[{{ index("hello", "ell") }}]')
            print(r'RINDEX:[{{ rindex("abcabc", "bc") }}]')
expected:
  output:
  - FIND:[1]
  - FIND_MISS:[-1]
  - RFIND:[4]
  - RFIND_MISS:[-1]
  - INDEX:[1]
  - RINDEX:[4]
