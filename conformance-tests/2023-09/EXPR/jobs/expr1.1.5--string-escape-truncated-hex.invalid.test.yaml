# Expression Language §1.1.5: \x takes exactly 2 hex digits, so \x4 followed by a non-hex
# character is a syntax error.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ len('\x4g') }}|")
