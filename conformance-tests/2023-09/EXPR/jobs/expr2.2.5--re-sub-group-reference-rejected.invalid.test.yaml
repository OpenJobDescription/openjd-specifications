# Expression Language §2.2.5: re_sub's repl string "is literal text — group
# references (\1, \g<1>, $1, ${1}) are not supported and are errors."
# This is spec-explicit rejection, not merely undefined behaviour.
#
# DIALECT-DIVERGENCE PROBE, Python-style form (\1): Python's re.sub expands
# \1, so an implementation that forwards repl unchecked to a Python engine
# would EXPAND it instead of erroring. The Rust-style form ($1) has its own
# fixture (expr2.2.5--re-sub-dollar-group-reference-rejected): bundling
# both into one abort-on-first-error template would leave the second form
# unpinned. openjd-rs rejects with:
# "Group references in replacement strings are not supported".
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'backslash_ref = re_sub("frame_001", r"(\d+)", r"\1\1")'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'BS:{{ backslash_ref }}')
