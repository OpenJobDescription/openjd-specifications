template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: "1-5:2,10,20-18:-1"
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: INT
        range: "{{Param.Frames}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'FRAME:{{ Task.Param.Frame }}')
expected:
  output:
  - FRAME:1
  - FRAME:3
  - FRAME:5
  - FRAME:10
  - FRAME:18
  - FRAME:19
  - FRAME:20
