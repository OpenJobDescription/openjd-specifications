template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    # TEMPLATE scope for cross-platform POSIX path semantics (Expression Language §2.3.2)
    let:
    - 'p = path("/data/backup.tar.gz")'
    - 'psuffix = p.suffix'
    - 'psuffixes = p.suffixes'
    - 'pstem = p.stem'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SUFFIX:{{ psuffix }}')
            print(r'SUFFIXES:{{ psuffixes }}')
            print(r'STEM:{{ pstem }}')
expected:
  output:
  - SUFFIX:.gz
  - 'SUFFIXES:[".tar", ".gz"]'
  - STEM:backup.tar
