# Template Schemas §2.16 and §7.5: an integer in an inner list of a LIST[LIST[INT]] value given as a string is an
# <intstring>, so white space around the number is ignored.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Matrix
    type: LIST[LIST[INT]]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'MATRIX:{{ Param.Matrix }}')
            print(r'ELEM:{{ Param.Matrix[0][1] + 1 }}')
parameters:
  Matrix: [[1, " 2 "], ["3"]]
expected:
  output:
  - "MATRIX:[[1, 2], [3]]"
  - ELEM:3
