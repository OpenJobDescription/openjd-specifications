# round(int, ndigits) is exact, and a result outside the 64-bit signed range
# is an integer overflow error: 9223372036854775807 rounded to tens is
# 9223372036854775810. The value comes from a parameter, so the error fires
# when the job is evaluated.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: I
    type: INT
    default: 9223372036854775807
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'{{ round(Param.I, -1) }}')
