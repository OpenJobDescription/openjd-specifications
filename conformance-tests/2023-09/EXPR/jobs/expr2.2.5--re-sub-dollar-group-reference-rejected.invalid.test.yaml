# Expression Language §2.2.5: re_sub's repl string "is literal text — group
# references (\1, \g<1>, $1, ${1}) are not supported and are errors."
#
# DIALECT-DIVERGENCE PROBE, Rust-style form ($1): Rust's
# regex::replace_all expands $1, so an implementation that forwards repl
# unchecked to a Rust engine would EXPAND it instead of erroring (a Python
# engine would pass it through literally — also a violation, of the
# must-error rule). The Python-style form (\1) has its own fixture
# (expr2.2.5--re-sub-group-reference-rejected); split so each dialect's
# rejection is independently pinned.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'dollar_ref = re_sub("frame_001", r"(\d+)", "$1$1")'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'DOLLAR:{{ dollar_ref }}')
