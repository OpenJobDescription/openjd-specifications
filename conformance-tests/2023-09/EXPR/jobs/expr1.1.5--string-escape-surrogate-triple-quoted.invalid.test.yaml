# Expression Language §1.1.5: a surrogate escape is a syntax error in a triple-quoted string too.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ len('''\ud800''') }}|")
