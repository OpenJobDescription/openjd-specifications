template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Steps
    type: INT
    default: 5
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Value
        type: FLOAT
        range: "{{ [float(x) / Param.Steps for x in range(Param.Steps + 1)] }}"
    script:
      let:
      - padded = zfill(round(Task.Param.Value, 1), 5)
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'V:{{ padded }}')
expected:
  output:
  - "V:000.0"
  - "V:000.2"
  - "V:000.4"
  - "V:000.6"
  - "V:000.8"
  - "V:001.0"
