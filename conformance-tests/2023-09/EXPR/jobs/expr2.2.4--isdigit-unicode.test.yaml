# Expression Language section 2.2.4 defines isdigit(s) as "True if all
# characters are digits and string is non-empty". The classification functions
# carry Python str semantics (#177), so a Unicode decimal digit is a digit.
#
# isdigit over U+0663 ARABIC-INDIC DIGIT THREE and U+0969 DEVANAGARI DIGIT
# THREE, written as \uXXXX escapes so this file stays ASCII.
#
# Both are category Nd and must return true. An implementation that tests only
# ASCII 0-9 returns false for both, as openjd-rs did before openjd-rs#341.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'ISDIGIT_ARABIC:[{{ isdigit("\u0663") }}]')
            print(r'ISDIGIT_DEVANAGARI:[{{ isdigit("\u0969") }}]')
expected:
  output:
  - ISDIGIT_ARABIC:[true]
  - ISDIGIT_DEVANAGARI:[true]
