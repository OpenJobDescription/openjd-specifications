template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'STRIP:[{{ strip("  hi  ") }}]')
            print(r'LSTRIP:[{{ lstrip("  hi  ") }}]')
            print(r'RSTRIP:[{{ rstrip("  hi  ") }}]')
expected:
  output:
  - STRIP:[hi]
  - "LSTRIP:[hi  ]"
  - "RSTRIP:[  hi]"
