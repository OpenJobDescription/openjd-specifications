# conformance: xfail(rs, reason="openjd-cli 0.7.2 (crates.io) accepts a control character in a re_sub result; fixed on openjd-rs main, unreleased", strict=false)
# conformance: xfail(py, reason="openjd-cli 0.8.0 accepts a re_sub replacement with a control character, no match; fixed in openjd-rs#570 (unreleased, after openjd-expr 0.17)")
# Expression Language §2.2.5: re_sub checks the replacement whether or not the pattern
# matches, so a control character in the replacement is an error even when nothing is
# replaced.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ repr_py(re_sub('abc', 'x', '\x01')) }}|")
