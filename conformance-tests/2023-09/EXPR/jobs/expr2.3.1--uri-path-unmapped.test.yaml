# URI path: unmapped URI retains URI format in host context (Expression Language §1.2.1)
# When no path mapping rule matches a URI, the path value keeps the original URI.
# Path operations use URI-aware parsing (no normalization, forward slashes).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: InputFile
    type: PATH
    default: "s3://my-bucket/assets/teapot.obj"
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'VALUE:{{ Param.InputFile }}')
            print(r'NAME:{{ Param.InputFile.name }}')
            print(r'STEM:{{ Param.InputFile.stem }}')
            print(r'SUFFIX:{{ Param.InputFile.suffix }}')
            print(r'PARENT:{{ Param.InputFile.parent }}')
            print(r'PARTS:{{ Param.InputFile.parts }}')
            print(r'WITH_SUFFIX:{{ Param.InputFile.with_suffix(".png") }}')
            print(r'JOIN:{{ Param.InputFile.parent / "other.obj" }}')
# No path mapping rules — URI passes through unmapped
expected:
  # URI format preserved identically on both platforms
  output:
  - "VALUE:s3://my-bucket/assets/teapot.obj"
  - "NAME:teapot.obj"
  - "STEM:teapot"
  - "SUFFIX:.obj"
  - "PARENT:s3://my-bucket/assets"
  - 'PARTS:["s3://my-bucket", "assets", "teapot.obj"]'
  - "WITH_SUFFIX:s3://my-bucket/assets/teapot.png"
  - "JOIN:s3://my-bucket/assets/other.obj"
