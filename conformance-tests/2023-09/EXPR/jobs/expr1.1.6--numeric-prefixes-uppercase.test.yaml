# Unasserted rows of the numeric and string literal tables (Expression
# Language §1.1.5, §1.1.6): uppercase 0X/0O/0B prefixes, the uppercase R raw
# string prefix, the explicitly-valid literal 00, and 1e10 producing a float.
# The EXPFLOAT assertion discriminates float from int: float pass-through
# (§1.3.4) preserves the literal text "1e10", while an implementation lexing
# it as an int would print 10000000000.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'HEXU:{{ 0X2A }}')
            print(r'OCTU:{{ 0O52 }}')
            print(r'BINU:{{ 0B101010 }}')
            print(r'ZEROZERO:{{ 00 }}')
            print(r'EXPFLOAT:{{ 1e10 }}')
            print(r'EXPFLOAT_EQ:{{ 1e10 == 10000000000.0 }}')
            print(r'RAWU:{{ R"a\nb" }}')
expected:
  output:
  - "HEXU:42"
  - "OCTU:42"
  - "BINU:42"
  - "ZEROZERO:0"
  - "EXPFLOAT:1e10"
  - "EXPFLOAT_EQ:true"
  - 'RAWU:a\nb'
