# Template Schemas §3.4.1.1.1 (canonical form, informative note): a range expression with very many values has a
# short canonical form, and an implementation computes it from the elements without listing the values. B0, B3, and
# B4 each have more than 10^18 values. B1 and B2 use values near the 64-bit limits (-9223372036854775807 and
# 9223372036854775807), where the difference between two consecutive values does not fit in 64 bits.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"""B0:[{{ string(range_expr("0-4000000000000000000:2,4000000000000000001")) }}]""")
            print(r"""B1:[{{ string(range_expr("-9223372036854775807,9223372036854775807")) }}]""")
            print(r"""B2:[{{ string(range_expr("-9223372036854775807--9223372036854775806,9223372036854775806-9223372036854775807")) }}]""")
            print(r"""B3:[{{ string(range_expr("1-3000000000000000000,3000000000000000001-6000000000000000000")) }}]""")
            print(r"""B4:[{{ string(range_expr("1,3,5-9000000000000000000:2")) }}]""")
expected:
  output:
  - 'B0:[0-4000000000000000000:2,4000000000000000001]'
  - 'B1:[-9223372036854775807,9223372036854775807]'
  - 'B2:[-9223372036854775807,-9223372036854775806,9223372036854775806,9223372036854775807]'
  - 'B3:[1-6000000000000000000]'
  - 'B4:[1-8999999999999999999:2]'
