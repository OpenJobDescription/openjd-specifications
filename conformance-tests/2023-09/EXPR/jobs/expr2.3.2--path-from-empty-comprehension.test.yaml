# conformance: xfail(py, reason="openjd-cli 0.8.0 rejects path() of an empty list as path(list[nulltype]); fixed in openjd-rs#576 (unreleased, after openjd-expr 0.17)")
# Each printed value ends with '|', so an output line can't pass by matching a prefix.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Items
    type: LIST[STRING]
    default: ["a", "b"]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Keep
        type: STRING
        range: ["none"]
    let:
    - 'from_filtered = path([s for s in Param.Items if False])'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'FILTERED:{{ from_filtered }}|')
            print(r'TASK_FILTER:{{ path([s for s in Param.Items if s == Task.Param.Keep]) }}|')
            print(r'TASK_JOINED:{{ path([s for s in Param.Items if s == Task.Param.Keep]) / "a" }}|')
expected:
  output:
  - FILTERED:.|
  - TASK_FILTER:.|
  - TASK_JOINED:a|
