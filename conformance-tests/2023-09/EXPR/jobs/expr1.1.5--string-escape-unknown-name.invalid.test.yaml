# Expression Language §1.1.5: \N{name} with a name that is not a Unicode character name or
# name alias is a syntax error.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ len('\N{NOT A CHARACTER NAME}') }}|")
