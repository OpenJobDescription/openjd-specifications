template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'str_val = repr_py("hello")'
    - 'int_val = repr_py(42)'
    - 'float_val = repr_py(3.14)'
    - 'bool_t = repr_py(true)'
    - 'bool_f = repr_py(false)'
    - 'null_val = repr_py(null)'
    - 'list_val = repr_py([1, 2])'
    - 'path_val = repr_py(path("/tmp/out"))'
    - "range_val = repr_py(range_expr(\"1-10\"))"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"STR:{{ str_val }}")
            print(r"INT:{{ int_val }}")
            print(r"FLOAT:{{ float_val }}")
            print(r"BOOL_T:{{ bool_t }}")
            print(r"BOOL_F:{{ bool_f }}")
            print(r"NULL:{{ null_val }}")
            print(r"LIST:{{ list_val }}")
            print(r"PATH:{{ path_val }}")
            print(r"RANGE:{{ range_val }}")
expected:
  output:
  - "STR:'hello'"
  - INT:42
  - FLOAT:3.14
  - BOOL_T:True
  - BOOL_F:False
  - NULL:None
  - "LIST:[1, 2]"
  - "PATH:'/tmp/out'"
  - "RANGE:'1-10'"
