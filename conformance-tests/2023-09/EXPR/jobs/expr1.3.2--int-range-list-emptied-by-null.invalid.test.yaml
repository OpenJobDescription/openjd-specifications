# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# Template Schemas §3.4.1.1 requires at least one element. When every element is dropped, the range has none, so the
# job cannot be created.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Skip
    type: BOOL
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: INT
        range:
        - "{{ null if Param.Skip else 1 }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Skip: "true"
