template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'MATCH:{{ replace("hello", "l", "r") }}')
            print(r'NONE:{{ replace("hello", "xyz", "r") }}')
expected:
  output:
  - MATCH:herro
  - NONE:hello
