# Template Schemas §3.4.1.1.1 (canonical form): two spellings of one list of values have the same canonical form,
# and the canonical form of the parse of a canonical form is the same string.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"""P0:[{{ string(range_expr("1,3,5,7,9")) == string(range_expr("1-9:2")) }}]""")
            print(r"""I0:[{{ string(range_expr(string(range_expr("1,3,5,7,9")))) }}]""")
            print(r"""P1:[{{ string(range_expr("19-18:-5,13-18")) == string(range_expr("13-19")) }}]""")
            print(r"""I1:[{{ string(range_expr(string(range_expr("19-18:-5,13-18")))) }}]""")
            print(r"""P2:[{{ string(range_expr("2,4,6,8,9,10")) == string(range_expr("10,9,8,2-6:2")) }}]""")
            print(r"""I2:[{{ string(range_expr(string(range_expr("2,4,6,8,9,10")))) }}]""")
            print(r"""P3:[{{ string(range_expr("1,3,4,5")) == string(range_expr("5,4,3,1")) }}]""")
            print(r"""I3:[{{ string(range_expr(string(range_expr("1,3,4,5")))) }}]""")
            print(r"""P4:[{{ string(range_expr("1-10:4")) == string(range_expr("9,5,1")) }}]""")
            print(r"""I4:[{{ string(range_expr(string(range_expr("1-10:4")))) }}]""")
expected:
  output:
  - 'P0:[true]'
  - 'I0:[1-9:2]'
  - 'P1:[true]'
  - 'I1:[13-19]'
  - 'P2:[true]'
  - 'I2:[2-8:2,9,10]'
  - 'P3:[true]'
  - 'I3:[1,3-5]'
  - 'P4:[true]'
  - 'I4:[1-9:4]'
