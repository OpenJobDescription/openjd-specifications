# 2.12: each default element is normalized before the within-directory check
# (2.2), so a/../../b escapes even though it does not begin with "..". The bad
# element is second, so checking only the first element does not reject this.
# The script prints a constant so the default is the only thing that can fail.

template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Paths
    type: LIST[PATH]
    default: ["inside/a.exr", "a/../../b"]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:success')
