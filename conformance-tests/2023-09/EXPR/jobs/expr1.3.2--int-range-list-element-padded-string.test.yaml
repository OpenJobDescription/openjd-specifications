# Expression Language §1.3.2, §1.3.12 and §1.2.3: with EXPR, an element that is exactly "{{<expr>}}" is coerced to
# its target type, and coercion from string ignores white space around the integer. The STRING value " 7 " is 7.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Text
    type: STRING
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: INT
        range:
        - 1
        - "{{ Param.Text }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Text: " 7 "
expected:
  output:
  - 'TASK:X=[1]'
  - 'TASK:X=[7]'
