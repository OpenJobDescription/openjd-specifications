# Template Schemas §2.10: without ENV_PARAMS, minLength and maxLength of a RANGE_EXPR are checked against the value as
# written only. "1-3:2" is 5 characters, at least minLength 4, so the Job runs although its canonical form "1,3" is
# shorter. ENV_PARAMS's 2.10--range-expr-min-length-canonical rejects the same Job in a document that lists ENV_PARAMS.
template:
  specificationVersion: jobtemplate-2023-09
  extensions: [EXPR]
  name: RangeExprMinLengthWrittenOnly
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    minLength: 4
  steps:
  - name: A
    parameterSpace:
      taskParameterDefinitions:
      - name: Frame
        type: INT
        range: "{{Param.Frames}}"
    script:
      actions:
        onRun:
          command: echo
          args: ["F{{Task.Param.Frame}}"]
parameters:
  Frames: "1-3:2"
expected:
  output:
  - F1
  - F3
