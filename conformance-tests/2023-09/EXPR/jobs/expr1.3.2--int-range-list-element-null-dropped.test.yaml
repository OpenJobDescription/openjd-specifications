# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# A null element is dropped, so the range is 1, 3.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Skip
    type: BOOL
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: INT
        range:
        - 1
        - "{{ null if Param.Skip else 2 }}"
        - 3
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Skip: "true"
expected:
  output:
  - 'TASK:X=[1]'
  - 'TASK:X=[3]'
  forbidden:
  - 'TASK:X=[2]'
  - 'TASK:X=[]'
