template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'TWO:{{ min(3, 1) }}')
            print(r'THREE:{{ min(3, 1, 2) }}')
            print(r'LIST:{{ min([5, 2, 8]) }}')
            print(r'RANGE:{{ min(range_expr("3-7")) }}')
            print(r'MIXED:{{ min(1, 2.5) }}')
expected:
  output:
  - TWO:1
  - THREE:1
  - LIST:2
  - RANGE:3
  - MIXED:1.0
