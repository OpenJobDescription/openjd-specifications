template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'simple = repr_sh("hello")'
    - 'spaces = repr_sh("hello world")'
    - "list_val = repr_sh([\"echo\", \"hello world\"])"
    - "squote_len = len(repr_sh(\"it's\"))"
    - 'empty = repr_sh("")'
    - 'path_val = repr_sh(path("/tmp/out"))'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SIMPLE:{{ simple }}')
            print("SPACES:{{ spaces }}")
            print("LIST:{{ list_val }}")
            print(r'SQUOTE_LEN:{{ squote_len }}')
            print("EMPTY:{{ empty }}")
            print("PATH:{{ path_val }}")
expected:
  output:
  - SIMPLE:hello
  - "SPACES:'hello world'"
  - "LIST:echo 'hello world'"
  # Python shlex.quote("it's") -> 'it'"'"'s' (10 chars)
  # Rust shlex::try_quote("it's") -> "it's" (6 chars)
  # Both are valid POSIX shell quoting
  - anyOf: ["SQUOTE_LEN:10", "SQUOTE_LEN:6"]
  - "EMPTY:''"
  - "PATH:/tmp/out"
