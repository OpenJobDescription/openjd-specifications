template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  jobEnvironments:
  - name: TestEnv
    script:
      let:
      - "greeting = 'hello'"
      actions:
        onEnter:
          command: python
          args:
          - -c
          - "print('openjd_env: GREETING={{ greeting }}')"
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - import os; print('ENV:' + os.environ.get('GREETING', ''))
expected:
  output:
  - ENV:hello
