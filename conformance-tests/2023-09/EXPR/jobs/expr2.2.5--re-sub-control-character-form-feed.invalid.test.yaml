# Expression Language §2.2.5: re_sub rejects a replacement that contains a control character,
# and only tab, newline and carriage return are exempt. Form feed (U+000C) is not.
# The rest of the template is valid; expr2.2.5--re-sub-tab-newline is the accepted side.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ repr_py(re_sub('a-b', '-', '\f')) }}|")
