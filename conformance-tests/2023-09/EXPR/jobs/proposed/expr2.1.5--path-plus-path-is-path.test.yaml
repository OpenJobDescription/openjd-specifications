# Expression Language 2.1.5: `__add__(p: path, suffix: string) -> path`
# appends a string to a path's last component, and a path argument coerces
# to a string parameter (1.2.3), so `path + path` is a path with path
# properties: `Param.Base + path("c.txt")` has name `bc.txt` and suffix
# `.txt`. (Param.Base's default is joined with the template directory, so
# only the last component is asserted.)
#
# Relies on `__add__(path, string)` being chosen over `__add__(string,
# string)`, which also matches after coercing both arguments; the spec has
# no overload-ranking rule (see README-fuzz-findings.md).
#
# openjd-rs types `path + path` as string during validation (through
# `__add__(string, string)`) while evaluation returns a path, so it rejects
# the template with "'suffix' property is not available for string" (found by
# fuzzing, openjd-rs#442).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Base
    type: PATH
    default: a/b
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'NAME:{{ (Param.Base + path("c.txt")).name }}')
            print(r'SUFFIX:{{ (Param.Base + path("c.txt")).suffix }}')
expected:
  output:
  - NAME:bc.txt
  - SUFFIX:.txt
