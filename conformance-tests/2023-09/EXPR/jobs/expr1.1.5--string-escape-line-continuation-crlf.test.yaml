# Expression Language §1.1.5: a backslash before a line break continues the line, and a line
# break is LF, CR LF or CR. YAML block scalars can't hold a CR, so each script is a
# double-quoted YAML string: "\\" is one backslash and "\r\n" is CR LF. Each value ends with
# '|' so an output line can't pass by matching a prefix.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - "print(r\"LF:{{ repr_py('ab\\\ncd') }}|\")\nprint(r\"CRLF:{{ repr_py('ab\\\r\ncd') }}|\")\nprint(r\"CR:{{ repr_py('ab\\\rcd') }}|\")\nprint(r\"CRLF_TRIPLE:{{ repr_py('''ab\\\r\ncd''') }}|\")\n"
expected:
  output:
  - LF:'abcd'|
  - CRLF:'abcd'|
  - CR:'abcd'|
  - CRLF_TRIPLE:'abcd'|
