# conformance: xfail(py, reason="openjd-cli 0.8.0 round(1e300, -1) returns a float instead of an integer overflow error; fixed in openjd-rs#567 (openjd-expr 0.17)")
# round() rounds the exact value of its input. 5e300 is stored above
# 5·10^300, so rounding it to a multiple of 10^301 gives 10^301, which is
# outside the 64-bit signed range: an integer overflow error, not 0. The value
# comes from a parameter, so the error fires when the job is evaluated.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: X
    type: FLOAT
    default: 5e300
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'{{ round(Param.X, -301) }}')
