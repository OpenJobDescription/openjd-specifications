template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'BOOL:[{{ repr_py(unique([True, False, True, False])) }}]')
            print(r'INT:[{{ repr_py(unique([3, 1, 2, 1, 3, 2])) }}]')
            print(r'FLOAT:[{{ repr_py(unique([1.5, 2.5, 1.5, 3.5])) }}]')
            print(r'STR:[{{ unique(["a", "b", "a", "c", "b"]).join(",") }}]')
            print(r"PATH:[{{ repr_py(unique([path('/a'), path('/b'), path('/a')])) }}]")
            print(r'RANGE_EXPR:[{{ len(unique([range_expr("1-3"), range_expr("4-6"), range_expr("1-3")])) }}]')
            print(r'LIST_INT:[{{ repr_py(unique([[1, 2], [3, 4], [1, 2]])) }}]')
            print(r"LIST_STR:[{{ repr_py(unique([['a'], ['b'], ['a']])) }}]")
            print(r'LIST_FLOAT:[{{ repr_py(unique([[1.0], [2.0], [1.0]])) }}]')
            print(r'LIST_BOOL:[{{ repr_py(unique([[True], [False], [True]])) }}]')
            print(r"LIST_PATH:[{{ repr_py(unique([[path('/a')], [path('/b')], [path('/a')]])) }}]")
            print(r'EMPTY:[{{ repr_py(unique([])) }}]')
            print(r'ALL_SAME:[{{ repr_py(unique([7, 7, 7])) }}]')
            print(r'METHOD:[{{ repr_py([1, 2, 1, 3, 2].unique()) }}]')
            print(r'CHAINED:[{{ repr_py([3, 1, 2, 1, 3].unique().sorted()) }}]')
expected:
  output:
  - "BOOL:[[True, False]]"
  - "INT:[[3, 1, 2]]"
  - "FLOAT:[[1.5, 2.5, 3.5]]"
  - STR:[a,b,c]
  - RANGE_EXPR:[2]
  - "LIST_INT:[[[1, 2], [3, 4]]]"
  - "LIST_STR:[[['a'], ['b']]]"
  - "LIST_FLOAT:[[[1.0], [2.0]]]"
  - "LIST_BOOL:[[[True], [False]]]"
  - "EMPTY:[[]]"
  - "ALL_SAME:[[7]]"
  - "METHOD:[[1, 2, 3]]"
  - "CHAINED:[[1, 2, 3]]"
  output_posix:
  - "PATH:[['/a', '/b']]"
  - "LIST_PATH:[[['/a'], ['/b']]]"
  output_windows:
  - "PATH:[['\\a', '\\b']]"
  - "LIST_PATH:[[['\\a'], ['\\b']]]"
