# Template Schemas §3.3.2.1: an allOf for attr.worker.os.family has at most one element. A list of format strings is
# valid at template validation and checked after resolution, when the Job is created. Here both items resolve to a
# value, so the allOf has two, and job creation must fail.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: A
    type: STRING
    default: linux
  - name: B
    type: STRING
    default: windows
  steps:
  - name: Step1
    hostRequirements:
      attributes:
      - name: attr.worker.os.family
        allOf: ["{{Param.A}}", "{{Param.B}}"]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print()
