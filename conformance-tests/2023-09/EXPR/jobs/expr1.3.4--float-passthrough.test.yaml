template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: V
    type: FLOAT
    default: "3.500"
  steps:
  - name: Step1
    let:
    - "from_let = 1.30"
    - "from_list = [1.70]"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'PARAM:{{Param.V}}')
            print(r'PARAM_CALC:{{Param.V + 1}}')
            print(r'LET:{{from_let}}')
            print(r'LIST_IDX:{{from_list[0]}}')
            print(r'IF_TRUE:{{Param.V if true else 0.0}}')
            print(r'IF_FALSE:{{0.0 if false else Param.V}}')
expected:
  output:
  - PARAM:3.500
  - PARAM_CALC:4.5
  - LET:1.30
  - LIST_IDX:1.70
  - IF_TRUE:3.500
  - IF_FALSE:3.500
