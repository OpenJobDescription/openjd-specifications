# Template Schemas §2.14 and §7.5, Expression Language §1.3.4: an item of a LIST[FLOAT] default may be a
# <floatstring>, as a scalar FLOAT default may. White space around the number is ignored, and the item keeps the text
# it was written with, so "2.50" resolves to 2.50 and " 3.250 " to 3.250. The number item 1.50 is checked through a
# computed value, which uses the shortest form whatever text the template's number had.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Scales
    type: LIST[FLOAT]
    default: [1.50, "2.50", " 3.250\t"]
    item:
      minValue: " 0.5"
      maxValue: "9.5 "
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SECOND:{{ Param.Scales[1] }} THIRD:{{ Param.Scales[2] }}')
            print(r'DOUBLE_FIRST:{{ Param.Scales[0] * 2 }}')
expected:
  output:
  - SECOND:2.50 THIRD:3.250
  - DOUBLE_FIRST:3.0
