# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# For a PATH range list, a null element is dropped and a list is flattened into one element per member.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Skip
    type: BOOL
  - name: Names
    type: LIST[STRING]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: PATH
        range:
        - a
        - "{{ null if Param.Skip else 'b' }}"
        - "{{ Param.Names }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.RawParam.X}}]')
parameters:
  Skip: "true"
  Names: [c, d]
expected:
  output:
  - 'TASK:X=[a]'
  - 'TASK:X=[c]'
  - 'TASK:X=[d]'
  forbidden:
  - 'TASK:X=[b]'
  - 'TASK:X=[]'
  - 'TASK:X=[null]'
  - 'TASK:X=[None]'
  - 'TASK:X=[["c", "d"]]'
