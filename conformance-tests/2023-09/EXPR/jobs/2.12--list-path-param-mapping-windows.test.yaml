runOn: [windows]
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Paths
    type: LIST[PATH]
    default: ["D:\\shared\\a.exr", "D:\\shared\\b.exr"]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Path
        type: PATH
        range: "{{RawParam.Paths}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'RAW:{{ RawParam.Paths }}')
            print(r'MAPPED:{{ Param.Paths }}')
            print(r'TASK_MAPPED:{{ Task.Param.Path }}')
            print(r'TASK_RAW:{{ Task.RawParam.Path }}')
pathMapping:
  - source_path_format: WINDOWS
    source_path: "D:\\shared"
    destination_path: "E:\\cache"
expected:
  output:
  - "RAW:[\"D:\\shared\\a.exr\", \"D:\\shared\\b.exr\"]"
  - "MAPPED:[\"E:\\cache\\a.exr\", \"E:\\cache\\b.exr\"]"
  - "TASK_MAPPED:E:\\cache\\a.exr"
  - "TASK_MAPPED:E:\\cache\\b.exr"
  - "TASK_RAW:D:\\shared\\a.exr"
  - "TASK_RAW:D:\\shared\\b.exr"
