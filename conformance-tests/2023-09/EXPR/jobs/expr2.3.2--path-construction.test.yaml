template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'from_str = path("/a/b")'
    - 'from_parts = path(["a", "b", "c"])'
    - 'from_abs_parts = path(["/", "usr", "local"])'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'STR:{{ from_str }}')
            print(r'PARTS:{{ from_parts }}')
            print(r'ABS_PARTS:{{ from_abs_parts }}')
expected:
  output_posix:
  - STR:/a/b
  - PARTS:a/b/c
  - ABS_PARTS:/usr/local
  output_windows:
  - STR:\a\b
  - PARTS:a\b\c
  - ABS_PARTS:\usr\local
