template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Scales
    type: LIST[FLOAT]
    default: [0.5, 1.0, 2.0]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: Scale
        type: FLOAT
        range: "{{Param.Scales}}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'TASK:{{ Task.Param.Scale }}')
expected:
  output:
  - TASK:0.5
  - TASK:1.0
  - TASK:2.0
