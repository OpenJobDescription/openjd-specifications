# conformance: xfail(py, reason="openjd-cli 0.8.0 round(x, 0) returns float, so int-only uses fail; fixed in openjd-rs#567 (openjd-expr 0.17), not in openjd-model")
# round(x, ndigits) with ndigits <= 0 returns int, so its result can be used
# where only an int is accepted: string repetition and range().
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: X
    type: FLOAT
    default: 1234.5
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'REPEAT:{{ 'ab' * round(1.5, 0) }}|')
            print(r'RANGE:{{ len(range(round(Param.X, -3))) }}|')
expected:
  output:
  - REPEAT:abab|
  - RANGE:1000|
