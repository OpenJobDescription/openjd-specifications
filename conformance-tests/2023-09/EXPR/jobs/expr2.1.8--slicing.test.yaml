template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: "1-5"
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'LSLICE:{{ [10, 20, 30, 40, 50][1:4] }}')
            print(r'REV:{{ [1, 2, 3][::-1] }}')
            print(r'SSLICE:{{ "hello"[1:4] }}')
            print(r'RSLICE:{{ Param.Frames[1:3] }}')
            print(r'RREV:{{ Param.Frames[::-1] }}')
expected:
  output:
  - "LSLICE:[20, 30, 40]"
  - "REV:[3, 2, 1]"
  - SSLICE:ell
  - "RSLICE:2,3"
  - "RREV:[5, 4, 3, 2, 1]"
