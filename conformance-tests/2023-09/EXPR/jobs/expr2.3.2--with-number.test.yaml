template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'digits = with_number(path("/out/file_003.exr"), 72)'
    - 'printf_bare = with_number(path("/out/file_%d.exr"), 72)'
    - 'printf_pad = with_number(path("/out/file_%04d.exr"), 72)'
    - 'hash4 = with_number(path("/out/file_####.exr"), 72)'
    - 'hash6 = with_number(path("/out/file_######.exr"), 72)'
    - 'overflow = with_number(path("/out/file_###.exr"), 10000)'
    - 'no_pattern = with_number(path("/out/render.exr"), 72)'
    - "str_variant = with_number(\"file_003.exr\", 72)"
    - 'neg_digits = with_number(path("/out/file_003.exr"), -1)'
    - 'neg_printf = with_number(path("/out/file_%04d.exr"), -1)'
    - 'neg_hash = with_number(path("/out/file_####.exr"), -1)'
    - 'multi_ext = with_number(path("/out/render.0001.exr"), 72)'
    - 'vfx_version = with_number(path("/out/file.v2.003.exr"), 72)'
    - 'dot_only = with_number(path("/out/file.001"), 72)'
    - 'mixed_hash_after_printf = with_number(path("/out/f_%d_abc_###.exr"), 42)'
    - 'mixed_digits_after_printf = with_number(path("/out/file_%04d_003.exr"), 72)'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'DIGITS:{{ digits }}')
            print(r'PRINTF_BARE:{{ printf_bare }}')
            print(r'PRINTF_PAD:{{ printf_pad }}')
            print(r'HASH4:{{ hash4 }}')
            print(r'HASH6:{{ hash6 }}')
            print(r'OVERFLOW:{{ overflow }}')
            print(r'NO_PATTERN:{{ no_pattern }}')
            print(r'STR:{{ str_variant }}')
            print(r'NEG_DIGITS:{{ neg_digits }}')
            print(r'NEG_PRINTF:{{ neg_printf }}')
            print(r'NEG_HASH:{{ neg_hash }}')
            print(r'MULTI_EXT:{{ multi_ext }}')
            print(r'VFX_VERSION:{{ vfx_version }}')
            print(r'DOT_ONLY:{{ dot_only }}')
            print(r'MIXED_HP:{{ mixed_hash_after_printf }}')
            print(r'MIXED_DP:{{ mixed_digits_after_printf }}')
expected:
  output:
  - STR:file_072.exr
  output_posix:
  - DIGITS:/out/file_072.exr
  - PRINTF_BARE:/out/file_72.exr
  - PRINTF_PAD:/out/file_0072.exr
  - HASH4:/out/file_0072.exr
  - HASH6:/out/file_000072.exr
  - OVERFLOW:/out/file_10000.exr
  - NO_PATTERN:/out/render_0072.exr
  - NEG_DIGITS:/out/file_-01.exr
  - NEG_PRINTF:/out/file_-001.exr
  - NEG_HASH:/out/file_-001.exr
  - MULTI_EXT:/out/render.0072.exr
  - VFX_VERSION:/out/file.v2.072.exr
  - DOT_ONLY:/out/file_0072.001
  - "MIXED_HP:/out/f_%d_abc_042.exr"
  - "MIXED_DP:/out/file_%04d_072.exr"
  output_windows:
  - DIGITS:\out\file_072.exr
  - PRINTF_BARE:\out\file_72.exr
  - PRINTF_PAD:\out\file_0072.exr
  - HASH4:\out\file_0072.exr
  - HASH6:\out\file_000072.exr
  - OVERFLOW:\out\file_10000.exr
  - NO_PATTERN:\out\render_0072.exr
  - NEG_DIGITS:\out\file_-01.exr
  - NEG_PRINTF:\out\file_-001.exr
  - NEG_HASH:\out\file_-001.exr
  - MULTI_EXT:\out\render.0072.exr
  - VFX_VERSION:\out\file.v2.072.exr
  - DOT_ONLY:\out\file_0072.001
  - "MIXED_HP:\\out\\f_%d_abc_042.exr"
  - "MIXED_DP:\\out\\file_%04d_072.exr"
