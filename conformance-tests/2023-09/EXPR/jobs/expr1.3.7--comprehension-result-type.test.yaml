# A list comprehension's type follows from its parts' types, not from how many
# elements the filter keeps (§1.3.7). An empty result of a comprehension whose
# element expression has a single type is an empty list of that type; when the
# element type is a union, a non-empty result takes its type from its elements
# (§1.2.6) and an empty result is list[nulltype].
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'EMPTY_LEN:{{ len([x for x in [1, 2] if x > 5]) }}')
            print(r'EMPTY_SUM:{{ sum([x for x in [1, 2] if x > 5]) }}')
            print(r'EMPTY_PROMOTE:{{ [x for x in [1, 2] if x > 5] + [2.5] }}')
            print(r'EMPTY_NESTED:{{ [[x for x in [1, 2] if x > 5], [3]] }}')
            print(r'UNION_ONE_TYPE:{{ [x if x > 1 else 'a' for x in [2, 3]] }}')
            print(r'UNION_PROMOTE:{{ [x if x > 1 else 2.5 for x in [1, 2]] }}')
            print(r'UNION_EMPTY:{{ [x if x > 1 else 'a' for x in [1, 2] if x > 5] + [2.5] }}')
expected:
  output:
  - "EMPTY_LEN:0"
  - "EMPTY_SUM:0"
  - "EMPTY_PROMOTE:[2.5]"
  - "EMPTY_NESTED:[[], [3]]"
  - "UNION_ONE_TYPE:[2, 3]"
  - "UNION_PROMOTE:[2.5, 2.0]"
  - "UNION_EMPTY:[2.5]"
