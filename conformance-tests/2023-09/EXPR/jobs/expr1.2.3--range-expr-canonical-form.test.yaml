# Template Schemas §3.4.1.1.1 (canonical form) and Expression Language §1.2.3: a range_expr converts to the string of
# its canonical form, which depends only on its list of values. Greedy runs from the left: a run of three or more
# values with a constant step is written x-y or x-y:s; otherwise the value is written alone. The same values give the
# same string whether they were written as a string, in another spelling, or as a list.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"""S0:[{{ string(range_expr("1,3,5,7,9")) }}]""")
            print(r"""S1:[{{ string(range_expr("19-23:5,13-18")) }}]""")
            print(r"""S2:[{{ string(range_expr("13-18,19")) }}]""")
            print(r"""S3:[{{ string(range_expr("2,4,6,8,9,10")) }}]""")
            print(r"""S4:[{{ string(range_expr("1,3,4,5")) }}]""")
            print(r"""S5:[{{ string(range_expr("1-2")) }}]""")
            print(r"""S6:[{{ string(range_expr("5-5")) }}]""")
            print(r"""S7:[{{ string(range_expr("3-7:4")) }}]""")
            print(r"""S8:[{{ string(range_expr("1-10:4")) }}]""")
            print(r"""S9:[{{ string(range_expr("5-1:-1")) }}]""")
            print(r"""S10:[{{ string(range_expr(" 1 - 3 , 7 ")) }}]""")
            print(r"""S11:[{{ string(range_expr("1,3,5-7")) }}]""")
            print(r"""S12:[{{ string(range_expr("1-3,5,7,9")) }}]""")
            print(r"""S13:[{{ string(range_expr("-3--1")) }}]""")
            print(r"""S14:[{{ string(range_expr("1,2,4")) }}]""")
            print(r"""S15:[{{ string(range_expr("10-15:2,1-5")) }}]""")
            print(r"""L0:[{{ string(range_expr([1, 3, 5, 7, 9])) }}]""")
            print(r"""L1:[{{ string(range_expr([1, 3, 4, 5])) }}]""")
            print(r"""L2:[{{ string(range_expr([1, 2, 3, 5, 7, 9])) }}]""")
            print(r"""L3:[{{ string(range_expr([2, 4, 6, 8, 9, 10])) }}]""")
            print(r"""L4:[{{ string(range_expr([9, 7, 5, 3, 1])) }}]""")
            print(r"""L5:[{{ string(range_expr([3, 7])) }}]""")
            print(r"""FMT:[{{ range_expr("1,3,5,7,9") }}]""")
            print(r"""CAT:[{{ "f" + range_expr("1,2,3") }}]""")
            print(r"""PY:[{{ repr_py(range_expr("13-18,19")) }}]""")
expected:
  output:
  - 'S0:[1-9:2]'
  - 'S1:[13-19]'
  - 'S2:[13-19]'
  - 'S3:[2-8:2,9,10]'
  - 'S4:[1,3-5]'
  - 'S5:[1,2]'
  - 'S6:[5]'
  - 'S7:[3,7]'
  - 'S8:[1-9:4]'
  - 'S9:[1-5]'
  - 'S10:[1-3,7]'
  - 'S11:[1-5:2,6,7]'
  - 'S12:[1-3,5-9:2]'
  - 'S13:[-3--1]'
  - 'S14:[1,2,4]'
  - 'S15:[1-5,10-14:2]'
  - 'L0:[1-9:2]'
  - 'L1:[1,3-5]'
  - 'L2:[1-3,5-9:2]'
  - 'L3:[2-8:2,9,10]'
  - 'L4:[1-9:2]'
  - 'L5:[3,7]'
  - 'FMT:[1-9:2]'
  - 'CAT:[f1-3]'
  - 'PY:[''13-19'']'
