template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Matrix
    type: LIST[LIST[INT]]
    default: [[1, 2], [3, 4], [5, 6]]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'LEN:{{ len(Param.Matrix) }}')
            print(r'ROW0:{{ Param.Matrix[0] }}')
            print(r'ELEM:{{ Param.Matrix[1][0] }}')
            print(r'FLAT:{{ flatten(Param.Matrix) }}')
expected:
  output:
  - LEN:3
  - "ROW0:[1, 2]"
  - ELEM:3
  - "FLAT:[1, 2, 3, 4, 5, 6]"
