# Template Schemas §2.14 and §7.5: U+200B (zero width space) is not white space, so the LIST[FLOAT] item "\u200b2.5"
# is not a <floatstring> and job creation must fail. The same template accepts [" 1.00 ", "2.50"]
# (see 2.14--list-float-supplied-value-string-items-keep-spelling).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Scales
    type: LIST[FLOAT]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'SCALES:{{ Param.Scales }}')
parameters:
  Scales: [1.5, "\u200b2.5"]
