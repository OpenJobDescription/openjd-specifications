template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Verbose
    type: BOOL
    default: true
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            import shlex, sys
            print('ARGS:' + ' '.join(shlex.quote(a) for a in sys.argv[1:]))
          - "--input"
          - "file.exr"
          - "{{ '--verbose' if Param.Verbose else null }}"
          - "{{ ['--quality', '90'] if Param.Verbose else null }}"
          - "prefix {{ 42 }} suffix"
          - "list: {{ [1, 2, 3] }}"
          - "null:{{ null }}end"
expected:
  output:
  - "ARGS:--input file.exr --verbose --quality 90 'prefix 42 suffix' 'list: [1, 2, 3]' null:end"
