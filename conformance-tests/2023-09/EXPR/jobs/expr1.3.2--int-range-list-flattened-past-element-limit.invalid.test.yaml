# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# Template Schemas §3.4.1.1 allows at most 1024 elements. The list as written has two, but the second flattens into
# 1024 members, so the resolved list has 1025 and the job cannot be created.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Last
    type: INT
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: INT
        range:
        - 0
        - "{{ range_expr('1-' + string(Param.Last)) }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Last: "1024"
