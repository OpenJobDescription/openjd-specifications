template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'INT:{{ abs(-5) }}')
            print(r'FLOAT:{{ abs(-3.14) }}')
            print(r'POS:{{ abs(5) }}')
expected:
  output:
  - INT:5
  - FLOAT:3.14
  - POS:5
