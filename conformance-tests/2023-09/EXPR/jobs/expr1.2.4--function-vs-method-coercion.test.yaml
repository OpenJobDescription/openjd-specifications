template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'func_coerce = startswith(path("/foo/bar"), "/foo")'
    - 'method_ok = "/foo/bar".startswith("/foo")'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'FUNC_COERCE:{{ func_coerce }}')
            print(r'METHOD_OK:{{ method_ok }}')
            print(r'HOST_FUNC:{{ startswith(path("/foo/bar"), "/foo") }}')
            print(r'HOST_METHOD:{{ "/foo/bar".startswith("/foo") }}')
            print(r'HOST_FUNC_WIN:{{ startswith(path("/foo/bar"), r"\foo") }}')
expected:
  output:
  - FUNC_COERCE:true
  - METHOD_OK:true
  - HOST_METHOD:true
  output_posix:
  - HOST_FUNC:true
  - HOST_FUNC_WIN:false
  output_windows:
  - HOST_FUNC:false
  - HOST_FUNC_WIN:true
