template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'r = range_expr("1-3")'
    - 'path_join = [path("/a"), path("/b")].join(",")'
    - 'path_sw = startswith(path("/mnt/out"), "/mnt")'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'INTFLOAT:{{ 2 + 1.5 }}')
            print(r'PATHSTR:{{ path_sw }}')
            print(r'RANGECAT:{{ [10, 20] + range_expr("1-3") }}')
            print(r'RANGE_STR:{{ string(r) }}')
            print(r'RANGE_FMT:frames={{ r }}')
            print(r'RANGE_ADD:{{ "frames: " + r }}')
            print(r'RANGE_ADD2:{{ r + " are frames" }}')
            print(r'LIST_PATH_STR:{{ path_join }}')
            print(r'FMT_EMBED:Count is {{ len([1,2,3]) }} items')
            print(r'BOOL_FMT:val={{ true }}')
expected:
  output:
  - INTFLOAT:3.5
  - PATHSTR:true
  - "RANGECAT:[10, 20, 1, 2, 3]"
  - "RANGE_STR:1-3"
  - "RANGE_FMT:frames=1-3"
  - "RANGE_ADD:frames: 1-3"
  - "RANGE_ADD2:1-3 are frames"
  - "FMT_EMBED:Count is 3 items"
  - "BOOL_FMT:val=true"
  - "LIST_PATH_STR:/a,/b"
