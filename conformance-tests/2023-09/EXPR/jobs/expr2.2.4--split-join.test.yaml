template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    # TEMPLATE scope for cross-platform POSIX path semantics (Expression Language §2.3.2)
    let:
    - 'paths = [path("/a"), path("/b"), path("/c")]'
    - 'path_join = join(paths, ":")'
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SPLIT:{{ split("a,b,c", ",") }}')
            print(r'JOIN:{{ join(["a", "b", "c"], "-") }}')
            print(r'PATH_JOIN:{{ path_join }}')
            print(r'EMPTY_JOIN:{{ len(join([], ",")) }} chars')
expected:
  output:
  - 'SPLIT:["a", "b", "c"]'
  - JOIN:a-b-c
  - "PATH_JOIN:/a:/b:/c"
  - "EMPTY_JOIN:0 chars"
