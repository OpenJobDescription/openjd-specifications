template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'ONE_GROUP:{{ re_match("v042_final", r"v(\d+)") }}')
            print(r'NO_GROUPS:{{ re_match("hello123", r"hello") }}')
            print(r'MULTI:{{ re_match("shot010_v003", r"shot(\d+)_v(\d+)") }}')
            print(r'NONE:{{ re_match("asset_v042", r"v(\d+)") == null }}')
expected:
  output:
  - 'ONE_GROUP:["v042", "042"]'
  - 'NO_GROUPS:["hello"]'
  - 'MULTI:["shot010_v003", "010", "003"]'
  - NONE:true
