# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# An element that evaluates to a list is flattened into one range element per member. For FLOAT the target also
# includes int, so an int result is kept as written (7), while the members of a list are converted to float.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Scales
    type: LIST[FLOAT]
  - name: Count
    type: INT
  - name: Frames
    type: LIST[INT]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: FLOAT
        range:
        - 0.5
        - "{{ Param.Scales }}"
        - "{{ Param.Count }}"
        - "{{ Param.Frames }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Scales: [1.5, 2.5]
  Count: "7"
  Frames: [3, 4]
expected:
  output:
  - 'TASK:X=[0.5]'
  - 'TASK:X=[1.5]'
  - 'TASK:X=[2.5]'
  - 'TASK:X=[7]'
  - 'TASK:X=[3.0]'
  - 'TASK:X=[4.0]'
  forbidden:
  - 'TASK:X=[[1.5, 2.5]]'
  - 'TASK:X=[7.0]'
  - 'TASK:X=[3]'
  - 'TASK:X=[4]'
