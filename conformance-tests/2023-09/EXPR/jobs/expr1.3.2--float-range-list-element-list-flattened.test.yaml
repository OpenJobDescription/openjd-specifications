# Expression Language §1.3.2: with EXPR, each element of a task parameter range list is a list item, with
# target type T? | list[T] for element type T.
# An element that evaluates to a list is flattened into one range element per member.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Scales
    type: LIST[FLOAT]
  steps:
  - name: Step1
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: FLOAT
        range:
        - 0.5
        - "{{ Param.Scales }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'TASK:X=[{{Task.Param.X}}]')
parameters:
  Scales: [1.5, 2.5]
expected:
  output:
  - 'TASK:X=[0.5]'
  - 'TASK:X=[1.5]'
  - 'TASK:X=[2.5]'
  forbidden:
  - 'TASK:X=[[1.5, 2.5]]'
