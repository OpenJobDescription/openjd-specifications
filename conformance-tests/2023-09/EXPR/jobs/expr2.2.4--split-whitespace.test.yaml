template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SPLIT:[{{ split("  hello   world  ").join(",") }}]')
            print(r'SPLIT_TABS:[{{ split("a\tb\tc").join(",") }}]')
            print(r'SPLIT_NEWLINES:[{{ split("a\nb\nc").join(",") }}]')
            print(r'SPLIT_MIXED:[{{ split("  a \t b \n c  ").join(",") }}]')
            print(r'SPLIT_EMPTY:[{{ len(split("   ")) }}]')
            print(r'RSPLIT:[{{ rsplit("  hello   world  ").join(",") }}]')
            print(r'RSPLIT_MIXED:[{{ rsplit("  a \t b \n c  ").join(",") }}]')
expected:
  output:
  - SPLIT:[hello,world]
  - SPLIT_TABS:[a,b,c]
  - SPLIT_NEWLINES:[a,b,c]
  - SPLIT_MIXED:[a,b,c]
  - SPLIT_EMPTY:[0]
  - RSPLIT:[hello,world]
  - RSPLIT_MIXED:[a,b,c]
