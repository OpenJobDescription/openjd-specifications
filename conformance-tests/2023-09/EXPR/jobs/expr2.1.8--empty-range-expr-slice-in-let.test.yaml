# Expression Language section 2.1.8: slice indices out of bounds "are clamped
# to valid range (no error)", so slicing past the end of a range_expr selects
# no values. A step `let` binding holds the slice and the onRun args use it,
# so the value crosses from job creation to the session, where its length is
# 0.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: 1-3
  steps:
  - name: Step1
    let:
    - beyond = Param.Frames[5:9]
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'LEN:{{ len(beyond) }}')
expected:
  output:
  - LEN:0
