# Expression Language section 1.2.5: a range_expr compares equal to a list
# element by element, so `range_expr("24-24:20") == [24]` is true; it is the
# single value 24. Two range_exprs with the same values are equal as well,
# which keeps equality transitive: `range_expr("24-24:20") ==
# range_expr("24")` is true.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'RANGE_LIST:{{ range_expr("24-24:20") == [24] }}')
            print(r'RANGE_RANGE:{{ range_expr("24-24:20") == range_expr("24") }}')
            print(r'RANGE_RANGE_NE:{{ range_expr("24-24:20") != range_expr("24") }}')
expected:
  output:
  - RANGE_LIST:true
  - RANGE_RANGE:true
  - RANGE_RANGE_NE:false
