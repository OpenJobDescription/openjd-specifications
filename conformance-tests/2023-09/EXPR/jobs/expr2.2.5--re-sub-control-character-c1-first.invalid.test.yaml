# conformance: xfail(py, reason="openjd-cli 0.8.0 accepts a re_sub replacement with a C1 control character (U+0080); fixed in openjd-rs#570 (unreleased, after openjd-expr 0.17)")
# Expression Language §2.2.5: re_sub rejects a replacement that contains a control character,
# which includes the C1 range U+0080 to U+009F. Here its first character, U+0080.
# The rest of the template is valid; expr2.2.5--re-sub-tab-newline is the accepted side.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ repr_py(re_sub('a-b', '-', '\x80')) }}|")
