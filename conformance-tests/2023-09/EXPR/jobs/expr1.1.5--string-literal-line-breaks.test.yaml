# conformance: xfail(py, reason="openjd-cli 0.8.0 keeps CR LF and CR inside a string literal instead of LF; fixed in openjd-rs#570, not yet in an openjd-expr release")
# Expression Language §1.1.5: a line break inside a string literal (LF, CR LF or CR) is a single
# LF, in raw strings too, while an escaped \r still gives CR. In a raw string a backslash before a
# line break stays, and each of two adjacent line breaks is its own LF. YAML block scalars can't hold a CR,
# so each script is a double-quoted YAML string: "\r\n" is CR LF and "\\r" is a backslash and r.
# Each value ends with '|' so an output line can't pass by matching a prefix.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - "print(r\"TRIPLE_LF:{{ repr_py('''ab\ncd''') }}|\")\nprint(r\"TRIPLE_CRLF:{{ repr_py('''ab\r\ncd''') }}|\")\nprint(r\"TRIPLE_CR:{{ repr_py('''ab\rcd''') }}|\")\nprint(r\"RAW_TRIPLE_CRLF:{{ repr_py(r'''ab\r\ncd''') }}|\")\nprint(r\"ESCAPED_CR_THEN_CRLF:{{ repr_py('''ab\\r\r\ncd''') }}|\")\nprint(r\"RAW_TRIPLE_CR:{{ repr_py(r'''ab\rcd''') }}|\")\nprint(r\"RAW_BACKSLASH_CRLF:{{ repr_py(r'''ab\\\r\ncd''') }}|\")\nprint(r\"CR_CR:{{ repr_py('''ab\r\rcd''') }}|\")\nprint(r\"LF_CR:{{ repr_py('''ab\n\rcd''') }}|\")\n"
expected:
  output:
  - TRIPLE_LF:'ab\ncd'|
  - TRIPLE_CRLF:'ab\ncd'|
  - TRIPLE_CR:'ab\ncd'|
  - RAW_TRIPLE_CRLF:'ab\ncd'|
  - ESCAPED_CR_THEN_CRLF:'ab\r\ncd'|
  - RAW_TRIPLE_CR:'ab\ncd'|
  - RAW_BACKSLASH_CRLF:'ab\\\ncd'|
  - CR_CR:'ab\n\ncd'|
  - LF_CR:'ab\n\ncd'|
