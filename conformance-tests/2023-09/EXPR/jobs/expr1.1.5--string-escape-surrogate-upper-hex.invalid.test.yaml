# Expression Language §1.1.5: a \u escape with a surrogate code point is a syntax error
# whatever the case of its hex digits. Here U+D800 written as \uD800.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ len('\uD800') }}|")
