template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - FEATURE_BUNDLE_1
  name: TestJob
  parameterDefinitions:
  - name: NeedGpu
    type: BOOL
    default: true
  steps:
  - name: Step1
    let:
    - "gpu_count = 1 if Param.NeedGpu else 0"
    hostRequirements:
      amounts:
      - name: amount.worker.gpu
        min: "{{ gpu_count }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'GPU:{{ gpu_count }}')
expected:
  output:
  - GPU:1
