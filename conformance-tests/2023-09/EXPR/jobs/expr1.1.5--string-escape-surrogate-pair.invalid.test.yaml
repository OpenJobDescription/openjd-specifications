# conformance: xfail(py, reason="openjd-cli 0.8.0 accepts a surrogate u or U escape in a string literal; fixed in openjd-rs#570, not yet in an openjd-expr release")
# Expression Language §1.1.5: two escapes are never combined into one character, so the surrogate
# pair '\uD83D\uDE00' is a syntax error, not U+1F600.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ len('\uD83D\uDE00') }}|")
