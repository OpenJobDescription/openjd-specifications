template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SPLIT:{{ "".split(",") }}')
            print(r'LEN:{{ len("".split(",")) }}')
expected:
  output:
  - 'SPLIT:[""]'
  - 'LEN:1'
