template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'INT:{{ sorted([3, 1, 2]) }}')
            print(r'STR:{{ sorted(["b", "a", "c"]) }}')
            print(r'ALREADY:{{ sorted([1, 2, 3]) }}')
            print(r'EMPTY:{{ sorted([]) }}')
            print(r'FLOAT:{{ sorted([2.5, 1.0, 3.5]) }}')
            print(r'NESTED:{{ sorted([[1, 3], [1], [1, 2], []]) }}')
expected:
  output:
  - "INT:[1, 2, 3]"
  - 'STR:["a", "b", "c"]'
  - "ALREADY:[1, 2, 3]"
  - "EMPTY:[]"
  - "FLOAT:[1.0, 2.5, 3.5]"
  - "NESTED:[[], [1], [1, 2], [1, 3]]"
