template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'FOUND:{{ find("hello world", "world") }}')
            print(r'NOT_FOUND:{{ find("hello world", "xyz") }}')
            print(r'START:{{ find("hello", "hel") }}')
expected:
  output:
  - FOUND:6
  - NOT_FOUND:-1
  - START:0
