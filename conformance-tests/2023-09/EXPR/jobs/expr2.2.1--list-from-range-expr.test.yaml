template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SIMPLE:{{ list(range_expr("1-3")) }}')
            print(r'STEP:{{ list(range_expr("1-9:2")) }}')
            print(r'DESC:{{ list(range_expr("5-1:-1")) }}')
            print(r'VALUES:{{ list(range_expr("2,6,9")) }}')
            print(r'MIXED:{{ list(range_expr("1-3,10,20-22")) }}')
            print(r'FROM_LIST:{{ list(range_expr([1, 2, 3])) }}')
expected:
  output:
  - "SIMPLE:[1, 2, 3]"
  - "STEP:[1, 3, 5, 7, 9]"
  - "DESC:[5, 4, 3, 2, 1]"
  - "VALUES:[2, 6, 9]"
  - "MIXED:[1, 2, 3, 10, 20, 21, 22]"
  - "FROM_LIST:[1, 2, 3]"
