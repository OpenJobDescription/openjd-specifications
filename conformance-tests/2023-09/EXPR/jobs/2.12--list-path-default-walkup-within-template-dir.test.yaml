# 2.12: default elements that contain ".." but normalize to the job
# template's directory or a path within it are accepted (2.2). Companion to
# base/jobs/1.1--validation-valid-path-default-walkup-within-template-dir.
# TemplateDir has default "." so the script can check each joined element
# exactly.

template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: TemplateDir
    type: PATH
    default: .
  - name: Paths
    type: LIST[PATH]
    default: ["a/..", "a/../b", "./a/./../b/.", "..name/name../...", "a/b/c/../../../d"]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            import os
            t = r'{{Param.TemplateDir}}'
            print('LEN:[{{ len(Param.Paths) }}]')
            print('UP_TO_DIR:[%s]' % (r'{{ Param.Paths[0] }}' == t))
            print('UP_TO_SIBLING:[%s]' % (r'{{ Param.Paths[1] }}' == os.path.join(t, 'b')))
            print('NOISY:[%s]' % (r'{{ Param.Paths[2] }}' == os.path.join(t, 'b')))
            print('DOTS_IN_NAME:[%s]' % (r'{{ Param.Paths[3] }}' == os.path.join(t, '..name', 'name..', '...')))
            print('DEEP:[%s]' % (r'{{ Param.Paths[4] }}' == os.path.join(t, 'd')))

expected:
  output:
  - LEN:[5]
  - UP_TO_DIR:[True]
  - UP_TO_SIBLING:[True]
  - NOISY:[True]
  - DOTS_IN_NAME:[True]
  - DEEP:[True]
