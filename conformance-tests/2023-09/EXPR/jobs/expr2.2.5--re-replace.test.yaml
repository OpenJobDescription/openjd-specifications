template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'SINGLE:{{ re_replace("frame_001", r"\d+", "002") }}')
            print(r'MULTI:{{ re_replace("a1b2c3", r"\d", "X") }}')
            print(r'NO_MATCH:{{ re_replace("hello", r"\d+", "X") }}')
expected:
  output:
  - SINGLE:frame_002
  - MULTI:aXbXcX
  - NO_MATCH:hello
