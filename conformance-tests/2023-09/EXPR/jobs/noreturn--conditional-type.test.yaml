template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: X
    type: INT
    default: 5
  - name: Flag
    type: BOOL
    default: true
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - >-
            print(r'INT:{{ (Param.X if Param.X > 0 else fail("bad")) + 10 }}')

            print(r'BOOL:{{ "yes" if (Param.Flag or fail("required")) else "no" }}')
expected:
  output:
  - "INT:15"
  - "BOOL:yes"
