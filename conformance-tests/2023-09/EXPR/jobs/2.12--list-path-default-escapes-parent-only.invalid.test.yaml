# 2.12: a default element of ".." resolves to the parent of the job
# template's directory (2.2). The bad element is last, after two valid ones.
# The script prints a constant so the default is the only thing that can fail.

template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Paths
    type: LIST[PATH]
    default: ["a", "a/..", ".."]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'OUTPUT:success')
