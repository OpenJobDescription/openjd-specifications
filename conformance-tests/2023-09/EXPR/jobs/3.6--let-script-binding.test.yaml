template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      let:
      - "x = 1"
      - "y = x + 1"
      - "z = y * 3"
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r'X:{{ x }}')
            print(r'Y:{{ y }}')
            print(r'Z:{{ z }}')
expected:
  output:
  - X:1
  - Y:2
  - Z:6
