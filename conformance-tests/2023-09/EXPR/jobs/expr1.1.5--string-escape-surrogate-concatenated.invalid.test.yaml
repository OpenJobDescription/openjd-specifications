# Expression Language §1.1.5: a surrogate escape is a syntax error in any part of an implicitly
# concatenated string literal, not only the first.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"VALUE:{{ len('a' '\ud800') }}|")
