# Expression Language §1.1.5: \N{name} compares names without regard to case, for names
# given by rule (CJK UNIFIED IDEOGRAPH, HANGUL SYLLABLE) and name aliases as well as
# ordinary names. Each comparison ends with '|', so an output line can't pass by matching
# a prefix. An implementation that decodes escapes with Python's own decoder needs a
# CPython release that accepts these (3.13.13 or later in 3.13, 3.14.4 or later in 3.14)
# or its own case folding, because earlier releases require upper case for CJK UNIFIED
# IDEOGRAPH and HANGUL SYLLABLE names.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - |
            print(r"ORDINARY:{{ '\N{bullet}' == '\u2022' }}|{{ '\N{Bullet}' == '\u2022' }}|")
            print(r"CJK:{{ '\N{cjk unified ideograph-4e00}' == '\u4e00' }}|{{ '\N{Cjk Unified Ideograph-4e00}' == '\u4e00' }}|")
            print(r"HANGUL:{{ '\N{hangul syllable ga}' == '\uac00' }}|")
            print(r"ALIAS:{{ '\N{byte order mark}' == '\ufeff' }}|")
expected:
  output:
  - ORDINARY:true|true|
  - CJK:true|true|
  - HANGUL:true|
  - ALIAS:true|
