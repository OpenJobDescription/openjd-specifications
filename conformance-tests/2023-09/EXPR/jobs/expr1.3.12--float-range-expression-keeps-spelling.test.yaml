# Expression Language §1.3.12 and §1.3.4: a FLOAT range that is a single <ListExpressionString> takes one value per
# member of the list, and a float copied unchanged keeps its original form. The LIST[FLOAT] value [" 1.00 ", "2.50"]
# gives the tasks 1.00 and 2.50, and the FLOAT value " 3.500 " in "{{ [Param.F] }}" gives 3.500, the same values a
# range list element "{{ Param.Scales }}" or "{{ [Param.F] }}" gives. White space is not part of the form (Template
# Schemas §7.5).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Scales
    type: LIST[FLOAT]
  - name: F
    type: FLOAT
  steps:
  - name: Whole
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: FLOAT
        range: "{{ Param.Scales }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'WHOLE:X=[{{Task.Param.X}}]')
  - name: Scalar
    parameterSpace:
      taskParameterDefinitions:
      - name: X
        type: FLOAT
        range: "{{ [Param.F] }}"
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'SCALAR:X=[{{Task.Param.X}}]')
parameters:
  Scales: [" 1.00 ", "2.50"]
  F: " 3.500 "
expected:
  output:
  - 'WHOLE:X=[1.00]'
  - 'WHOLE:X=[2.50]'
  - 'SCALAR:X=[3.500]'
  forbidden:
  - 'WHOLE:X=[1.0]'
  - 'WHOLE:X=[2.5]'
  - 'SCALAR:X=[3.5]'
