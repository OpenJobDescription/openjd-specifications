# Template Schemas §2.13 and §7.5: white space inside the number is not allowed, so the LIST[INT] item "1 000" is not
# an <intstring> and job creation must fail. The same template accepts [1, " 2 "]
# (see 2.13--list-int-supplied-value-padded-string-items).
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Values
    type: LIST[INT]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VALUES:{{ Param.Values }}')
parameters:
  Values: [1, "1 000"]
