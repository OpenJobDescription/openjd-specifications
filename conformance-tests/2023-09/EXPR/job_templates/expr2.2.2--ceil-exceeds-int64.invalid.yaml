# Expression Language §2.2.2 (ceil) + the int64 range rule (see below):
# ceil(x: float) -> int must produce an int64 value. 1e300 is a finite
# float far outside the 64-bit signed range (~9.22e18), so the conversion
# must be rejected rather than saturating or wrapping. floor has its own
# fixture (expr2.2.2--floor-exceeds-int64); split so each function's
# overflow check is independently pinned.
# The int64 range rule: Expression Language §1.2.1 types `int` as a 64-bit
# signed integer (−2^63 to 2^63−1), and RFC 0005 §3 says "Any operation that
# produces an integer value outside this range is an error".
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  let:
  - 'c = ceil(1e300)'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |
          print(r'C:{{ c }}')
