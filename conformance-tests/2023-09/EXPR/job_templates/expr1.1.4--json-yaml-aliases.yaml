# Tests that null/true/false are accepted as aliases for None/True/False
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Flag
  type: BOOL
  default: true
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - |
          # JSON/YAML aliases
          print(r'{{ true }}')
          print(r'{{ false }}')
          print(r'{{ null }}')
          # Python-style
          print(r'{{ True }}')
          print(r'{{ False }}')
          print(r'{{ None }}')
          # Mixed in expressions
          print(r'{{ true if Param.Flag else false }}')
          print(r'{{ True if Param.Flag else False }}')
          # null in conditional (omits arg)
        - "{{ '--flag' if true else null }}"
        - "{{ '--other' if True else None }}"
