# Expression Language §2.2.2 (sum) + the int64 range rule (see below):
# sum(values: list[int]) accumulating past int64 max (2^63 - 1) must be rejected.
# 9223372036854775807 + 1 = 2^63 overflows the 64-bit signed range.
# The int64 range rule: Expression Language §1.2.1 types `int` as a 64-bit
# signed integer (−2^63 to 2^63−1), and RFC 0005 §3 says "Any operation that
# produces an integer value outside this range is an error".
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |
          print(r'SUM:{{ sum([9223372036854775807, 1]) }}')
