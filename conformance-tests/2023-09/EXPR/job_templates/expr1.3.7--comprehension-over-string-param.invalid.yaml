# Expression Language section 1.3.7: a list comprehension iterates a list or a
# range_expr. A STRING parameter is not iterable, whatever its value, so the
# comprehension fails on every run, and template validation reports the type
# error ("Static Type Checking via Unresolved Values": "If it fails, a type
# error is reported").
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Items
  type: STRING
  default: abc
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ [x for x in Param.Items] }}')
