# Underscores in numeric literals cannot appear at the end of a number
# (Expression Language §1.1.6). "123_" must be rejected as a syntax error.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ 123_ }}')
