# Expression Language §2.2.6: `relative_to` fails when the path is not relative to the other path.
# In TEMPLATE scope (here the job name) a literal path has POSIX semantics
# and is evaluated when the template is checked, so the check rejects it.
# The same expression in a host-context field is checked only at run time:
# see jobs/expr2.2.6--relative-to-not-relative.test.yaml.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: '{{ path("/a/b").relative_to(path("/x/y")) }}'
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print('ok')
