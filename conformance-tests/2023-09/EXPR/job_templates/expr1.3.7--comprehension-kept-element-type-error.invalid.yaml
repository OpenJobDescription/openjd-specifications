# Template validation cannot decide the filter for the element 2 (Param.Zero
# is not known), but the filter keeps the element 1 on every run, so the
# element expression is evaluated on it and fails: int has no upper()
# (§1.3.7). This holds whatever the element's position in the iterable.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Zero
  type: INT
  default: 0
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [x.upper() for x in [2, 1] if x == 1 or Param.Zero == 5] }}')"
