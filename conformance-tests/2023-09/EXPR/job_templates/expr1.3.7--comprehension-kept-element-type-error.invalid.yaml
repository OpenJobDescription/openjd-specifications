# Template validation cannot decide the filter for the element 2 (Param.Zero
# is not known), but the elements are evaluated in order, and the filter
# keeps the element 1 before it on every run, so the element expression is
# evaluated on it and fails: int has no upper() (§1.3.7).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Zero
  type: INT
  default: 0
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [x.upper() for x in [1, 2] if x == 1 or Param.Zero == 5] }}')"
