# Template Schemas §2.13 and §7.5: white space inside the number is not allowed, so "1 000" is not an <intstring> and
# the default is invalid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Values
  type: LIST[INT]
  default: [1, "1 000"]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
