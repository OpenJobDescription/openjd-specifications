# Section 2.9: "BOOL does not support allowedValues". The property is not in
# the BOOL schema, so declaring it must be rejected.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Flag
  type: BOOL
  default: true
  allowedValues: [true]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
