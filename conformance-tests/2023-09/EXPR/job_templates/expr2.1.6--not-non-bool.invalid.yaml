# "not remains strictly boolean — it requires a bool operand and returns
# bool" (Expression Language §2.1.6). There is no truthiness concept, so
# "not 1" must be rejected rather than evaluating to false.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ not 1 }}')
