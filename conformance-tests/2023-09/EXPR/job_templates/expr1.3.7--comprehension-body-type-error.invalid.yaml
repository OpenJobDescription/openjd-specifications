# The iterable's elements are known and the filter keeps them, so the element
# expression is evaluated on an int, which has no upper() (§1.3.7). An
# iterable whose value is not known would make this a failure only of a run
# that keeps an element.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [x.upper() for x in [1, 2]] }}')"
