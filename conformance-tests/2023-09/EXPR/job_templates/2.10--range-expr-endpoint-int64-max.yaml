# Section 2.10 + Expression Language 1.2.1 (int is 64-bit signed): 9223372036854775807 is the int64 maximum, so a
# range expression with it as an endpoint is valid. This is the accept-side pair of
# 2.10--range-expr-endpoint-int64-overflow.invalid.yaml, which rejects 2^63; together they pin the bound at exactly
# int64, so an implementation with a narrower internal bound (for example 2^62) cannot pass the negative case for the
# wrong reason.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Frames
  type: RANGE_EXPR
  default: "1-9223372036854775807"
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
