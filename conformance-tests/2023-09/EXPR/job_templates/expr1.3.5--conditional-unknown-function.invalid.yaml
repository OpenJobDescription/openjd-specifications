# Template validation does not know Param.Zero, so either branch may be taken.
# A branch that fails on the values' types would be suppressed, but strr is not a
# function, and whether a name exists does not depend on any value, so static
# type checking reports it (Static Type Checking, Conditional Expressions with
# Unknown Conditions and Names that Resolve Nowhere).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Zero
  type: INT
  default: 0
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ 1 if Param.Zero == 0 else strr(1) }}')"
