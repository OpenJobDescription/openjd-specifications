# Expression Language section 2.1.4: ordering operators accept mixed types
# only for the compatible pairs int/float and string/path; "comparing other
# cross-type pairs is an error". A PATH parameter compared with an int is that
# error whatever the parameter's value, so the expression fails on every run,
# and template validation reports the type error ("Static Type Checking via
# Unresolved Values": "If it fails, a type error is reported").
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Dir
  type: PATH
  default: renders
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ Param.Dir < 1 }}')
