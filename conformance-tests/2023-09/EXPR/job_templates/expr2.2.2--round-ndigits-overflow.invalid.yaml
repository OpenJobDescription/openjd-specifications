# round(x, ndigits) with ndigits <= 0 returns int: 1e300 rounded to tens is
# outside the 64-bit signed range, so it is an integer overflow error.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ round(1e300, -1) }}')"
