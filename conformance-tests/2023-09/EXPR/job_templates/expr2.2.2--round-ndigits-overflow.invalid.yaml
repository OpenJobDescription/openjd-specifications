# conformance: xfail(py, reason="openjd-cli 0.8.0 accepts round(1e300, -1) without int64 overflow error; fixed in openjd-rs#567 (openjd-expr 0.17), not yet in openjd-model")
# round(x, ndigits) with ndigits <= 0 returns int: 1e300 rounded to tens is
# outside the 64-bit signed range, so it is an integer overflow error.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ round(1e300, -1) }}')"
