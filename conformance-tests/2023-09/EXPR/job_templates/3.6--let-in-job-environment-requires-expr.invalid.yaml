# EnvironmentScript 'let' in a job environment requires the EXPR extension (spec 4.2).
specificationVersion: jobtemplate-2023-09
name: TestJob
jobEnvironments:
- name: Setup
  script:
    let:
    - x = 1
    actions:
      onEnter:
        command: python
        args:
        - "-c"
        - "print()"
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
