# Test that string processing counts toward the operation limit
# (spec section 1.3.10 rule 3).
#
# Each iteration processes a 10,000-character string:
#   'a' * 10000  -> 1 call + ceil(10000/256)=40 string ops = 41
#   .upper()     -> 1 call + ceil(10000/256)=40 string ops = 41
#   len(...)     -> 1 call                                 =  1
#   comprehension iteration                                =  1
#   Per iteration total                                    = 84
#
# range(117700): 117700 * 84 + 117701 + 1 = 9,994,102 (just over 10M)
#
# The sibling .test.yaml uses range(117600) which stays just under.
# Together the pair validates that string operation counting is active.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - "print(r'{{ len([len(('a' * 10000).upper()) for i in range(117700)]) }}')"
