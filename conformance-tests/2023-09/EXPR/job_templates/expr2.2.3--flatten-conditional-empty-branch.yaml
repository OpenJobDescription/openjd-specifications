# Expression Language "Conditional Expressions with Unknown Conditions" and
# section 2.2.3: with an unresolved condition, `Param.LL if Param.Enabled else
# []` is `unresolved[T | S]`, "since either could be the runtime result". So
# flatten() of it can be the non-empty list[int] from the list[list[int]]
# parameter, and indexing it and adding 1 runs correctly whenever Enabled is
# true (it gives 2 for the default values). Type checking "must never reject a
# pair the concrete value would accept", so the template is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Enabled
  type: BOOL
  default: true
- name: LL
  type: LIST[LIST[INT]]
  default:
  - [1]
  - [2]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ flatten(Param.LL if Param.Enabled else [])[0] + 1 }}')
