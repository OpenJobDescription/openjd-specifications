specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
# Minimal
- name: Minimal
  type: LIST[STRING]
# With default
- name: WithDefault
  type: LIST[STRING]
  default: ["a", "b", "c"]
# Empty default
- name: EmptyDefault
  type: LIST[STRING]
  default: []
# Single element
- name: SingleElement
  type: LIST[STRING]
  default: ["only"]
# Long list
- name: LongList
  type: LIST[STRING]
  default: ["a","b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t"]
# Length constraints
- name: WithMinMax
  type: LIST[STRING]
  default: ["a", "b"]
  minLength: 1
  maxLength: 50
# Min only
- name: MinOnly
  type: LIST[STRING]
  default: ["a"]
  minLength: 0
# Max only
- name: MaxOnly
  type: LIST[STRING]
  default: ["a", "b", "c"]
  maxLength: 100
# Item constraints - allowedValues
- name: ItemAllowed
  type: LIST[STRING]
  default: ["alpha", "beta"]
  item:
    allowedValues: ["alpha", "beta", "gamma"]
# Item constraints - string length
- name: ItemLength
  type: LIST[STRING]
  default: ["hi", "bye"]
  item:
    minLength: 1
    maxLength: 10
# Both list and item constraints
- name: FullyConstrained
  type: LIST[STRING]
  default: ["hello", "world"]
  minLength: 1
  maxLength: 5
  item:
    allowedValues: ["hello", "world", "foo"]
    minLength: 3
    maxLength: 5
# Description
- name: WithDescription
  type: LIST[STRING]
  default: ["x"]
  description: A list of string values
# UI controls
- name: WithLineEditList
  type: LIST[STRING]
  default: ["a"]
  userInterface:
    control: LINE_EDIT_LIST
    label: Items
    groupLabel: Options
- name: WithHidden
  type: LIST[STRING]
  default: ["a"]
  userInterface:
    control: HIDDEN
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
