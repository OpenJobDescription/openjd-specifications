specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Items
  type: LIST[INT]
  default: [1, 2, 3]
steps:
- name: Step1
  script:
    let:
    - x = 10
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [x for x in Param.Items] }}')"
