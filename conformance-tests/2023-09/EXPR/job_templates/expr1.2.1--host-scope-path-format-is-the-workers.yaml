# Expression Language section 1.2.1: "In host contexts (SESSION and TASK
# scopes), the semantics match the host's operating system." `C:/x` is
# absolute on a Windows host and relative on a POSIX one, so in an onRun
# argument which branch runs, and whether `1 + "a"` is ever evaluated, depends
# on the host that runs the task. The template runs correctly on a Windows
# host (it prints 2). Type checking "must never reject a pair the concrete
# value would accept", so template validation accepts the template on any
# machine.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ 1 + (1 if path("C:/x").is_absolute() else "a") }}')
