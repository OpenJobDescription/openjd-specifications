# Expression Language "Path Format": in host contexts (SESSION and TASK
# scopes, such as onRun args) the path type uses "the system's native path
# semantics", so that "paths should match the worker's OS". `C:/x` is
# absolute on a Windows worker and relative on a POSIX one, so which branch
# runs, and whether `1 + 'a'` is ever evaluated, depends on the worker. The
# template runs correctly on a Windows worker (it prints 2), so this test
# expects template validation to accept it on any machine.
#
# The spec does not say this explicitly: "Progressive Expression Evaluation" says
# parts with only concrete values are fully evaluated during validation, and
# nothing says a validator must treat a path-format-dependent operation on
# literals as unresolved.
#
# openjd-rs folds the path operation in the validating machine's format, so
# on a POSIX machine it rejects the template with "Cannot use '+' operator
# with int and string" (found by fuzzing, openjd-rs#442). On Windows it
# accepts the template, so this test detects the bug only on POSIX.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ 1 + (1 if path("C:/x").is_absolute() else "a") }}')
