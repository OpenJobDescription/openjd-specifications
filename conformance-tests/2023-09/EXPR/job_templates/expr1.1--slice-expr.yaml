specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Name
  type: STRING
  default: hello
- name: Items
  type: LIST[INT]
  default: [10, 20, 30, 40, 50]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - |
          # String indexing
          print(r'{{ Param.Name[0] }}')
          print(r'{{ Param.Name[-1] }}')
          # String slicing
          print(r'{{ Param.Name[1:3] }}')
          print(r'{{ Param.Name[:3] }}')
          print(r'{{ Param.Name[2:] }}')
          print(r'{{ Param.Name[::-1] }}')
          # List indexing
          print(r'{{ Param.Items[0] }}')
          print(r'{{ Param.Items[-1] }}')
          # List slicing
          print(r'{{ Param.Items[1:4] }}')
          print(r'{{ Param.Items[:3] }}')
          print(r'{{ Param.Items[2:] }}')
          print(r'{{ Param.Items[::2] }}')
          print(r'{{ Param.Items[::-1] }}')
          # Slice with step
          print(r'{{ Param.Items[0:5:2] }}')
          # Negative slice
          print(r'{{ Param.Items[-3:] }}')
          print(r'{{ Param.Items[:-2] }}')
