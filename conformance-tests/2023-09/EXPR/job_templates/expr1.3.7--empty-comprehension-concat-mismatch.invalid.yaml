# The comprehension's filter keeps no element, but its type is still
# list[int] (§1.3.7), not the empty literal's list[nulltype], so concatenating
# a list[string] is an error, as [1] + ['a'] is.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [x for x in [1, 2] if x > 5] + [\"a\"] }}')"
