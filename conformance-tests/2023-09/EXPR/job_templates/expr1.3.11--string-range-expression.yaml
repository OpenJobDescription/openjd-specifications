specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Prefix
  type: STRING
  default: scene
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Name
      type: STRING
      range: "{{ [Param.Prefix + '_a', Param.Prefix + '_b'] }}"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{Task.Param.Name}}')"
