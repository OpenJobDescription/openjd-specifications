# "float('inf'), float('nan'), and float('-inf') are errors" (Expression
# Language §1.3.4). The '-inf' spelling is a distinct parse branch from
# 'inf' (covered by expr2.2.1--float-from-inf) — an implementation matching
# only the unsigned spellings would let it through.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - "print(r'{{ float(\"-inf\") }}')"
