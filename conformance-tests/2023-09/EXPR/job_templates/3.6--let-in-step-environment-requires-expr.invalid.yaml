# EnvironmentScript 'let' in a step environment requires the EXPR extension (spec 4.2).
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  stepEnvironments:
  - name: Setup
    script:
      let:
      - x = 1
      actions:
        onEnter:
          command: python
          args:
          - "-c"
          - "print()"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
