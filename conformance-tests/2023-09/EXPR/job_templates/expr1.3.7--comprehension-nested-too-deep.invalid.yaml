# The element expression is a list[list[int]], so the comprehension would be
# a three-level list (§1.2.1). That is an error (§1.3.7) even though the
# filter keeps no element.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [[[x]] for x in [1, 2] if x > 5] }}')"
