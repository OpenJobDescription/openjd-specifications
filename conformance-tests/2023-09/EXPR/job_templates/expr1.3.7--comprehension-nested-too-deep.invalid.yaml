# The element expression is a list[list[int]], so a comprehension that keeps
# an element would be a three-level list (§1.2.1). The iterable's elements are
# known and the filter keeps them, so this is an error (§1.3.7).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [[[x]] for x in [1, 2]] }}')"
