# Expression Language 2.1.8: slicing a range_expr gives a range_expr with a
# positive step and a list[int] with a negative step (`r[start:stop:step]
# -> range_expr | list[int]`). With the step from a parameter, the slice can
# be a list[int], and `* 2` (list repetition, 2.1.3) runs correctly whenever
# Step is negative, as it is by default. Template validation must accept the
# template.
#
# Relies on an operation on a union-typed operand succeeding when one member
# can succeed (see README-fuzz-findings.md). The literal-step case, which
# needs no such rule, is expr2.1.8--range-expr-slice-negative-step.yaml.
#
# openjd-rs types every range_expr slice as range_expr during validation and
# rejects the template with "Cannot use '*' operator with range_expr and int"
# (found by fuzzing, openjd-rs#442).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Frames
  type: RANGE_EXPR
  default: 1-3
- name: Step
  type: INT
  default: -1
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ Param.Frames[::Param.Step] * 2 }}')
