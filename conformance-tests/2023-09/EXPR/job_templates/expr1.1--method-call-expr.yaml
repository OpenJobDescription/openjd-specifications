specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Name
  type: STRING
  default: "hello world"
- name: File
  type: PATH
  default: /renders/shot_001.exr
- name: Csv
  type: STRING
  default: "a,b,c"
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - |
          # String methods
          print(r'{{ Param.Name.upper() }}')
          print(r'{{ Param.Name.lower() }}')
          print(r'{{ Param.Name.capitalize() }}')
          print(r'{{ Param.Name.strip() }}')
          print(r'{{ Param.Name.startswith("hello") }}')
          print(r'{{ Param.Name.replace("world", "there") }}')
          # Chained methods
          print(r'{{ Param.Csv.split(",").join(";") }}')
          # Path properties (UFCS)
          print(r'{{ Param.File.name }}')
          print(r'{{ Param.File.stem }}')
          print(r'{{ Param.File.suffix }}')
          print(r'{{ Param.File.parent }}')
          # Path methods
          print(r'{{ Param.File.with_suffix(".png") }}')
          print(r'{{ Param.File.with_name("output.exr") }}')
          # Method with args
          print(r'{{ Param.Name.count("l") }}')
          print(r'{{ Param.Name.endswith("world") }}')
