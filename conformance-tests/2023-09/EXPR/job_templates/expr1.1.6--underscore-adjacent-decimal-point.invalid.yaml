# Underscores in numeric literals cannot appear adjacent to the decimal
# point (Expression Language §1.1.6). "1_.5" must be rejected as a syntax
# error.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ 1_.5 }}')
