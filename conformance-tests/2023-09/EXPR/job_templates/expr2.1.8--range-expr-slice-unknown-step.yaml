# Expression Language section 2.1.8: slicing a range_expr gives a range_expr
# with a positive step and a list[int] with a negative step
# (`r[start:stop:step] -> range_expr | list[int]`). With the step from a
# parameter the slice can be a list[int], and `* 2` (list repetition, section
# 2.1.3) runs correctly whenever Step is negative, as it is by default. Type
# checking "must never reject a pair the concrete value would accept" ("Static
# Type Checking via Unresolved Values"), so the template is valid.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Frames
  type: RANGE_EXPR
  default: 1-3
- name: Step
  type: INT
  default: -1
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ Param.Frames[::Param.Step] * 2 }}')
