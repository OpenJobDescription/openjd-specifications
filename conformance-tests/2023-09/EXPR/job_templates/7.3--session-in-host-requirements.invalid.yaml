# Session.WorkingDirectory is not available in submission-time context (host requirements)
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - "{{ Session.WorkingDirectory }}"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
