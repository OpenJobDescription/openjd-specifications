specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
- TASK_CHUNKING
name: TestJob
parameterDefinitions:
- name: X
  type: INT
  default: 5
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: "1-10"
      chunks:
        defaultTaskCount: 5
        rangeConstraint: CONTIGUOUS
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ Param.X + len(Task.Param.Frame) }}')"
