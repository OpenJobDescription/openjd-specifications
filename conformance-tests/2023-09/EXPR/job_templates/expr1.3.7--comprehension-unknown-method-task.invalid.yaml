# The iterable comes from a task parameter, known only when a task runs, so a run
# may keep no element. But no type has a method uper(), so every run that
# evaluates the element expression fails on it, and static type checking reports
# it rather than leaving it to the task (Static Type Checking, Names that Resolve
# Nowhere; §1.3.7).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Names
      type: STRING
      range: ["a,b"]
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{ [s.uper() for s in Task.Param.Names.split(\",\")] }}')"
