# Expression Language "Conditional Expressions with Unknown Conditions" and
# 2.1.3: with an unresolved condition, `Param.Count if Param.UseCount else
# ["a"]` is `unresolved[int | list[string]]`, "since either could be the
# runtime result". `* 2` on the list[string] is list repetition, and indexing
# that list runs correctly whenever UseCount is false (it gives 'a' for the
# default values). Template validation must accept the template.
#
# Relies on an operation on a union-typed operand succeeding when one member
# can succeed, which the spec states for target-type coercion but not for
# operator overloads.
#
# openjd-rs picks the `__mul__(int, int) -> int` overload's return type for
# the union operand, types the product as int, and rejects the template with
# "No matching signature for __getitem__(int, int)" (found by fuzzing,
# openjd-rs#442).
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Count
  type: INT
  default: 5
- name: UseCount
  type: BOOL
  default: false
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print(r'{{ ((Param.Count if Param.UseCount else ["a"]) * 2)[0] }}')
