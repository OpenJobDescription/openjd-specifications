# With EXPR enabled, job parameter type names are case-insensitive.
# 2--type-case-insensitive.yaml tests one spelling per type; this fixture
# tests adversarial mixed-case spellings that an implementation matching on
# a fixed set of spellings (rather than case-folding) would reject.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: MyInt
  type: iNt
- name: MyFloat
  type: fLoAt
- name: MyString
  type: sTrInG
- name: MyPath
  type: PaTh
- name: MyBool
  type: bOoL
  default: true
- name: MyRangeExpr
  type: rAnGe_ExPr
  default: "1-10"
- name: MyListInt
  type: "LiSt[iNt]"
  default: [1, 2]
- name: MyListString
  type: "lIsT[StRiNg]"
  default: ["a"]
- name: MyListFloat
  type: "LisT[fLOat]"
  default: [1.5]
- name: MyListPath
  type: "liST[paTH]"
  default: ["/tmp/a"]
- name: MyListBool
  type: "lIsT[bOoL]"
  default: [true, false]
- name: MyListListInt
  type: "LiSt[lIsT[iNt]]"
  default: [[1], [2, 3]]
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
