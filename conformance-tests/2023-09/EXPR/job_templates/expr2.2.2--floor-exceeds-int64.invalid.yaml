# Expression Language §2.2.2 (floor) + the int64 range rule (see below):
# floor(x: float) -> int must produce an int64 value. 1e300 is a finite
# float far outside the 64-bit signed range (~9.22e18), so the conversion
# must be rejected rather than saturating or wrapping. ceil has its own
# fixture (expr2.2.2--ceil-exceeds-int64): bundling both into one
# abort-on-first-error template would leave the second function unpinned.
# The int64 range rule: Expression Language §1.2.1 types `int` as a 64-bit
# signed integer (−2^63 to 2^63−1), and RFC 0005 §3 says "Any operation that
# produces an integer value outside this range is an error".
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  let:
  - 'f = floor(1e300)'
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - |
          print(r'F:{{ f }}')
