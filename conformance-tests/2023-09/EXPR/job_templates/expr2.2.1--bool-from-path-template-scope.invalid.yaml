# Expression Language §2.2.1: `bool()` of a path is an error.
# In TEMPLATE scope (here the job name) a literal path has POSIX semantics
# and is evaluated when the template is checked, so the check rejects it.
# The same expression in a host-context field is checked only at run time:
# see jobs/expr2.2.1--bool-from-path.test.yaml.
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: '{{ bool(path("/tmp")) }}'
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - -c
        - print('ok')
