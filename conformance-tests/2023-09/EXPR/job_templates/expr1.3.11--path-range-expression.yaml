specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
parameterDefinitions:
- name: Dir
  type: STRING
  default: /tmp/renders
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: File
      type: PATH
      range: "{{ [path(Param.Dir) / 'a.exr', path(Param.Dir) / 'b.exr'] }}"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'{{Task.Param.File}}')"
