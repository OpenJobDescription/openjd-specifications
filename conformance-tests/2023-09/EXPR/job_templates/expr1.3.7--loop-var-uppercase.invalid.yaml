# Uppercase loop variable should be rejected (could shadow spec-defined symbols)
specificationVersion: jobtemplate-2023-09
extensions:
- EXPR
name: TestJob
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - >-
          print(r'{{ [X for X in [1, 2]] }}')
