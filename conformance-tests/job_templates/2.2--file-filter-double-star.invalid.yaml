specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: MyPath
  type: PATH
  objectType: FILE
  userInterface:
    control: CHOOSE_INPUT_FILE
    fileFilters:
    - label: Invalid
      patterns:
      - '**'
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print('{{Param.MyPath}}')"
