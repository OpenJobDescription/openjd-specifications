specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  hostRequirements:
    amounts:
    - name: amount.worker.vcpu
      min: 4
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
      - macos
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
