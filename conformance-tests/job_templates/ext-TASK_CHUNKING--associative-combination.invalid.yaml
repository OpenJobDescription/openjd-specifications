specificationVersion: jobtemplate-2023-09
extensions:
  - TASK_CHUNKING
name: ChunkTest
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: "CHUNK[INT]"
      range: "1-5"
      chunks:
        defaultTaskCount: 5
        rangeConstraint: CONTIGUOUS
    - name: Scene
      type: STRING
      range: [a, b, c, d, e]
    combination: "(Frame, Scene)"
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
