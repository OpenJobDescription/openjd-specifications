specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range:
      - 1
      - 2
    - name: Scene
      type: STRING
      range:
      - a
      - b
    - name: Quality
      type: STRING
      range:
      - low
      - high
    combination: (Frame, Scene) * Quality
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
