specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: ImageFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    fileFilters:
    - label: Image Files
      patterns:
      - '*.png'
      - '*.jpg'
      - '*.exr'
    - label: All Files
      patterns:
      - '*'
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print('{{Param.ImageFile}}')"
