specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  stepEnvironments:
  - name: StepEnv
    script:
      embeddedFiles:
      - name: setup
        type: TEXT
        filename: setup.sh
        data: '#!/bin/bash

          export MY_VAR=value'
      actions:
        onEnter:
          command: '{{Env.File.setup}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
