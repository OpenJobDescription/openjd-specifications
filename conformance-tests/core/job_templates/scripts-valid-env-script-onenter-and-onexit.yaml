specificationVersion: jobtemplate-2023-09
name: TestJob
jobEnvironments:
- name: TestEnv
  script:
    actions:
      onEnter:
        command: python
        args:
        - "-c"
        - "print(r'entering')"
      onExit:
        command: python
        args:
        - "-c"
        - "print(r'exiting')"
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
