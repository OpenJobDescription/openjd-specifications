specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: Feature1
  type: STRING
  default: gpu
- name: Feature2
  type: STRING
  default: cuda
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: attr.custom.features
      allOf:
      - '{{Param.Feature1}}'
      - '{{Param.Feature2}}'
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
