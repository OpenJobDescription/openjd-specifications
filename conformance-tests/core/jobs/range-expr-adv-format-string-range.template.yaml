specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: Start
  type: STRING
  default: "1"
- name: End
  type: STRING
  default: "5"
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Val
      type: INT
      range: '{{Param.Start}}-{{Param.End}}'
  script:
    actions:
      onRun:
        command: echo
        args:
        - VAL:{{Task.Param.Val}}
