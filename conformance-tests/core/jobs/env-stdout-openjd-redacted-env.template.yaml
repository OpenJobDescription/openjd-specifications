specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
name: EnvStdoutRedactedVar
jobEnvironments:
  - name: RedactedEnv
    script:
      actions:
        onEnter:
          command: bash
          args: ["-c", "echo 'openjd_redacted_env: SECRET=password123'"]
steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: bash
          args: ["-c", "echo SECRET_IS:$SECRET"]
