specificationVersion: jobtemplate-2023-09
name: TestJob
parameterDefinitions:
- name: Foo
  type: INT
  minValue: 5
  maxValue: 10
  default: 8
- name: Bar
  type: STRING
  minLength: 20
  maxLength: 30
  default: bbbbbbbbbbbbbbbbbbbbbbbbb
steps:
- name: Step1
  script:
    actions:
      onRun:
        command: echo
        args:
        - MERGE:Foo={{Param.Foo}},Bar={{Param.Bar}}
