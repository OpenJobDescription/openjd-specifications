specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: A
      type: STRING
      range:
      - '1'
      - '2'
      - '3'
    - name: B
      type: STRING
      range:
      - x
      - y
      - z
    combination: (A, B)
  script:
    actions:
      onRun:
        command: echo
        args:
        - TASK:A={{Task.Param.A}},B={{Task.Param.B}}
