specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: A
      type: STRING
      range:
      - '1'
      - '2'
    - name: B
      type: STRING
      range:
      - x
      - y
    - name: C
      type: STRING
      range:
      - '10'
      - '20'
    - name: D
      type: STRING
      range:
      - a
      - b
    combination: (A * B, C * D)
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print(r'TASK:A={{Task.Param.A}},B={{Task.Param.B}},C={{Task.Param.C}},D={{Task.Param.D}}')"
