specificationVersion: jobtemplate-2023-09
extensions:
  - FEATURE_BUNDLE_1
name: EndOfLineCRLF
steps:
- name: Step1
  script:
    embeddedFiles:
    - name: script
      type: TEXT
      filename: run.bat
      endOfLine: CRLF
      data: |
        @echo off
        echo Hello
    actions:
      onRun:
        command: cmd
        args:
        - /c
        - "{{Task.File.script}}"
