# Spec 3.3: capability names are case-insensitive, so these are duplicates
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
    - name: ATTR.WORKER.OS.FAMILY
      anyOf:
      - windows
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
