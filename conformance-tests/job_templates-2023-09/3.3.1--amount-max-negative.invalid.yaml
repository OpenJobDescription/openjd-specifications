# Tests that amount max must be positive (Spec 3.3.1)
# max: <positivefloat> means max > 0
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
  - name: Step1
    hostRequirements:
      amounts:
        - name: amount.worker.vcpu
          max: -5
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
